function tokenize(source){
  const lines=source.replace(/\r/g,"").split("\n");
  const toks=[]; const errors=[];
  const re=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\d+(?:\.\d+)?)|([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9]*)|(<-|←|>=|<=|<>|==|!=|[+\-*\/%=<>()\[\],.:])/g;
  const kws=new Set(["ALGORITHME","ALGORITHM","ALGO","VARIABLES","VARIABLE","BEGIN","DEBUT","END","FIN","SI","IF","ALORS","THEN","SINON","ELSE","FINSI","ENDIF","POUR","FOR","À","A","TO","PAS","STEP","FINPOUR","ENDFOR","TANTQUE","WHILE","FINTANTQUE","ENDWHILE","RÉPÉTER","REPETER","REPEAT","JUSQUA","JUSQU’À","UNTIL","FONCTION","FUNCTION","FINFONCTION","ENDFUNCTION","PROCEDURE","PROCEDURE","FINPROCEDURE","ENDPROCEDURE","RETOURNER","RETURN","LIRE","READ","ECRIRE","WRITE","VRAI","TRUE","FAUX","FALSE","ET","AND","OU","OR","NON","NOT"]);
  const types=new Set(["ENTIER","REEL","RÉEL","CHAINE","CARACTERE","BOOLEEN"]);
  lines.forEach((line,li)=>{
    let m; while((m=re.exec(line))){
      const [raw,str,num,id,op]=m;
      let kind=str?"str":num?"num":id?(kws.has(id.toUpperCase())?"kw":types.has(id.toUpperCase())?"type":"id"):"op";
      toks.push({raw,kind,line:li+1,col:m.index+1});
    }
  });
  return {lines,toks,errors};
}
function highlightCode(src){
  const {lines}=tokenize(src);
  const html=lines.map(line=>{
    let out="", last=0;
    const re=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\d+(?:\.\d+)?)|([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9]*)|(<-|←|>=|<=|<>|==|!=|[+\-*\/%=<>()\[\],.:])/g;
    let m;
    while((m=re.exec(line))){
      out += esc(line.slice(last,m.index));
      const raw=m[0], up=raw.toUpperCase();
      let c=m[1]?"str":m[2]?"num":m[3]?(["ALGORITHME","ALGORITHM","ALGO","VARIABLES","VARIABLE","DEBUT","BEGIN","FIN","END","SI","IF","ALORS","THEN","SINON","ELSE","FINSI","ENDIF","POUR","FOR","À","A","TO","PAS","STEP","FINPOUR","ENDFOR","TANTQUE","WHILE","FINTANTQUE","ENDWHILE","RÉPÉTER","REPETER","REPEAT","JUSQUA","JUSQU’À","UNTIL","FONCTION","FUNCTION","FINFONCTION","ENDFUNCTION","PROCEDURE","FINPROCEDURE","ENDPROCEDURE","RETOURNER","RETURN","LIRE","READ","ECRIRE","WRITE","VRAI","TRUE","FAUX","FALSE","ET","AND","OU","OR","NON","NOT"].includes(up)?"kw":(["ENTIER","REEL","RÉEL","CHAINE","CARACTERE","BOOLEEN"].includes(up)?"type":"fn")):"op";
      out += `<span class="${c}">${esc(raw)}</span>`; last=m.index+raw.length;
    }
    return out+esc(line.slice(last));
  }).join("\n");
  return html || "\n";
}
function renderEditor(containerId, initial){
  $(containerId).innerHTML=`
    <div class="codeBox">
      <div class="codeHead"><span>Éditeur de pseudo-code</span><span>Ctrl+Entrée = exécuter</span></div>
      <div class="codeWrap">
        <div class="lineNums" id="${containerId.slice(1)}-nums">1</div>
        <div class="codeArea">
          <div class="highlight" id="${containerId.slice(1)}-hi"></div>
          <textarea class="editor" id="${containerId.slice(1)}-ed" spellcheck="false" aria-label="Éditeur"></textarea>
        </div>
      </div>
    </div>`;
  const ed=$(containerId+"-ed"), hi=$(containerId+"-hi"), nums=$(containerId+"-nums");
  ed.value=initial||"";
  function sync(){
    hi.innerHTML=highlightCode(ed.value);
    nums.textContent=ed.value.split("\n").map((_,i)=>i+1).join("\n");
    hi.scrollTop=ed.scrollTop; hi.scrollLeft=ed.scrollLeft; nums.scrollTop=ed.scrollTop;
  }
  ed.addEventListener("input",sync); ed.addEventListener("scroll",()=>{hi.scrollTop=ed.scrollTop;hi.scrollLeft=ed.scrollLeft;nums.scrollTop=ed.scrollTop});
  ed.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const a=ed.selectionStart,b=ed.selectionEnd;ed.value=ed.value.slice(0,a)+"    "+ed.value.slice(b);ed.selectionStart=ed.selectionEnd=a+4;sync();}});
  sync();
  return ed;
}

/* ---------- Lexer / Parser ---------- */
class Parser{
  constructor(src){
    this.lines=src.replace(/\r/g,"").split("\n");
    this.i=0; this.vars={}; this.functions={}; this.ast=[];
    this.errors=[]; this.declared=new Set();
  }
  error(msg,line=this.i+1){this.errors.push(`Ligne ${line} : ${msg}`);}
  strip(line){return line.replace(/\/\/.*$/,"" ).replace(/#.*$/,"").trim();}
  parse(){
    while(this.i<this.lines.length){
      let s=this.strip(this.lines[this.i]);
      if(!s || /^<br\s*\/?>(?:\s*)$/i.test(s)){this.i++;continue}
      const up=s.toUpperCase();
      if(/^(FONCTION|FUNCTION)\s+/i.test(s)) this.parseFunction();
      else if(/^PROCEDURE\s+/i.test(s)) this.parseProcedure();
      else if(/^(ALGORITHME|ALGORITHM|ALGO)(?:\s+.*)?$/i.test(s) || /^(VARIABLES|VARIABLE|DEBUT|BEGIN|FIN|END)$/i.test(s) || up==="{" || up==="}") this.i++;
      else this.ast.push(this.parseStmt());
    }
    return {ast:this.ast,functions:this.functions,errors:this.errors};
  }
  parseFunction(){
    const line=this.lines[this.i]; const m=/^(?:FONCTION|FUNCTION)\s+([A-Za-zÀ-ÿ_]\w*)\s*\((.*?)\)\s*(?::\s*([A-Za-zÀ-ÿ_]+))?/i.exec(this.strip(line));
    if(!m){this.error("déclaration de fonction invalide");this.i++;return}
    const name=m[1], params=(m[2].trim()?m[2].split(",").map(x=>x.trim().split(/\s*:\s*/)[0].replace(/^(?:ENTREE_SORTIE|ENTRÉE_SORTIE|ENTREE|ENTRÉE|SORTIE|INOUT|OUT|IN)\s+/i,"").trim()).filter(Boolean):[]);
    this.i++;
    if(this.i<this.lines.length && /^(DEBUT|BEGIN)$/i.test(this.strip(this.lines[this.i]))) this.i++;
    const body=[];
    while(this.i<this.lines.length && !/^(FINFONCTION|ENDFUNCTION)\b/i.test(this.strip(this.lines[this.i]))){ if(this.strip(this.lines[this.i])) body.push(this.parseStmt()); else this.i++; }
    if(this.i<this.lines.length)this.i++;
    this.functions[name.toUpperCase()]={name,params,body,type:m[3]||""};
  }
  parseProcedure(){ /* Treat procedures like void functions. */
    const line=this.lines[this.i]; const m=/^PROCEDURE\s+([A-Za-zÀ-ÿ_]\w*)\s*\((.*?)\)/i.exec(this.strip(line));
    if(!m){this.error("déclaration de procédure invalide");this.i++;return}
    const name=m[1], params=m[2].trim()?m[2].split(",").map(x=>x.trim().split(/\s*:\s*/)[0].replace(/^(?:ENTREE_SORTIE|ENTRÉE_SORTIE|ENTREE|ENTRÉE|SORTIE|INOUT|OUT|IN)\s+/i,"").trim()).filter(Boolean):[];
    this.i++;
    if(this.i<this.lines.length && /^(DEBUT|BEGIN)$/i.test(this.strip(this.lines[this.i]))) this.i++;
    const body=[];
    while(this.i<this.lines.length && !/^(FINPROCEDURE|ENDPROCEDURE)\b/i.test(this.strip(this.lines[this.i]))){if(this.strip(this.lines[this.i]))body.push(this.parseStmt());else this.i++;}
    if(this.i<this.lines.length)this.i++;
    this.functions[name.toUpperCase()]={name,params,body,type:""};
  }
  parseBlock(endWords){
    const out=[];
    while(this.i<this.lines.length){
      const s=this.strip(this.lines[this.i]), up=s.toUpperCase();
      if(!s){this.i++;continue}
      if(endWords.some(w=>up===w || up.startsWith(w+" ")))break;
      out.push(this.parseStmt());
    }
    return out;
  }
  parseStmt(){
    const lineNo=this.i+1; let s=this.strip(this.lines[this.i]); const up=s.toUpperCase();
    if(/^(SI|IF)\b/i.test(s)){
      const m=/^(?:SI|IF)\s+(.+?)\s+(?:ALORS|THEN)\s*$/i.exec(s);
      if(!m){this.error("condition SI mal formée, utilisez SI condition ALORS",lineNo);this.i++;return {type:"noop",line:lineNo}}
      this.i++; const yes=this.parseBlock(["SINON","ELSE","FINSI","ENDIF"]); let no=[];
      if(this.i<this.lines.length && /^(SINON|ELSE)\b/i.test(this.strip(this.lines[this.i]))){this.i++;no=this.parseBlock(["FINSI","ENDIF"])}
      if(this.i<this.lines.length && /^(FINSI|ENDIF)\b/i.test(this.strip(this.lines[this.i])))this.i++; else this.error("FINSI manquant",lineNo);
      return {type:"if",cond:m[1],yes,no,line:lineNo}
    }
    if(/^(POUR|FOR)\b/i.test(s)){
      const m=/^(?:POUR|FOR)\s+([A-Za-zÀ-ÿ_]\w*)\s*(?:<-|←)\s*(.+?)\s+(?:À|A|TO)\s+(.+?)(?:\s+(?:PAS|STEP)\s+(.+))?$/i.exec(s);
      if(!m){this.error("boucle POUR mal formée",lineNo);this.i++;return {type:"noop",line:lineNo}}
      this.i++; const body=this.parseBlock(["FINPOUR","ENDFOR"]);
      if(this.i<this.lines.length)this.i++; else this.error("FINPOUR manquant",lineNo);
      return {type:"for",v:m[1],from:m[2],to:m[3],step:m[4]||"1",body,line:lineNo}
    }
    if(/^(TANTQUE|WHILE)\b/i.test(s)){
      const m=/^(?:TANTQUE|WHILE)\s+(.+)$/i.exec(s); this.i++; const body=this.parseBlock(["FINTANTQUE","ENDWHILE"]);
      if(this.i<this.lines.length)this.i++; else this.error("FINTANTQUE manquant",lineNo);
      return {type:"while",cond:m?m[1]:"FAUX",body,line:lineNo}
    }
    if(/^(R[ÉE]P[ÉE]TER|REPEAT)\b/i.test(s)){
      this.i++; const body=this.parseBlock(["JUSQUA","JUSQU’À","UNTIL"]);
      let cond="FAUX"; if(this.i<this.lines.length){const z=this.strip(this.lines[this.i]);cond=z.replace(/^(?:JUSQUA|JUSQU’À|UNTIL)\s+/i,"");this.i++;} else this.error("JUSQUA manquant",lineNo);
      return {type:"repeat",cond,body,line:lineNo}
    }
    if(/^(RETOURNER|RETURN)\b/i.test(s)){this.i++;return {type:"return",expr:s.replace(/^(?:RETOURNER|RETURN)\s*/i,""),line:lineNo}}
    if(/^(LIRE|READ)\b/i.test(s)){this.i++;return {type:"read",args:s.replace(/^(?:LIRE|READ)\s*\(?/i,"").replace(/\)?\s*$/,"").split(",").map(x=>x.trim()).filter(Boolean),line:lineNo}}
    if(/^(ECRIRE|WRITE)\b/i.test(s)){this.i++;return {type:"write",expr:s.replace(/^(?:ECRIRE|WRITE)\s*\(?/i,"").replace(/\)?\s*$/,""),line:lineNo}}
    if(/^(?:APPELER|CALL)\b/i.test(s)){
      const cm=/^(?:APPELER|CALL)\s+([A-Za-zÀ-ÿ_]\w*)\s*\((.*)\)\s*$/i.exec(s);
      if(!cm){this.error("appel de procédure invalide, utilisez APPELER nom(arguments)",lineNo);this.i++;return {type:"noop",line:lineNo}}
      this.i++;return {type:"call",name:cm[1],args:cm[2].trim()?splitArgs(cm[2]):[],line:lineNo}
    }
    const directCall=/^([A-Za-zÀ-ÿ_]\w*)\s*\((.*)\)\s*$/.exec(s);
    if(directCall){this.i++;return {type:"call",name:directCall[1],args:directCall[2].trim()?splitArgs(directCall[2]):[],line:lineNo}}
    // explicit declaration
    const dm=/^([A-Za-zÀ-ÿ_]\w*)\s*:\s*(ENTIER|REEL|R[ÉE]EL|CHAINE|CARACTERE|BOOLEEN)$/i.exec(s);
    if(dm){this.declared.add(dm[1].toUpperCase());this.i++;return {type:"declare",name:dm[1],dtype:dm[2],line:lineNo}}
    const am=/^([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])*)\s*(?:<-|←)\s*(.+)$/i.exec(s);
    if(am){this.i++;return {type:"assign",target:am[1],expr:am[2],line:lineNo}}
    // skip braces/noise
    if(["FIN","END","FINSI","ENDIF","FINPOUR","ENDFOR","FINTANTQUE","ENDWHILE","FINFONCTION","ENDFUNCTION","FINPROCEDURE","ENDPROCEDURE","SINON","ELSE"].includes(up)){this.i++;return {type:"noop",line:lineNo}}
    this.error("instruction inconnue : "+s,lineNo);this.i++;return {type:"noop",line:lineNo}
  }
}

/* Expression evaluator: converts the pedagogy syntax into safe-ish JS expressions.
   It does not execute arbitrary statement code; only controlled expressions. */
function evalExpr(expr, env, funcs, callStack=[]){
  let x=String(expr).trim();
  x=x.replace(/<>/g,"!=").replace(/\bET\b/gi,"&&").replace(/\bAND\b/gi,"&&").replace(/\bOU\b/gi,"||").replace(/\bOR\b/gi,"||").replace(/\bNON\b/gi,"!").replace(/\bNOT\b/gi,"!");
  x=x.replace(/(^|[^<>!=])=([^=]|$)/g,"$1===$2");
  x=x.replace(/\bVRAI\b/gi,"true").replace(/\bFAUX\b/gi,"false").replace(/\bTRUE\b/gi,"true").replace(/\bFALSE\b/gi,"false");
  x=x.replace(/<>/g,"!=").replace(/\bET\b/gi,"&&").replace(/\bOU\b/gi,"||").replace(/\bNON\b/gi,"!");
  x=x.replace(/\bVRAI\b/gi,"true").replace(/\bFAUX\b/gi,"false");
  x=x.replace(/([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)\s+DIV\s+([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)/gi,"Math.trunc($1/$2)");
  x=x.replace(/([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)\s+MOD\s+([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)/gi,"($1%$2)");
  x=x.replace(/\bLONGUEUR\s*\(/gi,"LEN(");
  // Translate function calls to our evaluator in a controlled recursion-aware way.
  const builtin = (name,args) => {
    const u=name.toUpperCase(), av=args.trim()?splitArgs(args).map(a=>evalExpr(a,env,funcs,callStack)):[];
    if(u==="POSITION"||u==="POS"||u==="FIND"||u==="CHERCHER") return String(av[0]??"").indexOf(String(av[1]??""));
    if(u==="CONTIENT"||u==="CONTAINS") return String(av[0]??"").includes(String(av[1]??""));
    if(u==="SOUS_CHAINE"||u==="SUBSTRING"||u==="SUBSTR") return String(av[0]??"").substring(Number(av[1])||0,(Number(av[1])||0)+(Number(av[2])||0));
    if(u==="MAJUSCULE"||u==="UPPER"||u==="MAJ") return String(av[0]??"").toUpperCase();
    if(u==="MINUSCULE"||u==="LOWER"||u==="MIN") return String(av[0]??"").toLowerCase();

class Executor{

  result(){return {output:this.output.join(" "),trace:this.trace,env:this.env,returned:this.returned,returnValue:this.returnValue,steps:this.steps}}
  guard(node){if(++this.steps>this.maxSteps)throw new Error("nombre maximal d’étapes dépassé : possible boucle infinie");this.log(node,"exécution");}

  exec(node){

        const values=node.args.map(arg=>getExprWithArrays(arg,this.env,this.funcs));
        if(values.length!==proc.params.length)throw new Error(`la procédure ${node.name} attend ${proc.params.length} paramètre(s), ${values.length} fourni(s)`);

function analyzeComplexity(src){
  const s=src.toUpperCase().replace(/\s+/g," ");
  const forCount=(s.match(/\bPOUR\b/g)||[]).length, whileCount=(s.match(/\bTANTQUE\b/g)||[]).length;

  let complexity="O(1)", reason="peu d’itérations détectables";
  if(nested>=1 || forCount>=2 && /FINPOUR[\s\S]*POUR/.test(s)===false){complexity="O(n²)";reason="présence de boucles imbriquées ou multiples dans le fragment";}
  else if(forCount||whileCount){complexity="O(n)";reason="une boucle principale est détectée";}
  if(/DIV\s+2|\/\s*2|DICHOTOM|MILIEU/.test(s)) {complexity="O(log n)";reason="division répétée de l’espace de recherche détectée";}
  return {time:complexity,memory:"O(1) à O(n) selon les structures utilisées",reason};
}
function runCode(src,input){
  const p=new Parser(src), parsed=p.parse();
  if(parsed.errors.length)return {ok:false,errors:parsed.errors,complexity:analyzeComplexity(src)};
  const ex=new Executor(parsed.ast,parsed.functions,{input,maxSteps:10000});
  const r=ex.run(); r.ok=!r.error; r.errors=r.error?[`Ligne ${r.line} : ${r.error}`]:[]; r.complexity=analyzeComplexity(src); return r;
}

function renderSimulator(){
  $("#view-simulator").innerHTML=`<div class="card"><div class="badge">🎞️ Visualisation algorithmique</div><h1>Simulateur animé</h1><p class="muted">Observez les échanges, comparaisons et décisions. Les simulations sont synchronisées avec les notions du cours.</p></div><div class="grid2" style="margin-top:16px"><div class="card"><h3>Algorithme</h3><select id="simType" style="width:100%;padding:9px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line)"><option value="bubble">Tri à bulles</option><option value="selection">Tri par sélection</option><option value="insertion">Tri par insertion</option><option value="binary">Recherche dichotomique</option></select><label class="muted" style="display:block;font-size:12px;margin-top:12px">Données<input id="simData" value="8,3,7,1,5,2,9" style="width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px"></label><div class="simControls"><button class="btn primary" id="simPlay">▶ Animer</button><button class="btn" id="simStep">⏭ Une étape</button><button class="btn" id="simReset">↺ Réinitialiser</button></div></div><div class="card"><h3 id="simTitle">Tri à bulles</h3><div class="simStage"><div class="bars" id="bars"></div></div><p class="muted" id="simInfo">Prêt.</p></div></div>`;

  function build(){const data=$("#simData").value.split(",").map(Number).filter(Number.isFinite).slice(0,18),a=data.slice(),typ=$("#simType").value;steps=[];if(typ==="binary"){a.sort((x,y)=>x-y);const target=a[Math.floor(a.length/2)]??0;let l=0,r=a.length-1;while(l<=r){const m=Math.floor((l+r)/2);steps.push({a:a.slice(),active:[m],msg:`Comparer avec la case ${m} (${a[m]})`});if(a[m]===target)break;if(a[m]<target)l=m+1;else r=m-1;}$("#simTitle").textContent="Recherche dichotomique";}else{if(typ==="bubble")for(let i=0;i<a.length;i++)for(let j=0;j<a.length-1-i;j++){steps.push({a:a.slice(),active:[j,j+1],msg:`Comparer ${a[j]} et ${a[j+1]}`});if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];steps.push({a:a.slice(),active:[j,j+1],msg:"Échanger"})}}if(typ==="selection")for(let i=0;i<a.length-1;i++){let m=i;for(let j=i+1;j<a.length;j++){steps.push({a:a.slice(),active:[j,m],msg:"Chercher le minimum"});if(a[j]<a[m])m=j}[a[i],a[m]]=[a[m],a[i]];steps.push({a:a.slice(),active:[i,m],msg:"Placer le minimum"})}if(typ==="insertion")for(let i=1;i<a.length;i++){const key=a[i];let j=i-1;while(j>=0&&a[j]>key){steps.push({a:a.slice(),active:[j,j+1],msg:"Décaler vers la droite"});a[j+1]=a[j];j--}a[j+1]=key;steps.push({a:a.slice(),active:[j+1],msg:"Insérer la clé"})}$(`#simInfo`).textContent="";$("#simTitle").textContent={bubble:"Tri à bulles",selection:"Tri par sélection",insertion:"Tri par insertion"}[typ];}idx=0;draw(steps[0]||{a,active:[],msg:"Aucune étape"});}
  function draw(st){
    const max=Math.max(1,...st.a.map(v=>Math.abs(Number(v)||0)));
    $("#bars").innerHTML=st.a.map((v,i)=>`<div class="bar ${st.active.includes(i)?"active":""}" title="Cellule T[${i}], valeur ${v}" aria-label="Cellule T[${i}], valeur ${v}" style="height:${Math.max(10,Math.min(88,Math.abs(Number(v)||0)/max*88))}%"><span class="barValue">${esc(v)}</span><span class="barIndex">T[${i}]</span></div>`).join("");

}

function solutionFor(id){
  return ({
    1:`LIRE(a)\nLIRE(b)\nECRIRE(a + b)`,
    2:`LIRE(n)\nSI n MOD 2 = 0 ALORS\n    ECRIRE("PAIR")\nSINON\n    ECRIRE("IMPAIR")\nFINSI`,
    3:`somme ← 0\nPOUR i ← 1 À n\n    somme ← somme + i\nFINPOUR\nECRIRE(somme)`,
    4:`maximum ← T[0]\nPOUR i ← 1 À LONGUEUR(T)-1\n    SI T[i] > maximum ALORS\n        maximum ← T[i]\n    FINSI\nFINPOUR\nECRIRE(maximum)`,
    5:`POUR i ← 0 À LONGUEUR(T)-1\n    SI T[i] = cible ALORS\n        trouve ← VRAI\n    FINSI\nFINPOUR`,
    6:`SI n <= 1 ALORS\n    RETOURNER 1\nSINON\n    RETOURNER n * factorielle(n-1)\nFINSI`,
    7:`POUR i ← 0 À LONGUEUR(T)-2\n    min ← i\n    POUR j ← i+1 À LONGUEUR(T)-1\n        SI T[j] < T[min] ALORS\n            min ← j\n        FINSI\n    FINPOUR\n    tmp ← T[i]\n    T[i] ← T[min]\n    T[min] ← tmp\nFINPOUR`,
    8:`Deux boucles de taille n imbriquées → O(n²).`
  })[id]||"";
}

function parseMatrixText(s){const rows=String(s).trim().split(/\n+/).map(r=>r.trim()).filter(Boolean).map(r=>r.replace(/[|;]/g,",").split(/[ ,]+/).map(Number));if(!rows.length||rows.some(r=>!r.length||r.some(x=>!Number.isFinite(x))))throw new Error("Matrice invalide");const c=rows[0].length;if(rows.some(r=>r.length!==c))throw new Error("Toutes les lignes doivent avoir le même nombre de colonnes");return rows}
function matrixGridHTML(m,editable=false,prefix="m"){const r=m.length,c=m[0].length;return `<div class="matrixGrid" style="grid-template-columns:repeat(${c},var(--matrix-cell,58px))">${m.map((row,i)=>row.map((v,j)=>editable?`<input class="matrixCell" data-${prefix}-i="${i}" data-${prefix}-j="${j}" value="${esc(v)}">`:`<div class="matrixCell ${((i+j)%2?"":"")}" style="display:grid;place-items:center">${esc(v)}</div>`).join("")).join("")}</div>`}
function renderMatrices(){
  $("#view-matrices").innerHTML=`<div class="card"><div class="badge">🔢 Laboratoire de matrices</div><h1>Calcul matriciel interactif</h1><p class="muted">Saisissez vos matrices, visualisez-les comme une grille carrée ou rectangulaire et exécutez les opérations classiques. Le même moteur accepte ADDITION_MATRICES, SOUSTRACTION_MATRICES, PRODUIT_MATRICES, TRANSPOSEE, TRACE, DETERMINANT, IDENTITE et INVERSE_MATRICE.</p></div><div class="matrixLab" style="margin-top:14px"><div class="card"><h3>Paramètres</h3><label class="muted" style="font-size:12px">Opération<select id="matOp" style="width:100%;margin-top:5px;padding:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px"><option value="add">A + B</option><option value="sub">A − B</option><option value="mul">A × B</option><option value="transpose">Aᵀ</option><option value="trace">Trace(A)</option><option value="det">Det(A)</option><option value="inv">A⁻¹ (1×1/2×2)</option><option value="identity">Identité</option><option value="scalar">k × A</option></select></label><label class="muted" style="display:block;font-size:12px;margin-top:10px">k <input id="matK" type="number" value="2" step="any" style="width:100%;margin-top:5px;padding:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px"></label><label class="muted" style="display:block;font-size:12px;margin-top:10px">A<textarea id="matA" rows="4" style="width:100%;margin-top:5px;padding:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px">1 2\n3 4</textarea></label><label class="muted" style="display:block;font-size:12px;margin-top:10px">B<textarea id="matB" rows="4" style="width:100%;margin-top:5px;padding:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px">5 6\n7 8</textarea></label><button class="btn primary" id="matRun" style="margin-top:10px;width:100%">▶ Calculer</button><button class="btn" id="matDemo" style="margin-top:7px;width:100%">↺ Charger exemples</button></div><div class="card"><div class="matrixInputs"><div class="matrixBox"><h3>A</h3><div id="matAPreview"></div></div><div class="matrixBox"><h3>B</h3><div id="matBPreview"></div></div></div><h3 style="margin-top:14px">Résultat</h3><div class="matrixBox" id="matResult">Effectuez un calcul.</div><div class="matrixEquation" id="matExplain">La formule utilisée apparaîtra ici.</div><div class="metricGrid" style="margin-top:10px"><div class="metric"><span class="muted">Dimension A</span><b id="matDimA">—</b></div><div class="metric"><span class="muted">Dimension B</span><b id="matDimB">—</b></div><div class="metric"><span class="muted">Opération</span><b id="matMetricOp">—</b></div><div class="metric"><span class="muted">Statut</span><b id="matStatus">Prêt</b></div></div></div></div>`;
  function drawPreview(){try{$("#matAPreview").innerHTML=matrixGridHTML(parseMatrixText($("#matA").value));const b=parseMatrixText($("#matB").value);$("#matBPreview").innerHTML=matrixGridHTML(b);const a=parseMatrixText($("#matA").value);$("#matDimA").textContent=a.length+"×"+a[0].length;$("#matDimB").textContent=b.length+"×"+b[0].length}catch(e){$("#matStatus").textContent="Erreur"}}
  function calc(){try{const a=parseMatrixText($("#matA").value),b=parseMatrixText($("#matB").value),op=$("#matOp").value,k=Number($("#matK").value);let r,exp="";if(op==="add"){r=matrixAdd(a,b);exp="C[i][j] = A[i][j] + B[i][j]"}if(op==="sub"){r=matrixSub(a,b);exp="C[i][j] = A[i][j] − B[i][j]"}if(op==="mul"){r=matrixMul(a,b);exp="C[i][j] = Σ A[i][k] × B[k][j]"}if(op==="transpose"){r=matrixTranspose(a);exp="Aᵀ[j][i] = A[i][j]"}if(op==="trace"){r=matrixTrace(a);exp="trace(A) = Σ A[i][i]"}if(op==="det"){r=matrixDet(a);exp=a.length===2?"det(A)=ad−bc":"Développement récursif par mineurs"}if(op==="inv"){r=matrixInverse(a);exp="A × A⁻¹ = I lorsque det(A) ≠ 0"}if(op==="identity"){r=matrixIdentity(a.length);exp="I[i][j] = 1 si i=j, sinon 0"}if(op==="scalar"){r=matrixScalar(k,a);exp=`C[i][j] = ${k} × A[i][j]`}$("#matResult").innerHTML=Array.isArray(r)?matrixGridHTML(r,false):`<div style="font-size:28px;font-weight:800;padding:15px">${esc(r)}</div>`;$("#matExplain").textContent=exp;$("#matMetricOp").textContent=$("#matOp").selectedOptions[0].textContent;$("#matStatus").textContent="✓ OK"}catch(e){$("#matResult").innerHTML=`<div class="result badbg">✗ ${esc(e.message)}</div>`;$("#matStatus").textContent="Erreur"}}
  $("#matRun").onclick=calc;$("#matDemo").onclick=()=>{$("#matA").value="1 2\n3 4";$("#matB").value="5 6\n7 8";drawPreview();calc()};$("#matA").oninput=drawPreview;$("#matB").oninput=drawPreview;drawPreview();calc();
}

function pedagogicalFor(s){
  const t=s.title||"";
  const found=PEDAGOGY_BY_TOPIC.find(x=>x.k.test(t));
  const text=s.text||"";
  const base=found||{why:text+" Cette notion sera étudiée progressivement, puis vérifiée par des exemples et des tests.",prereq:"Reprendre les sections précédentes du chapitre.",steps:["Lire l’énoncé et identifier les données.","Observer l’exemple fourni.","Écrire une solution simple.","Tester avec plusieurs valeurs.","Expliquer pourquoi la solution donne le résultat attendu."],errors:["Modifier trop de choses à la fois.","Ne pas tester les cas limites."]};
  return {why:s.explanation||base.why,prereq:s.prereq||base.prereq,steps:s.steps||base.steps,errors:s.commonErrors||base.errors,
    objective:s.objectives||["Comprendre la notion : "+t,"Être capable d’expliquer la méthode sans recopier l’exemple.","Écrire et tester un algorithme simple sur cette notion."],
    keypoints:s.keypoints||[t,"Entrées → traitement → sortie","Cas normal et cas limite"]};
}
COURSE.forEach(ch=>ch.sections.forEach(sec=>{const p=pedagogicalFor(sec);sec._ped=p;sec.explanation=sec.explanation||p.why;sec.objectives=sec.objectives||p.objective;sec.keypoints=sec.keypoints||p.keypoints;}));

/* Better line-numbered editor. The viewport is independently clipped, and its
   number column is translated with the textarea scroll position. */
function renderEditor(containerId, initial, editorOptions={}){

/* Make the English header form truly executable, not just highlighted. */
function normalizeAlgorithmSource(src){
  return String(src||"").split(/\n/).map(line=>{
    const t=line.trim();
    if(/^ALGORITHM\b/i.test(t)) return line.replace(/^\s*ALGORITHM\b/i,"ALGORITHME");
    if(/^ALGO\b/i.test(t)) return line.replace(/^\s*ALGO\b/i,"ALGORITHME");
    return line
      .replace(/\bBEGIN\b/gi,"DEBUT").replace(/\bEND\s+IF\b/gi,"FINSI").replace(/\bEND\s+FOR\b/gi,"FINPOUR").replace(/\bEND\s+WHILE\b/gi,"FINTANTQUE").replace(/\bEND\s+FUNCTION\b/gi,"FINFONCTION").replace(/\bEND\s+PROCEDURE\b/gi,"FINPROCEDURE")
      .replace(/\bENDIF\b/gi,"FINSI").replace(/\bENDFOR\b/gi,"FINPOUR").replace(/\bENDWHILE\b/gi,"FINTANTQUE").replace(/\bENDFUNCTION\b/gi,"FINFONCTION").replace(/\bENDPROCEDURE\b/gi,"FINPROCEDURE")
      .replace(/\bIF\b/gi,"SI").replace(/\bTHEN\b/gi,"ALORS").replace(/\bELSE\b/gi,"SINON").replace(/\bFOR\b/gi,"POUR").replace(/\bTO\b/gi,"À").replace(/\bSTEP\b/gi,"PAS").replace(/\bWHILE\b/gi,"TANTQUE").replace(/\bREPEAT\b/gi,"RÉPÉTER").replace(/\bUNTIL\b/gi,"JUSQUA").replace(/\bFUNCTION\b/gi,"FONCTION").replace(/\bRETURN\b/gi,"RETOURNER").replace(/\bREAD\b/gi,"LIRE").replace(/\bWRITE\b/gi,"ECRIRE");
  }).join("\n");
}
const _oldRunCode=runCode;
runCode=function(src,input){
  const normalized=normalizeAlgorithmSource(src);
  return _oldRunCode(normalized,input);
};

/* English FOR may use = instead of ← and one-word END forms. Accept them. */

  if(/^(\s*)(POUR|FOR)\b/i.test(original)){
    const lineNo=this.i+1,s=this.strip(original),m=/^(?:POUR|FOR)\s+([A-Za-zÀ-ÿ_]\w*)\s*(?:<-|←|:=|=)\s*(.+?)\s+(?:À|TO)\s+(.+?)(?:\s+(?:PAS|STEP)\s+(.+))?$/i.exec(s);

  }
  return _oldParserStmt.call(this);
};

/* =========================================================
   AlgoLab V18_3 — Correctifs critiques (P0 + P1)
   À placer en toute fin de <script> principal
   ========================================================= */
(function(){
  "use strict";

  /* ---------- 1. evalExpr : protection des littéraux de chaîne ---------- */
  evalExpr = function(expr, env, funcs, callStack = []) {
    const localStrings = [];
    let x = String(expr).trim();
    x = x.replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g, m => {
      localStrings.push(m);
      return `\u0001S${localStrings.length - 1}\u0001`;
    });
    const restoreLocal = s => s.replace(/\u0001S(\d+)\u0001/g, (_, i) => localStrings[Number(i)]);

    // Transformations logiques (une seule passe, sans corruption)
    x = x.replace(/<>/g, "!=")
         .replace(/\bET\b/gi, "&&").replace(/\bAND\b/gi, "&&")
         .replace(/\bOU\b/gi, "||").replace(/\bOR\b/gi, "||")
         .replace(/\bNON\b/gi, "!").replace(/\bNOT\b/gi, "!");
    x = x.replace(/(^|[^<>!])=([^=]|$)/g, "$1===$2");
    x = x.replace(/\bVRAI\b/gi, "true").replace(/\bFAUX\b/gi, "false")
         .replace(/\bTRUE\b/gi, "true").replace(/\bFALSE\b/gi, "false");
    x = x.replace(/([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)\s+DIV\s+([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)/gi, "Math.trunc($1/$2)");
    x = x.replace(/([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)\s+MOD\s+([A-Za-zÀ-ÿ_]\w*(?:\[[^\]]+\])?|\d+(?:\.\d+)?)/gi, "($1%$2)");
    x = x.replace(/\bLONGUEUR\s*\(/gi, "LEN(");

    const builtin = (name, args) => {
      const u = name.toUpperCase();
      const av = args.trim() ? splitArgs(args).map(a => evalExpr(restoreLocal(a), env, funcs, callStack)) : [];
      if (u==="POSITION"||u==="POS"||u==="FIND"||u==="CHERCHER") return String(av[0]??"").indexOf(String(av[1]??""));
      if (u==="CONTIENT"||u==="CONTAINS") return String(av[0]??"").includes(String(av[1]??""));
      if (u==="SOUS_CHAINE"||u==="SUBSTRING"||u==="SUBSTR") return String(av[0]??"").substring(Number(av[1])||0, (Number(av[1])||0)+(Number(av[2])||0));
      if (u==="MAJUSCULE"||u==="UPPER"||u==="MAJ") return String(av[0]??"").toUpperCase();
      if (u==="MINUSCULE"||u==="LOWER"||u==="MIN") return String(av[0]??"").toLowerCase();
      if (u==="SUPPRIMER_ESPACES"||u==="TRIM") return String(av[0]??"").trim();
      if (u==="REMPLACER"||u==="REPLACE") return String(av[0]??"").split(String(av[1]??"")).join(String(av[2]??""));
      if (u==="REPETER_TEXTE"||u==="REPEAT") return String(av[0]??"").repeat(Math.max(0,Number(av[1])||0));
      if (u==="VERS_ENTIER"||u==="TO_INT") return parseInt(av[0],10);
      if (u==="VERS_REEL"||u==="TO_REAL") return parseFloat(av[0]);
      if (u==="VERS_CHAINE"||u==="TO_STRING") return String(av[0]);
      if (u==="DECOUPER"||u==="SPLIT") return String(av[0]??"").split(String(av[1]??""));
      if (u==="JOINDRE"||u==="JOIN") return Array.isArray(av[0])?av[0].join(String(av[1]??"")):String(av[0]??"");
      if (u==="ADDITION_MATRICES"||u==="MATRIX_ADD") return matrixAdd(av[0],av[1]);
      if (u==="SOUSTRACTION_MATRICES"||u==="MATRIX_SUB") return matrixSub(av[0],av[1]);
      if (u==="PRODUIT_MATRICES"||u==="MATRIX_MUL") return matrixMul(av[0],av[1]);
      if (u==="TRANSPOSEE"||u==="TRANSPOSE"||u==="TRANSPOSER") return matrixTranspose(av[0]);
      if (u==="IDENTITE"||u==="IDENTITY") return matrixIdentity(Number(av[0]));
      if (u==="TRACE") return matrixTrace(av[0]);
      if (u==="DETERMINANT"||u==="DET") return matrixDet(av[0]);
      if (u==="INVERSE_MATRICE"||u==="INVERSE_MATRIX") return matrixInverse(av[0]);
      if (u==="SCALAIRE_MATRICE"||u==="MATRIX_SCALAR") return matrixScalar(Number(av[0]),av[1]);
      return undefined;
    };

    const callRe = /([A-Za-zÀ-ÿ_]\w*)\s*\(([^()]*)\)/;
    const BUILTINS = ["POSITION","POS","FIND","CHERCHER","CONTIENT","CONTAINS","SOUS_CHAINE","SUBSTRING","SUBSTR","MAJUSCULE","UPPER","MAJ","MINUSCULE","LOWER","MIN","SUPPRIMER_ESPACES","TRIM","REMPLACER","REPLACE","REPETER_TEXTE","REPEAT","VERS_ENTIER","TO_INT","VERS_REEL","TO_REAL","VERS_CHAINE","TO_STRING","DECOUPER","SPLIT","JOINDRE","JOIN","ADDITION_MATRICES","MATRIX_ADD","SOUSTRACTION_MATRICES","MATRIX_SUB","PRODUIT_MATRICES","MATRIX_MUL","TRANSPOSEE","TRANSPOSE","TRANSPOSER","IDENTITE","IDENTITY","TRACE","DETERMINANT","DET","INVERSE_MATRICE","INVERSE_MATRIX","SCALAIRE_MATRICE","MATRIX_SCALAR"];
    let guard = 0;
    while (callRe.test(x) && guard++ < 20) {
      x = x.replace(callRe, (all, name, args) => {
        const u = name.toUpperCase();
        if (BUILTINS.includes(u)) return JSON.stringify(builtin(name, args));
        if (u === "LEN") {
          try { const v = evalSimple(restoreLocal(args), env); return String(Array.isArray(v)||typeof v==="string"?v.length:0); }
          catch(e){ return "0"; }
        }
        if (funcs[u]) {
          const f = funcs[u];
          const av = args.trim() ? splitArgs(args).map(a => evalExpr(restoreLocal(a), env, funcs, callStack)) : [];
          if (callStack.includes(u)) throw new Error("récursion trop profonde");
          const local = { ...env };
          f.params.forEach((p,i) => local[p] = av[i]);
          const ex = new Executor(f.body, funcs, { initial: local, silent: true, maxSteps: 5000 });
          const r = ex.run();
          return r.returned ? JSON.stringify(r.returnValue) : "null";
        }
        return all;
      });
    }
    return evalSimple(restoreLocal(x), env);
  };

  /* ---------- 2. parseStmt : SINON SI, QUITTER, CONTINUER, APPELER, appels nus ---------- */
  const _origParseStmt = Parser.prototype.parseStmt;
  Parser.prototype.parseStmt = function() {
    const lineNo = this.i + 1;
    const s = this.strip(this.lines[this.i]);
    // QUITTER / CONTINUER
    if (/^(QUITTER|BREAK)\b/i.test(s)) { this.i++; return { type: "break", line: lineNo }; }
    if (/^(CONTINUER|CONTINUE)\b/i.test(s)) { this.i++; return { type: "continue", line: lineNo }; }
    // APPELER nom(...)
    if (/^(APPELER|CALL)\s+/i.test(s)) {
      const callExpr = s.replace(/^(APPELER|CALL)\s+/i, "");
      this.i++; return { type: "expr", expr: callExpr, line: lineNo };
    }
    // Appel de fonction/procédure nu (nom(...))
    if (/^[A-Za-zÀ-ÿ_]\w*\s*\(/.test(s) &&
        !/^(SI|IF|POUR|FOR|TANTQUE|WHILE|RÉPÉTER|REPETER|REPEAT|SELON|SWITCH|LIRE|READ|ECRIRE|WRITE|RETOURNER|RETURN|FONCTION|FUNCTION|PROCEDURE)\b/i.test(s)) {
      this.i++; return { type: "expr", expr: s, line: lineNo };
    }
    // SI / SINON SI
    if (/^(SI|IF)\b/i.test(s)) {
      const m = /^(?:SI|IF)\s+(.+?)\s+(?:ALORS|THEN)\s*$/i.exec(s);
      if (!m) { this.error("condition SI mal formée, utilisez SI condition ALORS", lineNo); this.i++; return { type: "noop", line: lineNo }; }
      this.i++;
      const yes = this.parseBlock(["SINON","ELSE","FINSI","ENDIF"]);
      let no = [];
      if (this.i < this.lines.length && /^(SINON|ELSE)\b/i.test(this.strip(this.lines[this.i]))) {
        const rest = this.strip(this.lines[this.i]).replace(/^(SINON|ELSE)\s*/i, "").trim();
        if (/^(SI|IF)\b/i.test(rest)) {
          // SINON SI → transformer en SI imbriqué
          this.lines[this.i] = this.lines[this.i].replace(/^(\s*)(?:SINON|ELSE)\s+(?:SI|IF)\b/i, "$1SI");
          no.push(this.parseStmt());
        } else {
          this.i++;
          no = this.parseBlock(["FINSI","ENDIF"]);
        }
      }
      if (this.i < this.lines.length && /^(FINSI|ENDIF)\b/i.test(this.strip(this.lines[this.i]))) this.i++;
      else this.error("FINSI manquant", lineNo);
      return { type: "if", cond: m[1], yes, no, line: lineNo };
    }
    return _origParseStmt.call(this);
  };

  /* ---------- 3. Parser.parse : VARIABLES multi ---------- */
  const _origParse = Parser.prototype.parse;
  Parser.prototype.parse = function() {
    while (this.i < this.lines.length) {
      const s = this.strip(this.lines[this.i]);
      if (!s) { this.i++; continue; }
      if (/^(VARIABLES|VARIABLE)\s+\S/i.test(s)) {
        const decl = s.replace(/^(VARIABLES|VARIABLE)\s+/i, "").trim();
        decl.split(/[,;]/).map(x => x.trim()).filter(Boolean).forEach(part => {
          const m = /^([A-Za-zÀ-ÿ_]\w*)\s*:\s*(ENTIER|REEL|R[ÉE]EL|CHAINE|CARACTERE|BOOLEEN)$/i.exec(part);
          if (m) { this.declared.add(m[1].toUpperCase()); this.ast.push({ type:"declare", name:m[1], dtype:m[2], line:this.i+1 }); }
        });
        this.i++; continue;
      }
      const up = s.toUpperCase();
      if (/^(FONCTION|FUNCTION)\s+/i.test(s)) this.parseFunction();
      else if (/^PROCEDURE\s+/i.test(s)) this.parseProcedure();
      else if (/^(ALGORITHME|ALGORITHM|ALGO)(?:\s+.*)?$/i.test(s) ||
               /^(VARIABLES|VARIABLE|CONSTANTES|CONSTANTS|DEBUT|BEGIN|FIN|END)$/i.test(s) ||
               up === "{" || up === "}") this.i++;
      else this.ast.push(this.parseStmt());
    }
    return { ast: this.ast, functions: this.functions, errors: this.errors };
  };

  /* ---------- 4. Executor : break / continue / expr + boucles tolérantes ---------- */
  const _origExec = Executor.prototype.exec;
  Executor.prototype.exec = function(node) {
    if (node.type === "break") throw { __algoBreak: true };
    if (node.type === "continue") throw { __algoContinue: true };
    if (node.type === "expr") { getExprWithArrays(node.expr, this.env, this.funcs); return; }
    return _origExec.call(this, node);
  };
  Executor.prototype.execBlock = function(block) {
    for (const node of block) {
      if (this.returned) break;
      if (node.type === "for" || node.type === "while" || node.type === "repeat") this.execLoop(node);
      else this.exec(node);
    }
  };
  Executor.prototype.execLoop = function(node) {
    this.guard(node);
    try {
      if (node.type === "for") {
        const from = Math.trunc(getExprWithArrays(node.from, this.env, this.funcs));
        const to = Math.trunc(getExprWithArrays(node.to, this.env, this.funcs));
        const step = Math.trunc(getExprWithArrays(node.step, this.env, this.funcs)) || 1;
        let g = 0;
        for (let v = from; step > 0 ? v <= to : v >= to; v += step) {
          this.env[node.v] = v;
          try { this.execBlock(node.body); }
          catch(e) { if (e && e.__algoBreak) break; if (e && e.__algoContinue) continue; throw e; }
          if (this.returned) break;
          if (++g > this.maxSteps) throw new Error("boucle POUR trop longue");
        }
      } else if (node.type === "while") {
        let g = 0;
        while (!!getExprWithArrays(node.cond, this.env, this.funcs)) {
          try { this.execBlock(node.body); }
          catch(e) { if (e && e.__algoBreak) break; if (e && e.__algoContinue) continue; throw e; }
          if (this.returned) break;
          if (++g > this.maxSteps) throw new Error("TANTQUE dépasse la limite d’itérations");
        }
      } else if (node.type === "repeat") {
        let g = 0;
        do {
          try { this.execBlock(node.body); }
          catch(e) { if (e && e.__algoBreak) break; if (e && e.__algoContinue) continue; throw e; }
          if (this.returned) break;
          if (++g > this.maxSteps) throw new Error("RÉPÉTER dépasse la limite d’itérations");
        } while (!getExprWithArrays(node.cond, this.env, this.funcs));
      }
    } catch(e) {
      if (e && (e.__algoBreak || e.__algoContinue)) return;
      throw e;
    }
  };

  /* ---------- 5. Réinjecter V18_COMPLEMENTS.structures manquant ---------- */
  if (typeof V18_COMPLEMENTS !== "undefined" && typeof pedagogicalFor === "function") {
    Object.entries(V18_COMPLEMENTS).forEach(([id, sections]) => {
      const chapitre = COURSE.find(c => c.id === id);
      if (!chapitre) return;
      const existants = new Set(chapitre.sections.map(x => x.title));
      sections.forEach(section => {
        if (!existants.has(section.title)) {
          chapitre.sections.push(section);
          const p = pedagogicalFor(section);
          section._ped = p;
          section.explanation = section.explanation || p.why;
          section.objectives = section.objectives || p.objective;
          section.keypoints = section.keypoints || p.keypoints;
        }
      });
    });
  }

  /* ---------- 6. Comparaison tolérante (helper global) ---------- */
  window.__algoCompare = function(actual, expected) {
    const a = String(actual).trim().replace(/\s+/g, " ");
    const b = String(expected).trim().replace(/\s+/g, " ");
    if (a === b) return true;
    const na = a.split(/\s+/).map(Number);
    const nb = b.split(/\s+/).map(Number);
    if (na.length === nb.length && na.length > 0 &&
        na.every(Number.isFinite) && nb.every(Number.isFinite)) {
      return na.every((v, i) => Math.abs(v - nb[i]) < 1e-6);
    }
    return false;
  };

  /* ---------- 7. saveState compact ---------- */
  saveState = function() {
    try {
      const toSave = { ...state };
      if (toSave.lastRun) {
        toSave.lastRun = {
          output: toSave.lastRun.output,
          env: toSave.lastRun.env,

          complexity: toSave.lastRun.complexity
        };

    } catch(e) { /* quota */ }
  };

  /* ---------- 8. Nettoyage des timers à chaque changement de vue ---------- */
  const _origSetView = setView;
  setView = function(v) {
    if (window.__algoTimers) window.__algoTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
    window.__algoTimers = [];
    return _origSetView.call(this, v);
  };

  /* ---------- 9. Simulateur corrigé (signe, cible, résumé) ---------- */
  renderSimulator = function() {
    $("#view-simulator").innerHTML = `<div class="card"><div class="badge">🎞️ Visualisation algorithmique</div><h1>Simulateur animé</h1><p class="muted">Chaque barre affiche sa valeur et son indice. Les valeurs négatives sont colorées en rouge.</p></div>
      <div class="grid2" style="margin-top:16px">
        <div class="card">
          <h3>Algorithme</h3>
          <select id="simType" style="width:100%;padding:9px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line)">
            <option value="bubble">Tri à bulles</option>
            <option value="selection">Tri par sélection</option>
            <option value="insertion">Tri par insertion</option>
            <option value="binary">Recherche dichotomique</option>
          </select>
          <label class="muted" style="display:block;font-size:12px;margin-top:12px">Données (max 18)
            <input id="simData" value="8,3,7,1,5,2,9" style="width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px">
          </label>
          <label class="muted" style="display:block;font-size:12px;margin-top:8px" id="simTargetLabel">Cible (recherche dichotomique)
            <input id="simTarget" type="number" placeholder="auto (médiane)" style="width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px">
          </label>
          <div class="simControls">
            <button class="btn primary" id="simPlay">▶ Animer</button>
            <button class="btn" id="simStep">⏭ Une étape</button>
            <button class="btn" id="simReset">↺ Réinitialiser</button>
          </div>
        </div>
        <div class="card">
          <h3 id="simTitle">Tri à bulles</h3>
          <div class="simStage"><div class="bars" id="bars"></div></div>
          <p class="muted" id="simInfo">Prêt.</p>
          <div id="simSummary" class="muted" style="font-size:12px"></div>
        </div>
      </div>`;

    let steps = [], idx = 0, timer = null, finalMsg = "";
    function toggleTarget() { $("#simTargetLabel").style.display = ($("#simType").value === "binary") ? "block" : "none"; }

    function build() {
      const raw = $("#simData").value.split(",").map(Number).filter(Number.isFinite);
      const truncated = raw.length > 18;
      let a = raw.slice(0, 18);
      const typ = $("#simType").value;
      steps = []; let comparisons = 0, swaps = 0; finalMsg = "";

      if (typ === "binary") {
        a.sort((x, y) => x - y);
        const userTarget = parseFloat($("#simTarget").value);
        const target = Number.isFinite(userTarget) ? userTarget : (a[Math.floor(a.length/2)] ?? 0);
        let l = 0, r = a.length - 1;
        while (l <= r) {
          const m = Math.floor((l+r)/2); comparisons++;
          steps.push({ a: a.slice(), active: [m], msg: `Comparer T[${m}] = ${a[m]} (cible = ${target})` });
          if (a[m] === target) { finalMsg = `Trouvé à l'indice ${m} en ${comparisons} comparaison(s).`; break; }
          if (a[m] < target) l = m + 1; else r = m - 1;
        }
        if (!finalMsg) finalMsg = `Cible ${target} absente du tableau (${comparisons} comparaisons).`;
        $("#simTitle").textContent = "Recherche dichotomique";
      } else {
        if (typ === "bubble") for (let i = 0; i < a.length; i++) for (let j = 0; j < a.length-1-i; j++) {
          comparisons++;
          steps.push({ a: a.slice(), active: [j, j+1], msg: `Comparer ${a[j]} et ${a[j+1]}` });
          if (a[j] > a[j+1]) { [a[j], a[j+1]] = [a[j+1], a[j]]; swaps++; steps.push({ a: a.slice(), active: [j, j+1], msg: "Échanger" }); }
        }
        if (typ === "selection") for (let i = 0; i < a.length-1; i++) {
          let m = i;
          for (let j = i+1; j < a.length; j++) { comparisons++; steps.push({ a: a.slice(), active: [j, m], msg: "Chercher le minimum" }); if (a[j] < a[m]) m = j; }
          [a[i], a[m]] = [a[m], a[i]]; swaps++;
          steps.push({ a: a.slice(), active: [i, m], msg: "Placer le minimum" });
        }
        if (typ === "insertion") for (let i = 1; i < a.length; i++) {
          const key = a[i]; let j = i - 1;
          while (j >= 0 && a[j] > key) { comparisons++; steps.push({ a: a.slice(), active: [j, j+1], msg: "Décaler vers la droite" }); a[j+1] = a[j]; j--; }
          a[j+1] = key; swaps++;
          steps.push({ a: a.slice(), active: [j+1], msg: "Insérer la clé" });
        }
        finalMsg = `Tri terminé : ${comparisons} comparaisons, ${swaps} écritures.`;
        $("#simTitle").textContent = { bubble: "Tri à bulles", selection: "Tri par sélection", insertion: "Tri par insertion" }[typ];
      }
      idx = 0;
      $("#simSummary").textContent = truncated ? "⚠ Données tronquées à 18 valeurs." : "";
      draw(steps[0] || { a, active: [], msg: "Aucune étape" });
    }

    function draw(st) {
      const min = Math.min(0, ...st.a);
      const max = Math.max(1, ...st.a.map(v => Number(v) || 0));
      const span = Math.max(1, max - min);
      $("#bars").innerHTML = st.a.map((v, i) => {
        const h = Math.max(6, Math.min(88, ((Number(v) - min) / span) * 88));
        const neg = Number(v) < 0;
        return `<div class="bar ${st.active.includes(i) ? "active" : ""}" title="T[${i}] = ${v}" style="height:${h}%;${neg ? 'background:linear-gradient(180deg,var(--bad),var(--warn));' : ''}">
          <span class="barValue">${esc(v)}</span>
          <span class="barIndex">T[${i}]</span>
        </div>`;
      }).join("");
      $("#simInfo").textContent = st.msg + ` · étape ${Math.min(idx+1, steps.length)}/${steps.length}`;
    }

    function adv() {
      if (idx < steps.length) draw(steps[idx++]);
      else {
        clearInterval(timer); timer = null;
        $("#simInfo").textContent = finalMsg || "Terminé";
        $("#simPlay").textContent = "▶ Animer";
      }
    }

    $("#simReset").onclick = build;
    $("#simStep").onclick = adv;
    $("#simPlay").onclick = () => {
      if (timer) { clearInterval(timer); timer = null; $("#simPlay").textContent = "▶ Animer"; }
      else { $("#simPlay").textContent = "⏸ Pause"; timer = setInterval(adv, 450); }
    };
    $("#simType").onchange = () => { toggleTarget(); build(); };
    $("#simData").oninput = build;
    $("#simTarget").oninput = build;
    toggleTarget();
    build();
  };

  /* ---------- 10. Re-render ---------- */
  try { updateProgress(); renderAll(); } catch(e) { console.warn("Render post-hotfix échoué :", e); }

})();
</script>
</body>
</html>
