<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>AlgoLab V13 — Plateforme interactive d’algorithmique</title>
<style>
:root{
  --bg:#0b1020; --panel:#111827; --panel2:#172033; --card:#1b2638; --text:#ecf3ff;
  --muted:#9fb0c6; --line:#2a3a53; --primary:#60a5fa; --primary2:#2563eb; --accent:#a78bfa;
  --good:#34d399; --warn:#fbbf24; --bad:#fb7185; --shadow:0 14px 40px rgba(0,0,0,.25);
  --radius:16px; --code:#0a0f18; --codeText:#e5eefb;
}
:root.light{
  --bg:#f4f7fb; --panel:#ffffff; --panel2:#f8fafc; --card:#ffffff; --text:#152238;
  --muted:#607086; --line:#d9e2ef; --primary:#2563eb; --primary2:#1d4ed8; --accent:#7c3aed;
  --good:#059669; --warn:#d97706; --bad:#e11d48; --shadow:0 12px 32px rgba(30,41,59,.10);
  --code:#0f172a; --codeText:#e6edf8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;min-width:170px}
.logoMark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;font-weight:900}
.topActions{margin-left:auto;display:flex;gap:8px}
.iconBtn,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 12px}
.btn.primary{background:var(--primary2);color:white;border-color:var(--primary2)}
.btn.good{background:color-mix(in srgb,var(--good) 15%, transparent);border-color:color-mix(in srgb,var(--good) 45%, var(--line));color:var(--good)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%, transparent);border-color:color-mix(in srgb,var(--bad) 45%, var(--line));color:var(--bad)}
.btn.small{padding:6px 9px;font-size:13px}
.layout{min-height:0;flex:1;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
.sidebarTitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 8px 8px}
.navBtn{width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;margin:2px 0}
.navBtn:hover{background:var(--panel2)}
.navBtn.active{background:color-mix(in srgb,var(--primary) 14%, transparent);border-color:color-mix(in srgb,var(--primary) 25%, var(--line));color:var(--primary)}
.lessonItem{padding:9px 10px;border-radius:9px;color:var(--muted);cursor:pointer;display:flex;gap:8px}
.lessonItem:hover{background:var(--panel2);color:var(--text)}
.lessonItem.active{background:color-mix(in srgb,var(--accent) 12%, transparent);color:var(--text)}
.progress{height:6px;border-radius:999px;background:var(--panel2);overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.toolbar{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.breadcrumb{font-size:13px;color:var(--muted);margin-right:auto}
.content{min-height:0;overflow:auto;padding:18px}
.view{display:none;max-width:1400px;margin:0 auto}
.view.active{display:block}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2,.card h3{margin:0 0 10px}
.hero{padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 15%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:20px}
.hero h1{font-size:clamp(28px,4vw,48px);line-height:1.05;margin:0 0 10px}
.hero p{color:var(--muted);max-width:800px;font-size:16px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.stat b{font-size:26px;display:block}
.muted{color:var(--muted)}
.sectionTitle{font-size:20px;margin:22px 0 10px}
.codeBox{border:1px solid #24344c;border-radius:14px;background:var(--code);overflow:hidden;position:relative}
.codeHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #203049;color:#9db4d2;font-size:12px}
.codeWrap{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);min-height:280px}
.lineNums{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#64748b;background:#0b121d;padding:14px 8px;text-align:right;user-select:none}
.codeArea{position:relative}
.highlight{position:absolute;inset:0;overflow:hidden;padding:14px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--codeText);white-space:pre;pointer-events:none}
.editor{position:absolute;inset:0;width:100%;height:100%;resize:none;padding:14px;border:0;outline:0;background:transparent;color:transparent;caret-color:white;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto;z-index:2}
.editor::selection{background:rgba(96,165,250,.25)}
.kw{color:#93c5fd}.type{color:#c4b5fd}.num{color:#fdba74}.str{color:#86efac}.com{color:#64748b}.op{color:#fca5a5}.fn{color:#67e8f9}
.editorRow{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.editorPanel,.runPanel{min-width:0}
.runPanel{display:flex;flex-direction:column;gap:12px}
.ioBox{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px}
.ioBox textarea,.ioBox input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;outline:0}
.console{height:180px;overflow:auto;background:#050a12;color:#bde7c8;border:1px solid #1f2f42;border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.kv div{padding:7px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.trace{max-height:260px;overflow:auto}
.traceRow{display:grid;grid-template-columns:50px 1fr auto;gap:8px;padding:7px;border-bottom:1px solid var(--line);font-size:12px}
.traceRow.active{background:color-mix(in srgb,var(--primary) 18%,transparent);outline:1px solid var(--primary)}
.debugControls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.debugStatus{font-size:12px;color:var(--muted);margin-top:8px}
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.lessonLayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.lessonNav{position:sticky;top:0;align-self:start}
.tocItem{padding:8px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.tocItem:hover{background:var(--panel2);color:var(--text)}
.example{border-left:3px solid var(--primary);background:var(--panel2);padding:12px 14px;border-radius:0 10px 10px 0}
.note{display:flex;gap:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 25%, var(--line))}
.checklist{display:grid;gap:7px}
.check{display:flex;align-items:flex-start;gap:8px}.check input{margin-top:4px}
.quizQ{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px}
.option{display:flex;gap:8px;padding:7px;border-radius:8px}.option:hover{background:var(--panel2)}
.result{padding:14px;border-radius:12px;margin-top:12px}
.goodbg{background:color-mix(in srgb,var(--good) 10%,transparent);border:1px solid color-mix(in srgb,var(--good) 25%, var(--line))}
.badbg{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 25%, var(--line))}
.simStage{height:360px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 30%),var(--panel2);position:relative;overflow:hidden}
.bars{position:absolute;inset:48px 16px 48px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(5px,1vw,12px);overflow:visible}
.bar{width:min(10%,56px);min-width:24px;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:8px 8px 2px 2px;transition:height .35s ease,transform .35s ease,filter .35s;position:relative;box-shadow:0 8px 20px rgba(37,99,235,.22);display:flex;justify-content:center}
.barValue{position:absolute;top:-34px;left:50%;transform:translateX(-50%);min-width:30px;padding:4px 7px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:900;font-size:12px;line-height:1.2;text-align:center;box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.barIndex{position:absolute;bottom:-29px;left:50%;transform:translateX(-50%);font:700 11px/1 ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.bar.active .barValue{border-color:var(--warn);color:var(--warn);transform:translateX(-50%) scale(1.08)}
@media(max-width:700px){.bars{inset:45px 7px 46px;gap:4px}.bar{min-width:18px;width:min(12%,44px)}.barValue{font-size:10px;min-width:24px;padding:3px 4px;top:-29px}.barIndex{font-size:9px;bottom:-25px}.simStage{min-height:330px}}
.bar.active{filter:brightness(1.35);transform:translateY(-5px)}
.simControls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.flow .node{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px}
.flow .arrow{color:var(--muted)}
.searchRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.searchRow input,.searchRow select{padding:9px 11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px}
.exercise{display:grid;gap:10px}
textarea.exerciseInput{min-height:180px;width:100%;padding:12px;border-radius:10px;background:var(--code);color:var(--codeText);border:1px solid #24344c;font:13px/1.55 ui-monospace,monospace}
.printOnly{display:none}
.footerNote{font-size:12px;color:var(--muted);margin-top:18px}

.chapterHeader{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.chapterMeta,.pillRow{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.objectives{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.objective{padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:13px}.keypoints{display:grid;gap:7px;padding:0;margin:10px 0 0;list-style:none}.keypoints li{padding-left:20px;color:var(--muted);line-height:1.45}.keypoints li:before{content:"✓";color:var(--good);font-weight:800;margin-left:-20px;margin-right:8px}.tpGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tpCard{padding:14px;border:1px solid var(--line);background:var(--panel2);border-radius:13px;cursor:pointer}.tpCard:hover{border-color:var(--primary);transform:translateY(-1px)}.matrixLab{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.matrixInputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.matrixBox{overflow:auto;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}.matrixGrid{display:inline-grid;gap:5px;padding:10px;border:2px solid color-mix(in srgb,var(--primary) 60%, var(--line));border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}.matrixCell{width:58px;height:48px;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);outline:none}.matrixCell:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 20%, transparent)}.matrixCell.result{animation:matrixPulse .5s ease}@keyframes matrixPulse{50%{transform:scale(1.08);background:color-mix(in srgb,var(--primary) 25%,var(--panel2))}}.matrixEquation{font:15px/1.6 ui-monospace,monospace;padding:12px;background:var(--code);color:var(--codeText);border-radius:10px;white-space:pre-wrap}.metricGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.metric b{display:block;font-size:18px}.courseNav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.courseNav .btn{min-width:120px}.tpSteps{display:grid;gap:8px;counter-reset:step}.tpStep{padding:11px 12px 11px 42px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);position:relative}.tpStep:before{counter-increment:step;content:counter(step);position:absolute;left:11px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--primary2);color:#fff;font-size:11px;font-weight:800}


/* ===== V15 ergonomic/editor/pedagogy enhancements ===== */
.codeBox{box-shadow:0 10px 30px rgba(0,0,0,.16);}
.codeHead{gap:10px;flex-wrap:wrap}
.codeStatus{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codeWrap{grid-template-columns:54px minmax(0,1fr);min-height:330px;background:var(--code)}
.lineViewport{position:relative;overflow:hidden;background:#0b121d;border-right:1px solid #203049}
.lineNums{position:absolute;left:0;top:0;right:0;padding:14px 8px;min-height:100%;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#64748b;text-align:right;white-space:pre;user-select:none;will-change:transform}
.lineNums .activeLineNo{color:#dbeafe;font-weight:800}
.codeArea{overflow:hidden}
.highlight,.editor{white-space:pre!important;overflow:auto;tab-size:4;line-height:1.6}
.highlight{overflow:hidden!important}
.editor{overflow:auto!important;scrollbar-gutter:stable}
.currentLine{position:absolute;left:0;right:0;height:20.8px;background:rgba(96,165,250,.07);border-top:1px solid rgba(96,165,250,.08);pointer-events:none;z-index:1}
.editor{z-index:3}
.highlight{z-index:0}
.tabbar{padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);gap:6px;scrollbar-width:thin}
.tab{border:1px solid transparent;border-radius:10px;padding:9px 13px;transition:.18s ease;background:transparent}
.tab:hover{background:var(--panel);transform:translateY(-1px)}
.tab.active{background:var(--primary2);color:#fff;border-color:var(--primary2);box-shadow:0 5px 14px color-mix(in srgb,var(--primary2) 28%,transparent)}
.chapterHeader{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pillRow{display:flex;gap:7px;flex-wrap:wrap}
.objectives{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.objective{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px}
.keypoints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;list-style:none;padding:0;margin:0}
.keypoints li{padding:10px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 10px 10px 0;font-size:13px}
.pedagogyGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pedCard{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel2)}
.pedCard h4{margin:0 0 7px;font-size:14px}
.steps{counter-reset:step;display:grid;gap:8px}
.stepItem{padding:10px 12px 10px 42px;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px}
.stepItem:before{counter-increment:step;content:counter(step);position:absolute;left:11px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--primary2);color:#fff;font-weight:700;font-size:11px}
.checkQuestion{padding:12px;border:1px dashed var(--line);border-radius:11px;background:color-mix(in srgb,var(--primary) 5%,transparent)}
.exMeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.exerciseListItem{display:block;width:100%;text-align:left;padding:11px;border:1px solid transparent;background:transparent;color:var(--text);border-radius:11px;margin:4px 0}
.exerciseListItem:hover{background:var(--panel2);border-color:var(--line)}
.exerciseListItem.active{background:color-mix(in srgb,var(--primary) 12%,transparent);border-color:color-mix(in srgb,var(--primary) 30%,var(--line))}
.exerciseCategory{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 2px 5px}
.testTable{width:100%;border-collapse:collapse;font-size:12px}
.testTable th,.testTable td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.testTable th{position:sticky;top:0;background:var(--panel2);z-index:1}
.testPass{color:var(--good);font-weight:800}.testFail{color:var(--bad);font-weight:800}
.labLibrary{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.labItem{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px;border-radius:10px;margin:5px 0}
.labItem:hover{background:var(--panel2)}
.labItem.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.labFilter{display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line);margin-bottom:5px}
.labFilter input,.labFilter select{width:100%;padding:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px}
.miniStat{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){
 .objectives,.keypoints,.pedagogyGrid,.labLibrary{grid-template-columns:1fr}
 .codeWrap{grid-template-columns:42px minmax(0,1fr)}
}

@media (max-width:1000px){
  .layout{grid-template-columns:72px minmax(0,1fr)}
  .sidebar{padding:8px}
  .sidebar .sidebarTitle,.sidebar .lessonItem span,.navBtn span{display:none}
  .navBtn{display:grid;place-items:center;padding:12px}
  .lessonItem{justify-content:center}
  .lessonItem{font-size:0}
  .lessonItem::before{content:"📘";font-size:18px}
  .grid2,.editorRow,.lessonLayout,.matrixLab{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lessonNav{position:static}
}
@media (max-width:640px){
  .topbar{height:auto;min-height:58px;padding:9px}.logo{min-width:0;font-size:15px}.topActions .hideMobile{display:none}
  .toolbar{padding:9px}.content{padding:10px}.stats{grid-template-columns:1fr 1fr}.card{padding:14px}.hero{padding:18px}
  .hero h1{font-size:31px}.grid3,.tpGrid{grid-template-columns:1fr}
  .codeWrap{grid-template-columns:36px minmax(0,1fr)}.lineNums{font-size:11px;padding:12px 5px}.editor,.highlight{font-size:12px;padding:12px}
}
@media print{
  body{background:white;color:black}
  .topbar,.sidebar,.toolbar,.noPrint{display:none!important}
  .layout{display:block}.main,.content{overflow:visible}.view{display:none!important}
  .view.printView{display:block!important;max-width:none}
  .printOnly{display:block}
  .card,.hero{box-shadow:none;border:1px solid #bbb;color:black}
}
.algoOutput{margin-top:8px;white-space:pre-wrap;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);color:var(--codeText);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto}.matrixText{white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* V18.4: affichage matriciel carre avec bordures continues */
.matrixGrid{display:inline-grid!important;gap:0!important;padding:0!important;border:3px solid var(--text)!important;border-radius:0!important;background:var(--panel)!important;box-shadow:0 8px 22px rgba(15,23,42,.14)!important;overflow:hidden;max-width:100%}
.matrixCell{box-sizing:border-box!important;width:58px!important;height:58px!important;min-width:58px!important;min-height:58px!important;margin:0!important;border:0!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:var(--panel)!important;color:var(--text)!important;text-align:center!important;font-weight:800!important}
.matrixGrid .matrixCell:nth-child(n){outline:none}.matrixCell:focus{position:relative;z-index:2;box-shadow:inset 0 0 0 3px var(--primary)!important;background:color-mix(in srgb,var(--primary) 9%,var(--panel))!important}

"use strict";

/* ==========================================================

const COURSE_BASE = [
  {id:"intro", level:"Débutant", title:"Découvrir l’algorithmique", icon:"🌱",
   sections:[
    {title:"Qu’est-ce qu’un algorithme ?", text:"Un algorithme est une méthode finie, ordonnée et non ambiguë permettant de résoudre un problème. On part des données disponibles, on applique des étapes, puis on obtient un résultat.",
     example:`ALGORITHME Bonjour
DEBUT
    ECRIRE("Bonjour !")
FIN`},
    {title:"Variables, types et affectation", text:"Une variable est une boîte nommée qui mémorise une valeur. En pseudo-code pédagogique, on distingue notamment ENTIER, REEL, CHAINE, BOOLEEN et CARACTERE. L’affectation utilise ←.",
     example:`VARIABLES
    age : ENTIER
    nom : CHAINE
DEBUT
    age ← 15
    nom ← "Amine"
    ECRIRE(nom, age)
FIN`},
    {title:"Entrées et sorties", text:"LIRE récupère une donnée d’entrée et ECRIRE affiche un résultat. Une donnée peut venir d’un utilisateur, d’un test ou d’un jeu de données.",
     example:`VARIABLES
    a : ENTIER
    b : ENTIER
DEBUT
    LIRE(a)
    LIRE(b)
    ECRIRE(a + b)
FIN`},
    {title:"Opérateurs et expressions", text:"On combine des valeurs avec +, -, *, / et MOD. Les comparaisons utilisent =, <>, <, <=, >, >=. Les opérateurs logiques incluent ET, OU et NON.",
     example:`VARIABLES
    n : ENTIER
DEBUT
    n ← 17
    ECRIRE(n MOD 2)
FIN`}
   ]},
  {id:"control", level:"Débutant", title:"Conditions et répétitions", icon:"🔁",
   sections:[
    {title:"La condition SI / SINON", text:"Une condition choisit un chemin d’exécution. Elle permet de transformer une règle métier ou mathématique en décision informatique.",
     example:`SI age >= 18 ALORS
    ECRIRE("Majeur")
SINON
    ECRIRE("Mineur")
FINSI`},
    {title:"La boucle POUR", text:"POUR convient lorsque le nombre d’itérations est connu ou borné. La variable de boucle évolue automatiquement.",
     example:`VARIABLES
    i : ENTIER
    somme : ENTIER
DEBUT
    somme ← 0
    POUR i ← 1 À 5
        somme ← somme + i
    FINPOUR
    ECRIRE(somme)
FIN`},
    {title:"TANTQUE et RÉPÉTER", text:"TANTQUE teste avant d’exécuter. RÉPÉTER exécute au moins une fois puis teste la condition. Toute boucle doit avoir une condition d’arrêt atteignable.",
     example:`i ← 1
TANTQUE i <= 5
    ECRIRE(i)
    i ← i + 1
FINTANTQUE`},
    {title:"Compteurs et accumulateurs", text:"Un compteur compte des occurrences. Un accumulateur construit progressivement une somme, un produit ou une autre combinaison. L’initialisation est essentielle.",
     example:`compteur ← 0
POUR i ← 1 À 10
    SI i MOD 2 = 0 ALORS
        compteur ← compteur + 1
    FINSI
FINPOUR
ECRIRE(compteur)`}
   ]},
  {id:"arrays", level:"Fondamental", title:"Tableaux et matrices", icon:"📦",
   sections:[
    {title:"Tableaux", text:"Un tableau regroupe plusieurs valeurs de même nature, accessibles par un indice. Pour les exercices, AlgoLab accepte les tableaux littéraux [1,2,3,4].",
     example:`T ← [4, 8, 1, 9, 3]
POUR i ← 0 À LONGUEUR(T)-1
    ECRIRE(T[i])
FINPOUR`},
    {title:"Recherche linéaire", text:"On parcourt les éléments un à un jusqu’à trouver la valeur recherchée. Le pire cas nécessite n comparaisons.",
     example:`T ← [4, 8, 1, 9, 3]
cible ← 9
trouve ← FAUX
POUR i ← 0 À LONGUEUR(T)-1
    SI T[i] = cible ALORS
        trouve ← VRAI
    FINSI
FINPOUR
ECRIRE(trouve)`},
    {title:"Maximum et minimum", text:"Une technique fondamentale consiste à prendre le premier élément comme référence puis à comparer progressivement les autres valeurs.",
     example:`T ← [7, 2, 11, 5]
maximum ← T[0]
POUR i ← 1 À LONGUEUR(T)-1
    SI T[i] > maximum ALORS
        maximum ← T[i]
    FINSI
FINPOUR
ECRIRE(maximum)`},
    {title:"Matrices", text:"Une matrice est un tableau à deux dimensions. On combine généralement deux boucles imbriquées pour parcourir lignes et colonnes.",
     example:`M ← [[1,2],[3,4]]
POUR i ← 0 À LONGUEUR(M)-1
    POUR j ← 0 À LONGUEUR(M[i])-1
        ECRIRE(M[i][j])
    FINPOUR
FINPOUR`}
   ]},
  {id:"functions", level:"Intermédiaire", title:"Fonctions et procédures", icon:"🧩",
   sections:[
    {title:"Décomposer un problème", text:"Une grande solution devient plus lisible lorsqu’elle est découpée en sous-problèmes. Les fonctions renvoient une valeur ; les procédures peuvent surtout effectuer une action.",
     example:`FONCTION carre(x : ENTIER) : ENTIER
DEBUT
    RETOURNER x * x
FINFONCTION

ECRIRE(carre(7))`},
    {title:"Paramètres et portée", text:"Un paramètre permet de réutiliser une fonction avec des données différentes. Une variable locale appartient à la fonction qui la déclare.",
     example:`FONCTION somme(a : ENTIER, b : ENTIER) : ENTIER
DEBUT
    RETOURNER a + b
FINFONCTION

ECRIRE(somme(10, 20))`},
    {title:"Récursivité", text:"Une fonction récursive s’appelle elle-même. Elle doit posséder un cas de base qui arrête la descente récursive.",
     example:`FONCTION factorielle(n : ENTIER) : ENTIER
DEBUT
    SI n <= 1 ALORS
        RETOURNER 1
    SINON
        RETOURNER n * factorielle(n-1)
    FINSI
FINFONCTION

ECRIRE(factorielle(5))`}
   ]},
  {id:"searchsort", level:"Intermédiaire", title:"Recherche et tri", icon:"🔎",
   sections:[
    {title:"Recherche dichotomique", text:"Sur un tableau trié, on divise l’intervalle de recherche par deux à chaque étape. C’est un exemple classique de stratégie diviser pour régner.",
     example:`T ← [2,5,7,11,15,19,23]
cible ← 15
gauche ← 0
droite ← LONGUEUR(T)-1
trouve ← FAUX
TANTQUE gauche <= droite
    milieu ← (gauche + droite) DIV 2
    SI T[milieu] = cible ALORS
        trouve ← VRAI
        gauche ← droite + 1
    SINON
        SI T[milieu] < cible ALORS
            gauche ← milieu + 1
        SINON
            droite ← milieu - 1
        FINSI
    FINSI
FINTANTQUE
ECRIRE(trouve)`},
    {title:"Tri par sélection", text:"À chaque position, on cherche le plus petit élément dans la partie non triée puis on l’échange avec l’élément courant.",
     example:`T ← [7,3,5,1]
POUR i ← 0 À LONGUEUR(T)-2
    min ← i
    POUR j ← i+1 À LONGUEUR(T)-1
        SI T[j] < T[min] ALORS
            min ← j
        FINSI
    FINPOUR
    tmp ← T[i]
    T[i] ← T[min]
    T[min] ← tmp
FINPOUR
ECRIRE(T)`},
    {title:"Tri par insertion", text:"On considère la partie gauche comme triée et on insère chaque nouvel élément à la bonne position. Très efficace sur des données presque triées.",
     example:`T ← [7,3,5,1]
POUR i ← 1 À LONGUEUR(T)-1
    cle ← T[i]
    j ← i - 1
    TANTQUE j >= 0 ET T[j] > cle
        T[j+1] ← T[j]
        j ← j - 1
    FINTANTQUE
    T[j+1] ← cle
FINPOUR
ECRIRE(T)`}
   ]},
  {id:"complexity", level:"Avancé", title:"Complexité et efficacité", icon:"📈",
   sections:[
    {title:"Pourquoi mesurer un algorithme ?", text:"Deux solutions peuvent donner le même résultat mais demander des ressources très différentes. La complexité aide à raisonner sur la croissance du temps ou de la mémoire.",
     example:`POUR i ← 1 À n
    ECRIRE(i)
FINPOUR
// estimation : O(n)`},
    {title:"O(1), O(log n), O(n), O(n²)", text:"O(1) reste constant. O(log n) croît lentement. O(n) croît proportionnellement à la taille des données. Deux boucles imbriquées indépendantes donnent souvent O(n²).",
     example:`POUR i ← 0 À n-1
    POUR j ← 0 À n-1
        ECRIRE(i, j)
    FINPOUR
FINPOUR
// estimation : O(n²)`},
    {title:"Optimiser", text:"Optimiser consiste à conserver le résultat tout en diminuant le nombre d’opérations ou la mémoire. On commence par mesurer, puis on identifie les parties coûteuses.",
     example:`// Mauvaise approche : rechercher n fois dans un tableau
// Meilleure approche : mémoriser les informations déjà calculées`}
   ]},
  {id:"graphs", level:"Expert", title:"Graphes et structures avancées", icon:"🕸️",
   sections:[
    {title:"Modéliser un graphe", text:"Un graphe contient des sommets et des arêtes. Il représente des réseaux, routes, relations, dépendances et bien d’autres systèmes.",
     example:`// Exemple logique
A -- B
|    |
D -- C`},
    {title:"BFS et DFS", text:"BFS explore niveau par niveau ; DFS explore en profondeur avant de revenir en arrière. Le choix dépend du problème.",
     example:`// BFS : file
file ← [A]
VISITER(A)
TANTQUE file non vide
    u ← EXTRAIRE_PREMIER(file)
    POUR chaque voisin v de u
        ...
    FINPOUR
FINTANTQUE`},
    {title:"Dijkstra", text:"Pour des poids d’arêtes non négatifs, Dijkstra construit progressivement des distances minimales depuis une source.",
     example:`dist[A] ← 0
// répéter : sélectionner le sommet non traité
// de distance minimale puis relaxer ses voisins`}
   ]}
];



const COURSE_EXTRA = [
 {id:"matrices",level:"Fondamental",title:"Algèbre matricielle et calcul scientifique",icon:"🔢",sections:[
  {title:"Dimensions et matrices carrées",objectives:["Lire m×n","Identifier une matrice carrée"],text:"Une matrice A de dimension m×n possède m lignes et n colonnes. Une matrice carrée n×n a autant de lignes que de colonnes. Dans une représentation numérique, A[i][j] désigne l’élément de la ligne i et de la colonne j.",keypoints:["Dimension m×n","Carrée : n×n","Indice ligne puis colonne"],example:`A ← [[1,2,3],[4,5,6]]\nECRIRE(LONGUEUR(A), LONGUEUR(A[0]))`},
  {title:"Addition et soustraction",objectives:["Vérifier les dimensions","Calculer case par case"],text:"L’addition et la soustraction sont définies entre matrices de mêmes dimensions. Pour chaque position, on applique l’opération aux deux éléments correspondants.",keypoints:["A+B","A-B","Même dimension obligatoire"],example:`A ← [[1,2],[3,4]]\nB ← [[5,6],[7,8]]\nS ← ADDITION_MATRICES(A,B)\nD ← SOUSTRACTION_MATRICES(A,B)\nECRIRE(S)\nECRIRE(D)` ,tp:"tp-matrices"},
  {title:"Produit matriciel",objectives:["Comprendre les trois indices","Vérifier la compatibilité"],text:"Si A est m×n et B est n×p, alors C=A×B est m×p. La case C[i][j] est la somme sur k de A[i][k]×B[k][j]. Cette définition explique la présence classique de trois boucles imbriquées.",keypoints:["Dimensions internes égales","C[i][j]=ΣA[i][k]B[k][j]","Trois indices i,j,k"],example:`A ← [[1,2],[3,4]]\nB ← [[5,6],[7,8]]\nP ← PRODUIT_MATRICES(A,B)\nECRIRE(P)`,tp:"tp-matrices"},
  {title:"Matrice identité, transposée et trace",objectives:["Construire I","Transposer une matrice","Calculer une trace"],text:"L’identité I_n possède des 1 sur la diagonale principale et des 0 ailleurs. La transposée échange lignes et colonnes. La trace d’une matrice carrée est la somme des éléments diagonaux.",keypoints:["I_n","Aᵀ","trace(A)"],example:`A ← [[1,2],[3,4]]\nECRIRE(IDENTITE(2))\nECRIRE(TRANSPOSEE(A))\nECRIRE(TRACE(A))`},
  {title:"Déterminant : 2×2, 3×3 et développement",objectives:["Calculer un déterminant","Comprendre le développement par mineurs"],text:"Pour [[a,b],[c,d]], det(A)=ad−bc. Pour une matrice 3×3, on peut développer suivant une ligne ou une colonne. AlgoLab calcule récursivement le déterminant des matrices carrées et refuse les matrices non carrées.",keypoints:["det([[a,b],[c,d]])=ad−bc","det(A)=0 implique une matrice singulière","Le développement récursif devient coûteux sur de grandes tailles"],example:`A ← [[4,7],[2,6]]\nECRIRE(DETERMINANT(A))`,tp:"tp-matrices"},
  {title:"Inverse et propriétés",objectives:["Relier déterminant et inversibilité","Interpréter A×A⁻¹"],text:"Une matrice carrée est inversible lorsque son déterminant est non nul. Pour 2×2, l’inverse de [[a,b],[c,d]] est 1/(ad−bc) × [[d,-b],[-c,a]]. Le laboratoire affiche l’inverse lorsque le calcul est défini.",keypoints:["det(A) ≠ 0","A×A⁻¹=I","Le cas det(A)=0 est impossible"],example:`A ← [[4,7],[2,6]]\nI ← INVERSE_MATRICE(A)\nECRIRE(I)` ,tp:"tp-matrices"}
 ]},
 {id:"programming",level:"Intermédiaire",title:"Méthodes de conception et validation",icon:"🧠",sections:[
  {title:"Spécification par pré/post-conditions",objectives:["Écrire un contrat","Clarifier ce qui doit être vrai"],text:"Une pré-condition décrit ce qui est supposé vrai avant l’algorithme. Une post-condition décrit le résultat garanti après son exécution. Cette écriture aide à construire des solutions vérifiables.",keypoints:["Pré-condition","Post-condition","Cas limites"],example:`// PRE : n >= 0\n// POST : résultat = somme des entiers de 1 à n`},
  {title:"Invariants de boucle",objectives:["Formuler une propriété conservée","Raisonner sur la correction"],text:"Un invariant est une propriété vraie avant et après chaque itération. Pour un parcours de maximum, après i positions parcourues, la variable maximum correspond au maximum des positions déjà visitées.",keypoints:["Initialisation","Conservation","Terminaison"],example:`maximum ← T[0]\n// invariant : maximum = max(T[0..i-1]) après chaque itération`},
  {title:"Tests unitaires et tests aux limites",objectives:["Construire un oracle","Tester des cas représentatifs"],text:"Un cas de test associe une entrée à un résultat attendu. Une campagne utile contient des cas normaux, limites, identiques, négatifs, vides lorsque c’est permis et des valeurs aléatoires contrôlées.",keypoints:["Entrée","Résultat attendu","Oracle","Régression"],example:`// [5,1,3] → [1,3,5]\n// [5,5,5] → [5,5,5]\n// [-3,0,-1] → [-3,-1,0]`},
  {title:"Stratégie de résolution",objectives:["Passer du problème à l’algorithme","Choisir une structure adaptée"],text:"Avant de coder, reformulez le problème, dessinez les données, identifiez les opérations dominantes, choisissez les structures puis testez une solution simple avant de l’optimiser.",keypoints:["Comprendre","Concevoir","Tester","Optimiser"],example:`// Problème → exemples → pseudo-code → tests → optimisation`}
 ]},
 {id:"strings",level:"Intermédiaire",title:"Chaînes de caractères — cours complet",icon:"🔤",sections:[
  {title:"Définition, littéraux et caractères",objectives:["Distinguer chaîne et caractère","Déclarer et initialiser une chaîne"],text:"Une chaîne est une séquence ordonnée de caractères : lettres, chiffres, espaces et symboles. Elle s’écrit entre guillemets, par exemple \"AlgoLab\". Une chaîne vide s’écrit \"\". Dans AlgoLab, les indices commencent à 0. Une chaîne de longueur n possède donc les positions 0 à n−1.",keypoints:["CHAINE","Chaîne vide : \"\"","Indices de 0 à n−1"],example:`ALGORITHME PremiereChaine\nnom ← "AlgoLab"\nECRIRE(nom)\nECRIRE(LONGUEUR(nom))\nFIN`},
  {title:"Accéder à un élément avec s[i]",objectives:["Lire un caractère par indice","Identifier premier et dernier caractère","Éviter un dépassement"],text:"L’expression s[i] donne le caractère situé à la position i. Le premier caractère est s[0]. Le dernier est s[LONGUEUR(s)−1]. Il est interdit d’accéder à un indice négatif ou supérieur ou égal à la longueur. Exemple : pour s=\"ALGO\", s[0]=\"A\", s[1]=\"L\" et s[3]=\"O\".",keypoints:["s[0] : premier","s[LONGUEUR(s)-1] : dernier","0 ≤ i < LONGUEUR(s)"],example:`ALGORITHME AccesCaractere\ns ← "ALGORITHME"\nECRIRE(s[0])\nECRIRE(s[4])\nECRIRE(s[LONGUEUR(s)-1])\nFIN`},
  {title:"Parcourir une chaîne",objectives:["Lire tous les caractères","Utiliser POUR et TANTQUE"],text:"Le parcours séquentiel visite chaque position de 0 à LONGUEUR(s)−1. Il sert à afficher les caractères, compter des occurrences, vérifier un format, construire une nouvelle chaîne ou calculer des statistiques.",keypoints:["Indice i","Boucle complète","Accès s[i]"],example:`ALGORITHME ParcoursChaine\ns ← "AlgoLab"\nPOUR i ← 0 À LONGUEUR(s)-1\n    ECRIRE(i, s[i])\nFINPOUR\nFIN`},
  {title:"Longueur, chaîne vide et validation",objectives:["Mesurer une chaîne","Valider une saisie non vide"],text:"LONGUEUR(s) renvoie le nombre de caractères, espaces compris. Avant d’utiliser s[0], vérifiez que LONGUEUR(s)>0. Une validation peut répéter la lecture tant que la chaîne est vide.",keypoints:["LONGUEUR(s)","Tester le vide","Espaces comptés"],example:`ALGORITHME ValidationNom\nnom ← ""\nTANTQUE LONGUEUR(nom) = 0\n    LIRE(nom)\nFINTANTQUE\nECRIRE(nom)\nFIN`},
  {title:"Concaténation et répétition",objectives:["Assembler des textes","Construire progressivement un résultat"],text:"La concaténation assemble des chaînes avec l’opérateur +. Pensez à ajouter explicitement les espaces nécessaires. REPETER_TEXTE(s,n) répète s n fois. Pour construire un résultat dans une boucle, initialisez resultat à la chaîne vide.",keypoints:["+ concatène","Espaces explicites","REPETER_TEXTE"],example:`ALGORITHME Concatener\nprenom ← "Amine"\nnom ← "Ben Ali"\ncomplet ← prenom + " " + nom\nligne ← REPETER_TEXTE("-", 10)\nECRIRE(complet)\nECRIRE(ligne)\nFIN`},
  {title:"Recherche avec POSITION, FIND et CONTIENT",objectives:["Trouver une position","Tester la présence d’un motif","Gérer une recherche sans résultat"],text:"POSITION(texte,motif) et FIND(texte,motif) renvoient l’indice de la première occurrence. Le résultat vaut −1 si le motif est absent. CONTIENT(texte,motif) renvoie VRAI ou FAUX. La recherche distingue les majuscules des minuscules.",keypoints:["POSITION/FIND","-1 si absent","CONTIENT"],example:`ALGORITHME ChercherMotif\ntexte ← "programmation algorithmique"\npos ← POSITION(texte, "algo")\nECRIRE(pos)\nECRIRE(CONTIENT(texte, "gramme"))\nECRIRE(POSITION(texte, "Java"))\nFIN`},
  {title:"Sous-chaîne avec SOUS_CHAINE",objectives:["Extraire une portion","Comprendre début et longueur"],text:"SOUS_CHAINE(s,debut,longueur) extrait longueur caractères à partir de debut. Par exemple SOUS_CHAINE(\"ALGORITHME\",0,4) donne \"ALGO\". Si la longueur dépasse la fin, l’extraction s’arrête au dernier caractère.",keypoints:["Début inclus","Troisième paramètre = longueur","Indices contrôlés"],example:`ALGORITHME Extraire\ns ← "ALGORITHME"\nprefixe ← SOUS_CHAINE(s, 0, 4)\nfin ← SOUS_CHAINE(s, 4, 6)\nECRIRE(prefixe)\nECRIRE(fin)\nFIN`},
  {title:"Majuscules, minuscules et normalisation",objectives:["Uniformiser la casse","Faire une comparaison insensible à la casse"],text:"MAJUSCULE(s) et MINUSCULE(s) convertissent la casse. SUPPRIMER_ESPACES(s) retire les espaces au début et à la fin. Ces opérations servent à normaliser une saisie avant comparaison.",keypoints:["MAJUSCULE","MINUSCULE","SUPPRIMER_ESPACES"],example:`ALGORITHME Normaliser\nreponse ← "  Oui  "\nreponse ← MINUSCULE(SUPPRIMER_ESPACES(reponse))\nSI reponse = "oui" ALORS\n    ECRIRE("ACCEPTE")\nFINSI\nFIN`},
  {title:"Remplacement et suppression",objectives:["Remplacer un motif","Supprimer une portion"],text:"REMPLACER(s,ancien,nouveau) remplace toutes les occurrences. Pour supprimer un motif, utilisez une chaîne vide comme nouveau texte. Cette opération produit une nouvelle chaîne.",keypoints:["REMPLACER","Suppression avec \"\"","Nouvelle chaîne"],example:`ALGORITHME Nettoyer\ns ← "12-34-56"\nsansTirets ← REMPLACER(s, "-", "")\nECRIRE(sansTirets)\nFIN`},
  {title:"Conversion chaîne ↔ nombre",objectives:["Convertir une saisie numérique","Créer une représentation textuelle"],text:"VERS_ENTIER(s) et VERS_REEL(s) convertissent une chaîne numérique. VERS_CHAINE(x) transforme une valeur en texte. Une conversion invalide doit être détectée dans une application réelle.",keypoints:["VERS_ENTIER","VERS_REEL","VERS_CHAINE"],example:`ALGORITHME Conversions\nageTexte ← "21"\nage ← VERS_ENTIER(ageTexte)\nmessage ← "Age futur : " + VERS_CHAINE(age + 1)\nECRIRE(message)\nFIN`},
  {title:"Compter des occurrences",objectives:["Compter un caractère","Compter un motif"],text:"Pour un caractère, parcourez s et incrémentez un compteur lorsque s[i] égale la cible. Pour un motif, testez les positions possibles ou utilisez POSITION répétitivement en avançant après chaque résultat.",keypoints:["Compteur initialisé à 0","Parcours complet","Chevauchement à décider"],example:`ALGORITHME CompterVoyelles\ns ← MINUSCULE("Algorithmique")\nnb ← 0\nPOUR i ← 0 À LONGUEUR(s)-1\n    SI CONTIENT("aeiouy", s[i]) ALORS\n        nb ← nb + 1\n    FINSI\nFINPOUR\nECRIRE(nb)\nFIN`},
  {title:"Inverser une chaîne",objectives:["Parcourir de droite à gauche","Construire une nouvelle chaîne"],text:"Pour inverser, partez du dernier indice et concaténez chaque caractère. La chaîne résultat commence vide. Cette technique prépare au test de palindrome.",keypoints:["PAS -1","Dernier vers premier","Résultat accumulé"],example:`ALGORITHME InverserChaine\ns ← "ALGO"\ninv ← ""\nPOUR i ← LONGUEUR(s)-1 À 0 PAS -1\n    inv ← inv + s[i]\nFINPOUR\nECRIRE(inv)\nFIN`},
  {title:"Palindrome",objectives:["Comparer symétriquement","Ignorer casse et espaces"],text:"Un palindrome se lit dans les deux sens. Une méthode compare s[gauche] et s[droite], puis rapproche les indices. Pour une phrase, normalisez d’abord la casse et retirez les espaces selon la règle choisie.",keypoints:["Deux indices","Normalisation","Arrêt au milieu"],example:`ALGORITHME Palindrome\ns ← MINUSCULE(SUPPRIMER_ESPACES("Radar"))\ngauche ← 0\ndroite ← LONGUEUR(s)-1\nok ← VRAI\nTANTQUE gauche < droite\n    SI s[gauche] <> s[droite] ALORS\n        ok ← FAUX\n    FINSI\n    gauche ← gauche + 1\n    droite ← droite - 1\nFINTANTQUE\nECRIRE(ok)\nFIN`},
  {title:"Recherche naïve d’un motif",objectives:["Programmer FIND manuellement","Analyser la complexité"],text:"Pour chaque position possible du texte, comparez successivement les caractères du motif. Si tous correspondent, la position est trouvée. Avec un texte de longueur n et un motif de longueur m, le pire cas est O((n−m+1)×m).",keypoints:["Positions 0 à n−m","Boucles imbriquées","Premier résultat ou tous"],example:`ALGORITHME RechercheNaive\ntexte ← "ALGORITHMELAB"\nmotif ← "LAB"\npos ← POSITION(texte, motif)\nECRIRE(pos)\nFIN`},
  {title:"Découpage et jointure",objectives:["Découper une chaîne","Recomposer un texte"],text:"DECOUPER(s,separateur) produit un tableau de morceaux. JOINDRE(tableau,separateur) assemble les éléments. Ces opérations sont utiles pour les CSV simples, les mots d’une phrase et les chemins.",keypoints:["DECOUPER","JOINDRE","Séparateur"],example:`ALGORITHME Mots\nT ← DECOUPER("algorithmique et programmation", " ")\nECRIRE(LONGUEUR(T))\nECRIRE(JOINDRE(T, "-"))\nFIN`},
  {title:"Erreurs fréquentes et stratégie de test",objectives:["Repérer les erreurs d’indice","Tester les cas limites"],text:"Erreurs fréquentes : utiliser l’indice LONGUEUR(s), oublier la chaîne vide, confondre position et longueur, oublier la casse, ou omettre les espaces lors d’une concaténation. Testez toujours : chaîne vide, un caractère, motif absent, motif au début, à la fin, répété, casse différente et caractères accentués.",keypoints:["Hors limites","Vide","Casse","Tests aux frontières"],example:`// Cas de test : "", "A", "ABA", "aaaa", "été", motif absent`}
 ]},

{id:"advanced2",level:"Expert",title:"Optimisation et algorithmes avancés",icon:"⚙️",sections:[
  {title:"Glouton : quand le choix local fonctionne",objectives:["Identifier les hypothèses","Distinguer heuristique et preuve"],text:"Une méthode gloutonne choisit à chaque étape une option locale sans revenir sur ce choix. Pour être sûre, il faut une propriété de choix glouton et une preuve adaptée au problème.",keypoints:["Choix local","Faisabilité","Preuve de correction"],example:`// Sélection d’activités : choisir une activité compatible\n// qui termine le plus tôt, puis continuer.`},
  {title:"Programmation dynamique",objectives:["Identifier les sous-problèmes","Mémoriser les résultats"],text:"La programmation dynamique s’applique lorsque les sous-problèmes se recouvrent et qu’une solution optimale se construit à partir de solutions de sous-problèmes. Elle remplace de nombreux recalculs par une mémoire contrôlée.",keypoints:["Mémoïsation","Tabulation","Sous-structure optimale"],example:`// fib(0)=0, fib(1)=1\n// F[i]=F[i-1]+F[i-2]`},
  {title:"Backtracking et élagage",objectives:["Construire une solution partielle","Revenir en arrière"],text:"Le backtracking explore un espace de décisions. Dès qu’une contrainte est violée, la branche est abandonnée. Un bon élagage réduit fortement le nombre de possibilités explorées.",keypoints:["Choisir","Tester","Continuer","Annuler"],example:`// N-reines : placer une reine → vérifier → continuer\n// ou revenir en arrière.`},
  {title:"Analyse empirique",objectives:["Comparer sur des données","Relier mesures et complexité"],text:"Les mesures expérimentales complètent l’analyse théorique. Comparez des jeux de données identiques et contrôlez la taille, le nombre de tests et les conditions d’exécution.",keypoints:["Mesure","Répétition","Taille d’entrée","Interprétation"],example:`// Comparer les étapes de deux tris sur n=10,100,500.`}
 ]}

// ===== V18 : compléments pédagogiques systématiques =====
const V18_COMPLEMENTS={"intro":[{"title":"Structure complète d’un algorithme","objectives":["Reconnaître les parties d’un algorithme","Séparer déclarations et instructions"],"text":"Un algorithme académique comporte un nom, éventuellement des constantes et variables, puis un bloc DEBUT/FIN. Les données d’entrée, résultats et contraintes doivent être identifiés avant l’écriture des instructions.","keypoints":["En-tête","Déclarations","Corps"],"example":"ALGORITHME AireRectangle\nVARIABLES\n  longueur, largeur, aire : REEL\nDEBUT\n  LIRE(longueur, largeur)\n  aire ← longueur * largeur\n  ECRIRE(aire)\nFIN"},{"title":"Constantes, identificateurs et nommage","objectives":["Déclarer une constante","Choisir des noms lisibles"],"text":"Une constante reçoit une valeur qui ne change pas. Un identificateur doit être explicite, commencer par une lettre et éviter les mots réservés. Des noms comme totalNotes sont préférables à x.","keypoints":["Immutabilité","Lisibilité"],"example":"CONSTANTES\n  TVA ← 0.19\nVARIABLES\n  prixHT, prixTTC : REEL\nDEBUT\n  prixHT ← 100\n  prixTTC ← prixHT * (1 + TVA)\n  ECRIRE(prixTTC)\nFIN"},{"title":"Priorité et conversions de types","objectives":["Évaluer une expression","Distinguer /, DIV et MOD"],"text":"Les parenthèses sont évaluées avant la multiplication et la division, puis l’addition et la soustraction. Une division peut produire un réel. Une conversion explicite clarifie l’intention et limite les résultats inattendus.","keypoints":["Parenthèses","Conversion","Type du résultat"],"example":"a ← 7\nb ← 2\nquotientReel ← a / b\nquotientEntier ← a DIV b\nreste ← a MOD b\nECRIRE(quotientReel, quotientEntier, reste)"},{"title":"Erreurs syntaxiques, sémantiques et logiques","objectives":["Classer une erreur","Choisir une méthode de correction"],"text":"Une erreur syntaxique viole la grammaire, une erreur sémantique utilise mal une donnée, et une erreur logique produit un résultat faux malgré une exécution possible. La trace et les tests permettent de les distinguer.","keypoints":["Syntaxe","Sémantique","Logique"],"example":"// Syntaxe : FINSI manquant\n// Sémantique : additionner un nombre et un tableau\n// Logique : moyenne ← somme / (n-1)"},{"title":"Trace d’exécution et état mémoire","objectives":["Construire une trace","Observer les changements d’état"],"text":"Une trace note après chaque instruction les valeurs des variables. Elle aide à expliquer le résultat, trouver l’étape fautive et vérifier les cas limites.","keypoints":["Instruction","Avant","Après"],"example":"a ← 2\nb ← 5\na ← a + b\nb ← a - b\nECRIRE(a, b)"}],"control":[{"title":"Conditions composées et tables de vérité","objectives":["Composer des conditions","Évaluer ET, OU et NON"],"text":"ET exige que les deux conditions soient vraies, OU qu’au moins une le soit, et NON inverse une valeur logique. Les parenthèses rendent les conditions longues plus sûres.","keypoints":["Priorité logique","Parenthèses"],"example":"age ← 20\ncarte ← VRAI\nSI age >= 18 ET carte = VRAI ALORS\n  ECRIRE(\"Accès autorisé\")\nFINSI"},{"title":"Conditions imbriquées et SINON SI","objectives":["Ordonner des seuils","Éviter les cas inaccessibles"],"text":"SINON SI permet de traiter plusieurs intervalles sans multiplier les niveaux d’imbrication. L’ordre des tests est important, notamment pour les seuils.","keypoints":["Cascade","Exclusivité"],"example":"SI note >= 16 ALORS\n  ECRIRE(\"Très bien\")\nSINON SI note >= 14 ALORS\n  ECRIRE(\"Bien\")\nSINON SI note >= 10 ALORS\n  ECRIRE(\"Admis\")\nSINON\n  ECRIRE(\"Ajourné\")\nFINSI"},{"title":"SELON / CAS","objectives":["Choisir entre SI et SELON","Prévoir un cas par défaut"],"text":"SELON convient lorsqu’une expression discrète est comparée à plusieurs valeurs. Le cas AUTRE couvre les valeurs non prévues.","keypoints":["CAS","AUTRE"],"example":"SELON choix\n  CAS 1 : ECRIRE(\"Ajouter\")\n  CAS 2 : ECRIRE(\"Modifier\")\n  CAS 3 : ECRIRE(\"Quitter\")\n  AUTRE : ECRIRE(\"Choix invalide\")\nFINSELON"},{"title":"Choisir entre POUR, TANTQUE et RÉPÉTER","objectives":["Choisir la bonne boucle","Justifier la condition d’arrêt"],"text":"POUR convient à un nombre connu d’itérations. TANTQUE teste avant et peut ne jamais exécuter le corps. RÉPÉTER teste après et exécute au moins une fois.","keypoints":["Pré-test","Post-test"],"example":"RÉPÉTER\n  LIRE(n)\nJUSQU’À n >= 0"},{"title":"Boucles imbriquées","objectives":["Suivre deux indices","Estimer le nombre d’itérations"],"text":"Une boucle interne est exécutée pour chaque itération externe. Elles servent aux matrices, motifs et comparaisons de paires. Leur coût est souvent multiplicatif.","keypoints":["Boucle externe","Boucle interne"],"example":"POUR i ← 1 À 3\n  POUR j ← 1 À 4\n    ECRIRE(i, j)\n  FINPOUR\nFINPOUR"},{"title":"Sentinelle et validation de saisie","objectives":["Utiliser une sentinelle","Valider une entrée"],"text":"Une sentinelle est une valeur spéciale qui termine une suite de saisies. Une validation refuse les valeurs hors domaine et redemande une donnée.","keypoints":["Valeur d’arrêt","Boucle indéterminée"],"example":"somme ← 0\nLIRE(n)\nTANTQUE n <> -1\n  somme ← somme + n\n  LIRE(n)\nFINTANTQUE\nECRIRE(somme)"},{"title":"QUITTER et CONTINUER","objectives":["Contrôler une boucle","Éviter les sorties opaques"],"text":"QUITTER termine immédiatement la boucle. CONTINUER passe à l’itération suivante. Ils doivent rester rares pour préserver une structure facile à comprendre.","keypoints":["Break","Continue"],"example":"POUR i ← 1 À 20\n  SI i MOD 2 <> 0 ALORS\n    CONTINUER\n  FINSI\n  SI i > 10 ALORS\n    QUITTER\n  FINSI\n  ECRIRE(i)\nFINPOUR"},{"title":"Invariants et boucles infinies","objectives":["Formuler un invariant","Prouver la terminaison"],"text":"Un invariant reste vrai avant et après chaque itération. Pour garantir la terminaison, une quantité doit progresser vers la condition d’arrêt.","keypoints":["Initialisation","Conservation","Terminaison"],"example":"i ← 0\n// invariant : 0 <= i <= n\nTANTQUE i < n\n  i ← i + 1\nFINTANTQUE"}],"arrays":[{"title":"Déclaration, remplissage et affichage indexé","objectives":["Remplir un tableau","Contrôler les indices"],"text":"Un tableau possède une taille et des indices valides. Le remplissage et l’affichage utilisent un parcours complet. Toute lecture T[i] exige 0 ≤ i < LONGUEUR(T).","keypoints":["Taille","Indice"],"example":"T ← [0,0,0,0]\nPOUR i ← 0 À LONGUEUR(T)-1\n  LIRE(T[i])\nFINPOUR\nPOUR i ← 0 À LONGUEUR(T)-1\n  ECRIRE(i, T[i])\nFINPOUR"},{"title":"Statistiques en un seul parcours","objectives":["Calculer plusieurs indicateurs","Limiter les parcours"],"text":"Somme, moyenne, minimum, maximum et occurrences peuvent être calculés lors d’un parcours unique. Minimum et maximum doivent être initialisés avec le premier élément.","keypoints":["Accumulateur","Extrêmes"],"example":"T ← [12,8,19,7,15]\nsomme ← 0\nminimum ← T[0]\nmaximum ← T[0]\nPOUR i ← 0 À LONGUEUR(T)-1\n  somme ← somme + T[i]\n  SI T[i] < minimum ALORS minimum ← T[i] FINSI\n  SI T[i] > maximum ALORS maximum ← T[i] FINSI\nFINPOUR\nECRIRE(somme/LONGUEUR(T), minimum, maximum)"},{"title":"Inverser, décaler et faire tourner","objectives":["Échanger en place","Comprendre rotation et décalage"],"text":"L’inversion échange les éléments symétriques. Un décalage déplace les valeurs et libère une position. Une rotation réinjecte l’élément sorti à l’autre extrémité.","keypoints":["Deux indices","Variable temporaire"],"example":"g ← 0\nd ← LONGUEUR(T)-1\nTANTQUE g < d\n  temp ← T[g]\n  T[g] ← T[d]\n  T[d] ← temp\n  g ← g + 1\n  d ← d - 1\nFINTANTQUE"},{"title":"Insertion et suppression logique","objectives":["Préserver les éléments","Mettre à jour la taille logique"],"text":"Dans un tableau de capacité fixe, l’insertion décale vers la droite et la suppression vers la gauche. Une variable taille indique la partie réellement utilisée.","keypoints":["Capacité","Taille utile"],"example":"// insérer valeur à position p\nPOUR i ← taille À p+1 PAS -1\n  T[i] ← T[i-1]\nFINPOUR\nT[p] ← valeur\ntaille ← taille + 1"},{"title":"Occurrences et suppression des doublons","objectives":["Détecter les doublons","Construire un résultat"],"text":"Un tableau sans doublons peut être construit en ajoutant une valeur seulement si elle n’existe pas encore. La solution naïve combine deux parcours.","keypoints":["Recherche","Unicité"],"example":"U ← []\n// pour chaque T[i], rechercher dans U\n// ajouter seulement si absent"},{"title":"Tableaux parallèles et enregistrements","objectives":["Relier des données","Comprendre les limites des tableaux parallèles"],"text":"Des tableaux parallèles utilisent le même indice pour décrire une entité, mais un enregistrement regroupe mieux les champs associés. Les indices doivent toujours rester synchronisés.","keypoints":["Synchronisation","Structure"],"example":"noms ← [\"Ali\",\"Sarra\"]\nnotes ← [14,17]\nPOUR i ← 0 À 1\n  ECRIRE(noms[i], notes[i])\nFINPOUR"},{"title":"Traitements matriciels complémentaires","objectives":["Traiter lignes et colonnes","Utiliser deux indices"],"text":"Pour une matrice, on peut calculer les sommes par ligne et colonne, rechercher des coordonnées, tester la symétrie et parcourir les deux diagonales.","keypoints":["Coordonnées","Dimensions"],"example":"POUR i ← 0 À LONGUEUR(M)-1\n  sommeLigne ← 0\n  POUR j ← 0 À LONGUEUR(M[i])-1\n    sommeLigne ← sommeLigne + M[i][j]\n  FINPOUR\n  ECRIRE(i, sommeLigne)\nFINPOUR"}],"functions":[{"title":"Fonction ou procédure ?","objectives":["Distinguer fonction et procédure","Choisir le bon sous-programme"],"text":"Une fonction calcule et retourne une valeur utilisable dans une expression. Une procédure réalise une action et s’appelle comme une instruction. Le choix dépend du contrat du sous-programme.","keypoints":["Valeur retournée","Action"],"example":"FONCTION carre(x : REEL) : REEL\nDEBUT\n  RETOURNER x*x\nFINFONCTION\n\nPROCEDURE afficherBonjour()\nDEBUT\n  ECRIRE(\"Bonjour\")\nFINPROCEDURE"},{"title":"Déclarer et appeler une procédure","objectives":["Écrire une procédure","Effectuer un appel"],"text":"Une procédure possède un nom, des paramètres éventuels et un corps. Elle ne doit pas être utilisée comme une valeur. L’appel se fait avec APPELER.","keypoints":["PROCEDURE","APPELER"],"example":"PROCEDURE afficherLigne(n : ENTIER)\nDEBUT\n  POUR i ← 1 À n\n    ECRIRE(\"*\")\n  FINPOUR\nFINPROCEDURE\n\nAPPELER afficherLigne(5)"},{"title":"Paramètres d’entrée, sortie et entrée/sortie","objectives":["Comprendre les modes de paramètres","Éviter les modifications cachées"],"text":"ENTREE transmet une valeur, SORTIE permet au sous-programme de produire une donnée, et ENTREE_SORTIE autorise lecture et modification. Ces modes doivent être annoncés dans le contrat.","keypoints":["Entrée","Sortie","Référence"],"example":"PROCEDURE echanger(ENTREE_SORTIE a : ENTIER, ENTREE_SORTIE b : ENTIER)\nDEBUT\n  temp ← a\n  a ← b\n  b ← temp\nFINPROCEDURE"},{"title":"Passage par valeur et par référence","objectives":["Prévoir l’effet d’un appel","Limiter les effets de bord"],"text":"Par valeur, le sous-programme reçoit une copie. Par référence, il agit sur la variable d’origine. Un passage par référence facilite certaines procédures mais augmente les effets de bord.","keypoints":["Copie","Référence"],"example":"PROCEDURE incrementer(ENTREE_SORTIE n : ENTIER)\nDEBUT\n  n ← n + 1\nFINPROCEDURE"},{"title":"Portée locale, globale et durée de vie","objectives":["Identifier la portée","Préférer les dépendances explicites"],"text":"Une variable locale existe seulement pendant l’appel. Une globale est visible plus largement et rend les dépendances moins explicites. Préférez paramètres et retours aux globales modifiables.","keypoints":["Locale","Globale"],"example":"FONCTION aire(r : REEL) : REEL\nVARIABLES\n  resultat : REEL\nDEBUT\n  resultat ← 3.14*r*r\n  RETOURNER resultat\nFINFONCTION"},{"title":"Contrat, préconditions et postconditions","objectives":["Documenter un sous-programme","Tester ses limites"],"text":"Le contrat explique ce que le sous-programme attend et garantit. Une précondition invalide doit être rejetée ou documentée.","keypoints":["Précondition","Postcondition"],"example":"FONCTION racinePositive(x : REEL) : REEL\n// PRE : x >= 0\n// POST : résultat*résultat ≈ x"},{"title":"Pile d’appels et récursivité indirecte","objectives":["Suivre la pile d’appels","Identifier un cas de base"],"text":"Chaque appel crée un contexte avec paramètres et variables locales. La récursivité consomme la pile. Une récursivité indirecte apparaît lorsque A appelle B et B rappelle A.","keypoints":["Cadre d’appel","Profondeur"],"example":"FONCTION pair(n : ENTIER) : BOOLEEN\n  SI n = 0 ALORS RETOURNER VRAI\n  SINON RETOURNER impair(n-1)\n  FINSI\nFINFONCTION"},{"title":"Tests unitaires et fonctions pures","objectives":["Construire des tests unitaires","Reconnaître une fonction pure"],"text":"Une fonction pure dépend seulement de ses paramètres et ne modifie pas l’extérieur. Elle est plus simple à tester. Chaque test associe des entrées à un résultat attendu.","keypoints":["Oracle","Cas limites"],"example":"// tests de maximum(a,b)\n// maximum(2,5) → 5\n// maximum(-3,-8) → -3\n// maximum(4,4) → 4"},{"title":"Erreurs fréquentes","objectives":["Diagnostiquer un appel incorrect","Sécuriser les retours"],"text":"Les erreurs courantes sont : oublier RETOURNER, retourner seulement dans une branche, modifier un paramètre d’entrée, appeler une procédure dans une expression et omettre le cas de base récursif.","keypoints":["Retour manquant","Effet de bord"],"example":"// Incorrect : x ← afficherMessage()\n// Correct : APPELER afficherMessage()"}],"searchsort":[{"title":"Recherche linéaire et toutes les occurrences","objectives":["Choisir l’arrêt","Traiter les doublons"],"text":"La recherche linéaire fonctionne sur tout tableau. Elle peut s’arrêter au premier résultat ou mémoriser toutes les positions. Son pire cas est O(n).","keypoints":["Premier résultat","Toutes occurrences"],"example":"positions ← []\nPOUR i ← 0 À LONGUEUR(T)-1\n  SI T[i] = cible ALORS\n    // ajouter i à positions\n  FINSI\nFINPOUR"},{"title":"Conditions de la recherche dichotomique","objectives":["Vérifier le prérequis de tri","Mettre à jour les bornes"],"text":"La recherche dichotomique exige un tableau trié et un ordre cohérent. À chaque comparaison, elle élimine la moitié impossible. Son coût est O(log n).","keypoints":["Tri préalable","Intervalle"],"example":"gauche ← 0\ndroite ← LONGUEUR(T)-1\nTANTQUE gauche <= droite\n  milieu ← (gauche+droite) DIV 2\n  // comparer et réduire l’intervalle\nFINTANTQUE"},{"title":"Première et dernière occurrence","objectives":["Adapter une recherche","Gérer les doublons"],"text":"Avec des doublons, une recherche dichotomique peut continuer à gauche après un résultat pour la première occurrence, ou à droite pour la dernière.","keypoints":["Borne gauche","Borne droite"],"example":"// si T[milieu] = cible :\n// mémoriser milieu puis droite ← milieu-1\n// pour chercher la première occurrence"},{"title":"Tri à bulles, stabilité et arrêt anticipé","objectives":["Optimiser le tri à bulles","Définir la stabilité"],"text":"Le tri à bulles échange les voisins mal ordonnés. Il est stable si l’échange n’a lieu que pour >. Un indicateur echange permet de s’arrêter lorsque le tableau est déjà trié.","keypoints":["Voisins","Arrêt anticipé"],"example":"RÉPÉTER\n  echange ← FAUX\n  POUR j ← 0 À n-2\n    SI T[j] > T[j+1] ALORS\n      // échanger\n      echange ← VRAI\n    FINSI\n  FINPOUR\nJUSQU’À echange = FAUX"},{"title":"Ordre croissant, décroissant et clé de tri","objectives":["Modifier un comparateur","Trier selon une clé"],"text":"Le sens du tri dépend du comparateur. Pour des enregistrements, on trie selon une clé, par exemple la note puis le nom en cas d’égalité.","keypoints":["Comparateur","Clé"],"example":"// croissant : T[j] > T[j+1]\n// décroissant : T[j] < T[j+1]"},{"title":"Choisir un tri","objectives":["Comparer les compromis","Justifier un choix"],"text":"Insertion convient aux petites données presque triées. Fusion garantit O(n log n) mais utilise une mémoire auxiliaire. Rapide est performant en moyenne. Comptage convient à des entiers dans un domaine réduit.","keypoints":["Temps","Mémoire","Stabilité"],"example":"// Le choix dépend de n, du désordre, de la mémoire,\n// de la stabilité et du domaine des valeurs."}],"complexity":[{"title":"Taille d’entrée et modèle de coût","objectives":["Définir la taille","Identifier l’opération dominante"],"text":"La taille n doit être définie avant l’analyse : nombre d’éléments, sommets, caractères ou bits. On compte les opérations dominantes dans un modèle cohérent.","keypoints":["Paramètre n","Modèle"],"example":"// Tableau T : n = LONGUEUR(T)\n// Matrice m×p : taille = m*p"},{"title":"Meilleur, moyen et pire cas","objectives":["Distinguer les cas","Énoncer ses hypothèses"],"text":"Le meilleur cas décrit l’entrée la plus favorable, le pire garantit une borne, et le cas moyen dépend d’hypothèses de distribution.","keypoints":["Borne","Distribution"],"example":"// Recherche linéaire :\n// meilleur O(1), pire O(n), moyen O(n)"},{"title":"O, Ω et Θ","objectives":["Interpréter les notations","Simplifier une expression"],"text":"O donne une borne asymptotique supérieure, Ω une borne inférieure et Θ une croissance du même ordre. En pratique pédagogique, O est souvent utilisé pour le pire cas.","keypoints":["Borne supérieure","Borne serrée"],"example":"// 3n² + 5n + 8 appartient à Θ(n²)"},{"title":"Boucles consécutives, imbriquées et logarithmiques","objectives":["Analyser une structure","Éviter de confondre séquence et imbrication"],"text":"Les blocs consécutifs s’additionnent puis gardent le terme dominant. Les boucles imbriquées se multiplient. Une variable doublée ou divisée par deux mène souvent à O(log n).","keypoints":["Somme","Produit","Logarithme"],"example":"i ← 1\nTANTQUE i < n\n  i ← i * 2\nFINTANTQUE"},{"title":"Complexité spatiale et compromis temps-mémoire","objectives":["Mesurer l’espace","Comparer deux solutions"],"text":"La mémoire auxiliaire exclut généralement les données d’entrée. Une table de mémorisation accélère parfois le calcul au prix de davantage d’espace.","keypoints":["Mémoire auxiliaire","Compromis"],"example":"// Tri fusion : temps O(n log n), espace auxiliaire O(n)"},{"title":"Récurrences simples","objectives":["Écrire une récurrence","Reconnaître des formes usuelles"],"text":"Un algorithme récursif se décrit par une récurrence. T(n)=T(n−1)+O(1) donne O(n), tandis que T(n)=2T(n/2)+O(n) conduit à O(n log n).","keypoints":["Sous-problème","Coût de combinaison"],"example":"// factorielle : T(n)=T(n-1)+O(1)\n// tri fusion : T(n)=2T(n/2)+O(n)"},{"title":"Coût amorti","objectives":["Comprendre l’amortissement","Analyser une séquence"],"text":"Une opération occasionnellement coûteuse peut avoir un faible coût moyen sur une suite d’opérations, comme l’agrandissement d’un tableau dynamique.","keypoints":["Coût total","Moyenne amortie"],"example":"// Une suite de n ajouts peut coûter O(n) au total\n// malgré quelques redimensionnements coûteux."}],"graphs":[{"title":"Vocabulaire et types de graphes","objectives":["Employer le vocabulaire","Classifier un graphe"],"text":"Un graphe peut être orienté ou non, pondéré ou non. On distingue voisin, degré, chemin, cycle, connexité et composante connexe.","keypoints":["Sommet","Arête","Arc"],"example":"// V={A,B,C}\n// E={(A,B),(B,C)}"},{"title":"Liste et matrice d’adjacence","objectives":["Choisir une représentation","Comparer la mémoire"],"text":"La matrice facilite le test d’existence d’une arête en O(1) mais occupe O(V²). La liste utilise O(V+E) et convient aux graphes peu denses.","keypoints":["Dense","Creux"],"example":"adj ← [[1,2],[0,2],[0,1]]\n// adj[0] contient les voisins du sommet 0"},{"title":"BFS détaillé avec une file","objectives":["Utiliser une file","Éviter les visites répétées"],"text":"BFS marque la source, l’enfile puis traite les voisins non visités. Il calcule les distances en nombre d’arêtes dans un graphe non pondéré.","keypoints":["Marquage","Niveaux"],"example":"ENFILER(file, source)\nTANTQUE file non vide\n  u ← DEFILER(file)\n  POUR CHAQUE v voisin de u\n    SI NON visite[v] ALORS\n      visite[v] ← VRAI\n      ENFILER(file,v)\n    FINSI\n  FINPOUR\nFINTANTQUE"},{"title":"DFS, pile et récursion","objectives":["Écrire DFS","Comprendre le retour arrière"],"text":"DFS marque un sommet puis explore profondément chaque voisin non visité. Il sert aux composantes, cycles, parcours de labyrinthe et tris topologiques.","keypoints":["Pile","Récursion"],"example":"PROCEDURE dfs(u)\n  visite[u] ← VRAI\n  POUR CHAQUE v voisin de u\n    SI NON visite[v] ALORS APPELER dfs(v) FINSI\n  FINPOUR\nFINPROCEDURE"},{"title":"Composantes connexes et cycles","objectives":["Compter les composantes","Distinguer les cycles"],"text":"Pour compter les composantes, lancez un parcours depuis chaque sommet non visité. Un cycle se détecte différemment selon que le graphe est orienté ou non.","keypoints":["Visité","Parent"],"example":"composantes ← 0\nPOUR chaque sommet s\n  SI NON visite[s] ALORS\n    APPELER dfs(s)\n    composantes ← composantes + 1\n  FINSI\nFINPOUR"},{"title":"Tri topologique","objectives":["Reconnaître un DAG","Ordonner des dépendances"],"text":"Un tri topologique ordonne les sommets d’un graphe orienté acyclique afin que chaque dépendance précède ce qui en dépend. Un cycle rend cet ordre impossible.","keypoints":["Degré entrant","Cycle"],"example":"// Kahn : calculer les degrés entrants,\n// enfiler les sommets de degré 0, puis retirer leurs arcs."},{"title":"Plus courts chemins et limites de Dijkstra","objectives":["Choisir un algorithme de chemin","Comprendre le relâchement"],"text":"Dijkstra exige des poids non négatifs. Bellman-Ford accepte des poids négatifs et détecte certains cycles négatifs. Floyd-Warshall calcule toutes les paires.","keypoints":["Poids négatif","Distance"],"example":"// Dijkstra : choisir le sommet non traité de distance minimale\n// puis relâcher ses arêtes."},{"title":"Arbre couvrant minimal","objectives":["Distinguer chemin et arbre couvrant","Éviter les cycles"],"text":"Prim et Kruskal cherchent un ensemble d’arêtes reliant tous les sommets avec un poids total minimal. Kruskal trie les arêtes et évite les cycles.","keypoints":["Prim","Kruskal"],"example":"// Kruskal : trier les arêtes par poids\n// ajouter une arête si elle relie deux composantes distinctes."}],"structures":[{"title":"Pile : opérations et erreurs","objectives":["Manipuler une pile","Prévenir le sous-dépassement"],"text":"EMPILER ajoute au sommet, DEPILER retire le sommet, SOMMET le consulte. Avant DEPILER, il faut vérifier que la pile n’est pas vide.","keypoints":["LIFO","Sommet"],"example":"EMPILER(P, 10)\nEMPILER(P, 20)\nx ← DEPILER(P)\nECRIRE(x)"},{"title":"File et file circulaire","objectives":["Manipuler une file","Comprendre le tampon circulaire"],"text":"ENFILER ajoute en fin et DEFILER retire en tête. Une implémentation circulaire réutilise les cases libérées grâce au modulo.","keypoints":["FIFO","Tête","Fin"],"example":"fin ← (fin + 1) MOD capacite\nF[fin] ← valeur"},{"title":"Listes chaînées","objectives":["Comparer liste et tableau","Suivre les liens"],"text":"Chaque maillon contient une valeur et un lien. L’insertion en tête est O(1), mais accéder à la position i exige un parcours. Une liste double ajoute un lien précédent.","keypoints":["Maillon","Référence"],"example":"// nouveau.suivant ← tete\n// tete ← nouveau"},{"title":"Dictionnaires et tables de hachage","objectives":["Utiliser des clés","Comprendre une collision"],"text":"Un dictionnaire associe une clé à une valeur. Une fonction de hachage choisit une case. Les collisions sont gérées par chaînage ou adressage ouvert.","keypoints":["Clé","Hachage"],"example":"notes[\"Ali\"] ← 15\nECRIRE(notes[\"Ali\"])"},{"title":"Arbre binaire de recherche","objectives":["Chercher dans un ABR","Relier coût et hauteur"],"text":"Dans un ABR, les clés plus petites sont à gauche et les plus grandes à droite. Recherche et insertion sont O(h), où h est la hauteur.","keypoints":["Racine","Sous-arbre"],"example":"// si x < noeud.valeur : aller à gauche\n// sinon : aller à droite"},{"title":"Tas et file de priorité","objectives":["Comprendre un tas","Choisir une file de priorité"],"text":"Un tas binaire maintient un minimum ou maximum à la racine. L’insertion et l’extraction coûtent O(log n). Il sert notamment à Dijkstra.","keypoints":["Priorité","Réorganisation"],"example":"// tas min : parent <= enfants\n// extraireMin échange la racine avec le dernier puis rétablit le tas."},{"title":"Choisir une structure","objectives":["Associer besoin et structure","Comparer les complexités"],"text":"Le choix dépend des opérations dominantes : accès par indice, insertion, suppression, recherche par clé, ordre FIFO/LIFO ou priorité.","keypoints":["Opération dominante","Compromis"],"example":"// Besoin FIFO → file\n// Annulation → pile\n// Recherche par clé → dictionnaire"}],"programming":[{"title":"Analyse descendante et raffinements successifs","objectives":["Décomposer un problème","Construire progressivement"],"text":"On décompose le problème en tâches, puis chaque tâche en sous-tâches jusqu’à obtenir des instructions simples et testables.","keypoints":["Module","Raffinement"],"example":"// gérerCommande\n// 1 lireCommande\n// 2 validerCommande\n// 3 calculerTotal\n// 4 afficherFacture"},{"title":"Assertions et programmation défensive","objectives":["Écrire une assertion","Valider avant d’agir"],"text":"Une assertion documente une propriété supposée vraie. La programmation défensive valide les paramètres, indices et états avant les opérations risquées.","keypoints":["Précondition","Échec rapide"],"example":"ASSERTION LONGUEUR(T) > 0\nASSERTION 0 <= i ET i < LONGUEUR(T)"},{"title":"Boîte noire, boîte blanche et couverture","objectives":["Distinguer les stratégies","Améliorer une campagne"],"text":"La boîte noire dérive les tests de la spécification. La boîte blanche observe les branches et boucles. La couverture indique quelles parties ont été exécutées, sans prouver l’absence d’erreur.","keypoints":["Branches","Chemins"],"example":"// pour un SI/SINON : prévoir au moins un test par branche"},{"title":"Classes d’équivalence et valeurs frontières","objectives":["Réduire les tests intelligemment","Couvrir les frontières"],"text":"On regroupe les entrées supposées se comporter pareil puis on teste près des limites, où les erreurs sont fréquentes.","keypoints":["Partition","Limite"],"example":"// âge valide 0..120 : tester -1,0,1,119,120,121"},{"title":"Tables de décision","objectives":["Formaliser une règle","Détecter les cas oubliés"],"text":"Une table de décision énumère les combinaisons de conditions et les actions attendues. Elle clarifie les règles métier complexes.","keypoints":["Condition","Action"],"example":"// Conditions : client fidèle ? montant >= 100 ?\n// Actions : remise 0%, 5% ou 10%"},{"title":"Débogage systématique","objectives":["Suivre une méthode","Créer un test de régression"],"text":"Reproduisez l’erreur, réduisez le cas, formulez une hypothèse, observez la trace, corrigez une cause puis ajoutez un test de régression.","keypoints":["Reproduction","Hypothèse"],"example":"// entrée minimale qui échoue → trace → variable divergente → correction"},{"title":"Documentation et maintenabilité","objectives":["Améliorer la lisibilité","Limiter la duplication"],"text":"Un algorithme lisible possède des noms explicites, des sous-programmes courts, peu de duplication et des commentaires qui expliquent pourquoi plutôt que répéter le code.","keypoints":["Nommage","Responsabilité"],"example":"// Mauvais : i2, x1\n// Mieux : indiceDernier, totalValide"}],"advanced2":[{"title":"Diviser pour régner","objectives":["Reconnaître la stratégie","Identifier le coût de combinaison"],"text":"Cette stratégie divise le problème en sous-problèmes indépendants, les résout puis combine les résultats. Tri fusion et recherche dichotomique en sont des exemples.","keypoints":["Division","Combinaison"],"example":"// diviser T en deux moitiés\n// trier chaque moitié\n// fusionner"},{"title":"Mémoïsation et tabulation","objectives":["Comparer deux approches","Définir un état"],"text":"La mémoïsation est descendante et stocke les appels utiles. La tabulation est ascendante et remplit une table dans un ordre garantissant les dépendances.","keypoints":["État","Transition"],"example":"F[0] ← 0\nF[1] ← 1\nPOUR i ← 2 À n\n  F[i] ← F[i-1] + F[i-2]\nFINPOUR"},{"title":"Sac à dos et reconstruction","objectives":["Modéliser un état","Reconstruire une solution"],"text":"La programmation dynamique calcule la meilleure valeur pour chaque capacité. Pour reconstruire les objets choisis, on conserve les décisions ou on remonte la table.","keypoints":["Capacité","Décision"],"example":"// dp[i][c] = meilleur résultat avec les i premiers objets\n// et une capacité c"},{"title":"Backtracking : choisir, explorer, annuler","objectives":["Écrire le schéma de retour arrière","Ajouter un élagage"],"text":"Le schéma général ajoute un choix, vérifie les contraintes, explore récursivement puis annule le choix. L’ordre et l’élagage influencent fortement les performances.","keypoints":["Choisir","Annuler"],"example":"PROCEDURE explorer(solution)\n  SI complete(solution) ALORS ECRIRE(solution)\n  SINON\n    POUR chaque choix possible\n      ajouter(choix)\n      SI valide(solution) ALORS APPELER explorer(solution) FINSI\n      annuler(choix)\n    FINPOUR\n  FINSI\nFINPROCEDURE"},{"title":"Branch and bound et heuristiques","objectives":["Distinguer exact et heuristique","Utiliser une borne"],"text":"Branch and bound élimine une branche grâce à une borne prouvant qu’elle ne peut battre la meilleure solution. Une heuristique vise une bonne solution sans garantir l’optimalité.","keypoints":["Optimalité","Élagage"],"example":"// si borne(partiel) >= meilleureValeur : élaguer"},{"title":"Prouver un choix glouton","objectives":["Ne pas confondre intuition et preuve","Construire un argument d’échange"],"text":"Une solution gloutonne correcte nécessite généralement une propriété de choix glouton et une sous-structure optimale. Un argument d’échange montre qu’un choix optimal peut commencer par le choix local.","keypoints":["Choix local","Preuve"],"example":"// Sélection d’activités : remplacer la première activité\n// d’une solution optimale par celle qui finit le plus tôt."},{"title":"Protocole d’analyse empirique","objectives":["Construire une expérience","Interpréter une courbe"],"text":"Fixez les données, répétez les mesures, utilisez plusieurs tailles et distinguez temps total, nombre d’opérations et mémoire. Une courbe expérimentale ne remplace pas l’analyse asymptotique.","keypoints":["Répétition","Contrôle"],"example":"// tailles : 100, 200, 400, 800\n// répéter chaque mesure plusieurs fois"}]};
Object.entries(V18_COMPLEMENTS).forEach(([id,sections])=>{

    sections.forEach(section=>{if(!existants.has(section.title))chapitre.sections.push(section)});
  }
});
