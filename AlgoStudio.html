<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1b26">
<title>AlgoStudio v13.15 — Aperçu couleurs et compteurs par cellule (patché)</title>
<style>
:root{
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono","Cascadia Code","Fira Code",Consolas,monospace;
  --bg:#1a1b26;--bg-2:#1f2335;--bg-3:#24283b;--bg-4:#2a2f45;
  --border:#2f3549;--border-2:#3b4261;
  --text:#c0caf5;--text-dim:#565f89;
  --accent:#7aa2f7;--accent-2:#bb9af7;
  --success:#9ece6a;--error:#f7768e;--warning:#e0af68;--info:#7dcfff;
  --tk-keyword:#bb9af7;--tk-type:#7dcfff;--tk-string:#9ece6a;
  --tk-number:#ff9e64;--tk-comment:#565f89;--tk-op:#89ddff;--tk-ident:#c0caf5;
  --tk-const:#e0af68;
  --sel:rgba(122,162,247,0.35);
  --match:rgba(224,175,104,0.45);
  --indent:#232842;
  --fold-bg:rgba(122,162,247,0.06);
  --shadow:0 4px 12px rgba(0,0,0,0.3);
  --editor-line-height:21px;
  --editor-pad-top:12px;
  --editor-pad-left:14px;
  --editor-font-size:13.5px;
  --tab-size:2;
}
[data-theme="light"]{
  --bg:#f8f9fc;--bg-2:#fff;--bg-3:#eef1f7;--bg-4:#e2e7f0;
  --border:#dde1eb;--border-2:#c9cfdd;
  --text:#24283b;--text-dim:#8b90a8;
  --accent:#3b6ef5;--accent-2:#8b5cf6;
  --success:#16a34a;--error:#dc2626;--warning:#d97706;--info:#0891b2;
  --tk-keyword:#7c3aed;--tk-type:#0891b2;--tk-string:#16a34a;
  --tk-number:#ea580c;--tk-comment:#94a3b8;--tk-op:#0ea5e9;--tk-ident:#1e293b;
  --tk-const:#d97706;
  --sel:rgba(59,110,245,0.25);
  --match:rgba(217,119,6,0.35);
  --indent:#d5dae5;
  --fold-bg:rgba(59,110,245,0.05);
  --shadow:0 4px 12px rgba(0,0,0,0.08);
}
*,*::before,*::after{box-sizing:border-box}
html,html.pseudo-fullscreen,html.pseudo-fullscreen body{width:100%;height:100%;overflow:hidden}
.pseudo-fullscreen #app{position:fixed;inset:0;z-index:99999}
body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:1fr auto;grid-template-rows:48px 1fr 26px;grid-template-areas:"toolbar toolbar" "main main" "status status";height:100vh;height:100dvh}
.toolbar{grid-area:toolbar}.main{grid-area:main;min-height:0;min-width:0;display:grid;overflow:hidden}.statusbar{grid-area:status}
.mobile-tabs{display:none}
.toolbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--border);min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;margin-right:6px}
.brand .logo{color:var(--accent);font-family:var(--font-mono);font-weight:700}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:500;background:var(--bg-3);border:1px solid var(--border);white-space:nowrap}
.status-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--text-dim)}
.status-pill.ready::before{background:var(--text-dim)}
.status-pill.ready{color:var(--text-dim)}
.status-pill.running::before{background:var(--accent);animation:pulse 1s infinite}
.status-pill.running{color:var(--accent);border-color:var(--accent)}
.status-pill.paused::before{background:var(--warning)}
.status-pill.paused{color:var(--warning);border-color:var(--warning)}
.status-pill.stopped::before{background:var(--text-dim)}
.status-pill.stopped{color:var(--text-dim)}
.status-pill.error::before{background:var(--error)}
.status-pill.error{color:var(--error);border-color:var(--error)}
.status-pill.finished::before{background:var(--success)}
.status-pill.finished{color:var(--success);border-color:var(--success)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.save-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;background:var(--bg-3);border:1px solid var(--border);white-space:nowrap;color:var(--text-dim);transition:all .2s}
.save-pill.saved{color:var(--success);border-color:var(--success)}
.save-pill.saving{color:var(--info);border-color:var(--info)}
.save-pill.dirty{color:var(--warning);border-color:var(--warning)}
.save-pill::before{content:'●';font-size:8px}
.toolbar-actions{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.toolbar-actions::-webkit-scrollbar{display:none}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:transparent;border:1px solid transparent;border-radius:7px;font-size:15px;transition:background .12s,border-color .12s;flex-shrink:0}
.btn-icon:hover{background:var(--bg-3);border-color:var(--border)}
.btn-icon.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-icon:disabled{opacity:.35;cursor:not-allowed}
.btn-icon:disabled:hover{background:transparent;border-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[role="dialog"]{outline:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;background:var(--accent);color:#fff;border:0;border-radius:7px;font-weight:500;font-size:13px;white-space:nowrap;flex-shrink:0}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-sm{height:26px;padding:0 10px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:12px}
.btn-sm:hover{background:var(--border)}
.btn-sm.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px;flex-shrink:0}
.panel-editor{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.editor-wrap{display:flex;flex:1;min-height:0;overflow:hidden;position:relative;font-family:var(--font-mono);font-size:var(--editor-font-size);line-height:var(--editor-line-height)}
.gutter{flex:0 0 68px;background:var(--bg);border-right:1px solid var(--border);z-index:4;overflow:hidden;position:relative;padding-top:var(--editor-pad-top)}
.gutter-line{display:flex;align-items:flex-start;height:var(--editor-line-height);line-height:var(--editor-line-height);padding-right:6px;font-variant-numeric:tabular-nums;white-space:pre}
.bp-slot{flex:0 0 16px;text-align:center;color:var(--error);cursor:pointer;user-select:none;font-size:11px}
.bp-slot:hover{background:var(--bg-3)}
.bp-slot.has-bp::before{content:'●';color:var(--error);font-size:12px;line-height:var(--editor-line-height)}
.fold-slot{flex:0 0 14px;text-align:center;color:var(--text-dim);cursor:pointer;user-select:none;font-size:11px;line-height:var(--editor-line-height)}
.fold-slot:hover{color:var(--accent)}
.fold-slot.foldable::before{content:'▾'}
.fold-slot.folded::before{content:'▸'}
.line-num{flex:1;text-align:right;color:var(--text-dim);font-size:12.5px;line-height:var(--editor-line-height)}
.gutter-line.current-line .line-num{color:var(--accent);font-weight:600}
.gutter-lite{font:inherit;color:var(--text-dim);font-size:12.5px;min-height:100%;}
.editor-container{flex:1;position:relative;min-width:0;overflow:hidden}
.indent-guides{position:absolute;top:0;left:0;bottom:0;right:0;pointer-events:none;z-index:0;overflow:hidden}
.indent-guide{position:absolute;top:0;bottom:0;width:1px;background:var(--indent)}
.highlight-layer,#code{
  position:absolute;inset:0;padding:var(--editor-pad-top) var(--editor-pad-left);margin:0;border:0;
  font:inherit;line-height:var(--editor-line-height);letter-spacing:inherit;white-space:pre;
  overflow:auto;tab-size:var(--tab-size);overflow-wrap:normal;word-break:normal;
}
.highlight-layer{pointer-events:none;color:var(--tk-ident);z-index:1;overflow:hidden}
#code{z-index:2;background:transparent;color:transparent;caret-color:var(--text);resize:none;outline:none}
#code::selection{background:var(--sel)}
#code::-webkit-scrollbar,.highlight-layer::-webkit-scrollbar{width:10px;height:10px}
#code::-webkit-scrollbar-thumb,.highlight-layer::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.tk-keyword{color:var(--tk-keyword);font-weight:500}
.tk-type{color:var(--tk-type)}
.tk-string{color:var(--tk-string)}
.tk-number{color:var(--tk-number)}
.tk-const{color:var(--tk-const);font-weight:500}
.tk-comment{color:var(--tk-comment);font-style:italic}
.tk-op{color:var(--tk-op)}
.tk-ident{color:var(--tk-ident)}
.tk-error{text-decoration:underline wavy var(--error);text-decoration-skip-ink:none}
.tk-warn{text-decoration:underline wavy var(--warning);text-decoration-skip-ink:none}
.tk-bracket-match{background:var(--match);border-radius:2px;padding:0 1px;outline:1px solid var(--accent)}
.current-line-bg{position:absolute;left:0;right:0;background:rgba(122,162,247,0.08);pointer-events:none;z-index:0}
.next-line-bg{position:absolute;left:0;right:0;background:rgba(158,206,106,0.12);pointer-events:none;z-index:0;border-left:3px solid var(--success)}
.fold-overlay{position:absolute;left:0;right:0;background:var(--fold-bg);border-left:3px solid var(--accent);cursor:pointer;z-index:5;display:flex;align-items:center;padding-left:8px;color:var(--text-dim);font-size:11px;font-style:italic}
.fold-overlay:hover{background:rgba(122,162,247,0.12)}
.editor-wrap.large-editing .highlight-layer{display:none!important}
.editor-wrap.large-editing #code{color:var(--text)!important;caret-color:var(--text);background:transparent}
.editor-wrap.large-editing .indent-guides{display:none!important}
.editor-wrap.large-editing .fold-overlay{display:none!important}
.search-bar{display:none;align-items:center;gap:4px;padding:6px 10px;background:var(--bg-3);border-bottom:1px solid var(--border);flex-shrink:0}
.search-bar.open{display:flex}
.search-bar input{flex:1;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none;min-width:0}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .count{color:var(--text-dim);font-size:11px;min-width:60px;text-align:center}
.quick-panel{display:none;padding:6px 10px;background:var(--bg-3);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px;flex-shrink:0}
.quick-panel.open{display:flex}
.quick-panel button{padding:5px 9px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;font-family:var(--font-mono);font-size:11.5px;white-space:nowrap;transition:all .12s}
.quick-panel button:hover{background:var(--bg-4);border-color:var(--accent);color:var(--accent)}
.quick-panel .qp-group{display:inline-flex;gap:3px;padding:0 6px;border-right:1px solid var(--border)}
.quick-panel .qp-group:last-child{border-right:0}
.panel-side{display:flex;flex-direction:column;background:var(--bg-2);border-left:1px solid var(--border);min-width:0;min-height:0;position:relative;width:400px}
.side-resizer{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:10;background:transparent}
.side-resizer:hover{background:var(--accent);opacity:0.5}
.side-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg-2);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.side-tabs::-webkit-scrollbar{display:none}
.side-tab{flex:1;min-width:0;padding:10px 6px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text-dim);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.side-tab:hover{color:var(--text)}.side-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.side-tab.attention{animation:tab-flash .9s ease-in-out 2}
@keyframes tab-flash{0%,100%{background:transparent}50%{background:rgba(122,162,247,0.28)}}
.side-content{flex:1;position:relative;min-height:0;overflow:hidden}
.side-pane{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.side-pane.active{display:flex}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;background:var(--error);color:#fff;border-radius:9px;font-size:10.5px;font-weight:600;line-height:1}
.badge.zero{display:none}.badge.ok{background:var(--success)}
.console-toolbar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--bg-3);flex-wrap:wrap;flex-shrink:0}
.console-toolbar input{padding:3px 6px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;outline:none;min-width:0;flex:1}
.console-toolbar input:focus{border-color:var(--accent)}
.filter-btn{padding:3px 8px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font-size:11px;cursor:pointer}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn.warn.active{background:var(--warning);border-color:var(--warning)}
.filter-btn.err.active{background:var(--error);border-color:var(--error)}
.filter-btn.ok.active{background:var(--success);border-color:var(--success)}
.console{flex:1;padding:8px 12px;font-family:var(--font-mono);font-size:12px;line-height:1.55;overflow-y:auto;color:var(--text);display:flex;flex-direction:column;gap:1px}
.log-entry{display:flex;gap:8px;padding:2px 0;border-radius:3px;word-break:break-word}
.log-entry.hidden{display:none}
.log-time{color:var(--text-dim);flex-shrink:0;font-size:10.5px;padding-top:1px}
.log-badge{flex-shrink:0;font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;letter-spacing:0.5px;align-self:flex-start;margin-top:2px}
.log-text{flex:1;white-space:pre-wrap}
.log-out .log-text{color:var(--text)}
.log-out .log-badge{background:var(--bg-4);color:var(--text-dim)}
.log-err .log-text{color:var(--error)}
.log-err .log-badge{background:var(--error);color:#fff}
.log-warn .log-text{color:var(--warning)}
.log-warn .log-badge{background:var(--warning);color:#000}
.log-sys .log-text{color:var(--text-dim);font-style:italic}
.log-sys .log-badge{background:var(--bg-4);color:var(--text-dim)}
.log-in .log-text{color:var(--accent-2)}
.log-in .log-badge{background:var(--accent-2);color:#fff}
.log-ok .log-text{color:var(--success)}
.log-ok .log-badge{background:var(--success);color:#000}
.log-info .log-text{color:var(--info)}
.log-info .log-badge{background:var(--info);color:#000}
.console-input-row{display:inline-flex;align-items:center;gap:4px;background:var(--bg-3);border:1px solid var(--accent);border-radius:5px;padding:2px 8px;margin:4px 0;align-self:flex-start;animation:input-attn 1.1s ease-out}
.console-input-row.attention{box-shadow:0 0 0 3px rgba(122,162,247,.35)}
@keyframes input-attn{from{background:rgba(122,162,247,.25)}to{background:var(--bg-3)}}
.console-input-label{color:var(--accent-2);font-weight:500}
.console-input{background:transparent;border:0;outline:none;color:var(--text);font-family:var(--font-mono);font-size:12px;min-width:80px;width:140px;padding:2px 0}
.console-input::placeholder{color:var(--text-dim);font-style:italic}
.console-input-done{color:var(--success)}
.console-actions{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--border);background:var(--bg-2);flex-shrink:0;flex-wrap:wrap}
.console-actions .btn-sm{padding:0 8px;height:24px;font-size:11px}
.vars{flex:1;padding:8px;overflow-y:auto;font-family:var(--font-mono);font-size:12px}
.var-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 8px;border-bottom:1px solid var(--border);align-items:start;border-radius:4px}
.var-row:hover{background:var(--bg-3)}
.var-name{color:var(--accent);cursor:pointer;user-select:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.var-name-top{display:flex;align-items:center;gap:4px}
.var-name.watched{color:var(--warning)}
.var-name.array{color:var(--accent-2)}
.var-name.bool{color:var(--tk-type)}
.var-name.record{color:var(--success)}
.var-meta{color:var(--text-dim);font-size:10.5px;display:flex;gap:6px;flex-wrap:wrap}
.var-scope{color:var(--info)}
.var-dims{color:var(--accent-2)}
.var-val{color:var(--text);text-align:right;word-break:break-all;font-size:11.5px}
.vars-empty{color:var(--text-dim);text-align:center;padding:30px 10px;font-style:italic}
.vars-hint{color:var(--text-dim);font-size:11px;padding:6px 10px;border-bottom:1px solid var(--border);font-style:italic}
.var-table{border-collapse:collapse;font-family:var(--font-mono);font-size:11px;background:var(--bg-3);border:1px solid var(--border);border-radius:4px;margin:4px 0}
.var-table th,.var-table td{padding:2px 6px;border:1px solid var(--border);text-align:center;min-width:20px}
.var-table th{color:var(--accent);background:var(--bg-4);font-weight:500}
.var-table td.var-idx{color:var(--accent-2);background:var(--bg-4);font-weight:500}
.var-record{background:var(--bg-3);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:11px;text-align:left;display:inline-block;margin:2px 0}
.var-record-field{color:var(--text-dim);margin-right:4px}
.var-record-field b{color:var(--accent);font-weight:500}
.var-tools{display:inline-flex;gap:2px}
.var-tools button{background:transparent;border:0;color:var(--text-dim);cursor:pointer;font-size:11px;padding:1px 4px;border-radius:3px}
.var-tools button:hover{background:var(--bg-2);color:var(--accent)}
.watch{flex:1;padding:8px;overflow-y:auto;font-size:12px}
.watch-add{display:flex;gap:6px;margin-bottom:10px}
.watch-add input{flex:1;padding:6px 8px;background:var(--bg-3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none}
.watch-add input:focus{border-color:var(--accent)}
.watch-add button{padding:6px 12px;background:var(--accent);color:#fff;border:0;border-radius:6px;font-size:12px;font-weight:500}
.watch-empty{color:var(--text-dim);text-align:center;padding:24px 10px;font-style:italic;font-size:12px;line-height:1.7}
.watch-item{background:var(--bg-3);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden}
.watch-header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg-2);border-bottom:1px solid var(--border)}
.watch-name{color:var(--accent);font-family:var(--font-mono);font-size:12px;font-weight:500}
.watch-scope-badge{color:var(--text-dim);font-size:10px;margin-left:6px;padding:1px 5px;background:var(--bg-3);border-radius:3px}
.watch-remove{background:transparent;border:0;color:var(--text-dim);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:12px}
.watch-remove:hover{color:var(--error);background:var(--bg-3)}
.watch-current{padding:8px 10px;font-family:var(--font-mono);font-size:11.5px;color:var(--text);border-bottom:1px dashed var(--border);word-break:break-all}
.watch-error{color:var(--error);font-style:italic;font-size:11.5px}
.watch-log{max-height:220px;overflow-y:auto}
.watch-log-entry{display:flex;gap:8px;padding:4px 10px;font-family:var(--font-mono);font-size:11px;border-bottom:1px solid var(--border);cursor:pointer}
.watch-log-entry:hover{background:var(--bg-2)}
.watch-log-line{color:var(--text-dim);flex-shrink:0;min-width:42px}
.watch-log-scope{color:var(--info);flex-shrink:0;font-size:10px}
.watch-log-diff{color:var(--text);word-break:break-all;flex:1}
.watch-log-diff .arrow{color:var(--accent-2);margin:0 4px}
.watch-log-diff .old{color:var(--text-dim);text-decoration:line-through}
.watch-log-diff .new{color:var(--success);font-weight:500}
.watch-log-empty{padding:6px 10px;color:var(--text-dim);font-size:11px;font-style:italic}
.problems{flex:1;padding:8px;overflow-y:auto;font-size:12.5px}

const Ty={

function typeToString(t){
  if(!t)return '?';
  if(t.kind==='array'){
    const dims=t.dims.map(d=>{
      const f=d.from&&d.from.type==='Number'?d.from.value:'?';
      const to=d.to&&d.to.type==='Number'?d.to.value:'?';
      return `${f}..${to}`;
    }).join(', ');
    return `tableau[${dims}] de ${typeToString(t.elementType)}`;
  }
  if(t.kind==='record')return t.name;
  if(t.kind==='named')return t.name;
  return t.kind;
}
function isNumeric(t){return t&&(t.kind==='entier'||t.kind==='reel');}
function isStringy(t){return t&&(t.kind==='chaine'||t.kind==='caractere');}
function isAssignable(src,dst){
  if(!src||!dst)return false;
  if(src.kind===dst.kind){
    if(src.kind==='array'){if(src.dims.length!==dst.dims.length)return false;return isAssignable(src.elementType,dst.elementType);}
    if(src.kind==='record')return src.name===dst.name;
    return true;
  }
  if(src.kind==='entier'&&dst.kind==='reel')return true;
  if(src.kind==='caractere'&&dst.kind==='chaine')return true;
  return false;
}
function commonNumeric(a,b){return (a.kind==='reel'||b.kind==='reel')?Ty.reel():Ty.entier();}
function typeFromName(name){
  // v12.42 : signatures builtin utilisent 'numeric'/'stringy' comme
  // catégories ; on les mappe pour que conversionHint() parle.
  if(name==='numeric')return Ty.reel();

  if(!name||name==='any'||name==='inconnu')return Ty.inconnu();
  const map={entier:Ty.entier,reel:Ty.reel,booleen:Ty.booleen,chaine:Ty.chaine,caractere:Ty.caractere,vide:Ty.vide};
  return map[name]?map[name]():Ty.inconnu();
}

function conversionHint(src,dst,label){
  if(!src||!dst)return undefined;

  if(dst.kind==='chaine'){

      return `Un nombre ne s'affecte pas directement à une chaîne : écrivez ConvChaine(${n}). Pour l'affichage, « Ecrire("texte ", ${n}) » fonctionne aussi.`;

    if(src.kind==='caractere')return `Convertissez avec ConvChaine(${n}) pour obtenir une chaîne d'un caractère.`;
  }
  if(dst.kind==='entier'&&src.kind==='chaine')return `Convertissez avec ConvEntier(${n}).`;
  if(dst.kind==='reel'&&src.kind==='chaine')return `Convertissez avec ConvReel(${n}).`;
  if(dst.kind==='entier'&&src.kind==='reel')return `Utilisez Arrondi(${n}) ou Trunc(${n}) pour convertir un réel en entier.`;
  if(dst.kind==='reel'&&src.kind==='entier')return `Écrivez explicitement le réel, ou utilisez ConvReel(${n}).`;
  if(dst.kind==='caractere'&&src.kind==='chaine')return `Extrayez un caractère avec ${n}[1] ou ${n}[i].`;
  if(src.kind==='array'&&dst.kind!=='array')return `Accédez à un élément : ${n}[indice].`;
  if(src.kind==='record'&&dst.kind!=='record')return `Accédez à un champ : ${n}.champ.`;
  return undefined;
}

/* ============ LEXER ============ */
function lex(src){
  const tokens=[],errors=[];
  let i=0,line=1,col=1;
  const len=src.length;
  const advance=()=>{const c=src[i++];if(c==='\n'){line++;col=1;}else col++;return c;};
  const addTok=(type,value,start,end,l,c)=>tokens.push({type,value,start,end,line:l,col:c});
  while(i<len){
    const startLine=line,startCol=col,start=i,c=src[i];
    if(c===' '||c==='\t'||c==='\n'||c==='\r'){advance();continue;}
    if(c==='/'&&src[i+1]==='/'){while(i<len&&src[i]!=='\n')advance();addTok('comment',src.slice(start,i),start,i,startLine,startCol);continue;}
    if(c==='/'&&src[i+1]==='*'){advance();advance();while(i<len&&!(src[i]==='*'&&src[i+1]==='/'))advance();if(i<len){advance();advance();}addTok('comment',src.slice(start,i),start,i,startLine,startCol);continue;}
    if(c==="'"){
      advance();let ch='';
      if(i<len&&src[i]!=='\\'&&src[i]!=="'"&&src[i]!=='\n')ch+=advance();
      else if(src[i]==='\\'&&i+1<len){advance();ch+=advance();}
      if(i>=len||src[i]!=="'")errors.push({line:startLine,col:startCol,severity:'error',code:'E001',message:"Littéral caractère non fermé."});
      else advance();
      if(ch.length>1)errors.push({line:startLine,col:startCol,severity:'error',code:'E001b',message:"Un caractère ne contient qu'un seul symbole."});
      addTok('char',ch,start,i,startLine,startCol);
      continue;
    }
    if(c==='"'){
      advance();let str='';
      while(i<len&&src[i]!=='"'&&src[i]!=='\n'){
        if(src[i]==='\\'&&i+1<len){advance();str+=advance();}else str+=advance();
      }
      if(i>=len||src[i]!=='"')errors.push({line:startLine,col:startCol,severity:'error',code:'E001',message:'Chaîne non terminée.'});
      else advance();
      addTok('string',str,start,i,startLine,startCol);
      continue;
    }
    if(/[0-9]/.test(c)){
      while(i<len&&/[0-9]/.test(src[i]))advance();
      let isReal=false;
      if(src[i]==='.'&&/[0-9]/.test(src[i+1])){isReal=true;advance();while(i<len&&/[0-9]/.test(src[i]))advance();}
      const text=src.slice(start,i);
      const value=isReal?parseFloat(text):parseInt(text,10);
      addTok('number',{value,isReal},start,i,startLine,startCol);
      continue;
    }
    if(/[a-zA-Z_\u00C0-\u017F]/.test(c)){
      while(i<len&&/[a-zA-Z0-9_\u00C0-\u017F]/.test(src[i]))advance();
      let text=src.slice(start,i);
      if(normalizeKw(text)==='jusqu'&&(src[i]==="'"||src[i]==='\u2019')){
        advance();
        if(src[i]==='a'||src[i]==='A')advance();
        text='jusqua';
      }
      const norm=normalizeKw(text);
      if(KEYWORDS.has(norm)||TYPES.has(norm))addTok('keyword',norm,start,i,startLine,startCol);
      else addTok('identifier',text,start,i,startLine,startCol);
      continue;
    }
    if(c==='<'&&src[i+1]==='-'){advance();advance();addTok('op','<-',start,i,startLine,startCol);continue;}
    if(c==='<'&&src[i+1]==='>'){advance();advance();addTok('op','<>',start,i,startLine,startCol);continue;}
    if(c==='<'&&src[i+1]==='='){advance();advance();addTok('op','<=',start,i,startLine,startCol);continue;}
    if(c==='>'&&src[i+1]==='='){advance();advance();addTok('op','>=',start,i,startLine,startCol);continue;}
    if(c==='.'&&src[i+1]==='.'){advance();advance();addTok('op','..',start,i,startLine,startCol);continue;}
    if('+-*/=<>(),;:[]'.includes(c)||c==='.'){advance();addTok('op',c,start,i,startLine,startCol);continue;}
    errors.push({line:startLine,col:startCol,severity:'error',code:'E002',message:`Caractère inattendu : « ${c} ».`});
    advance();
  }
  tokens.push({type:'eof',value:null,start:len,end:len,line,col});
  return {tokens,errors};
}

/* ============ PARSER ============ */
class Parser{
  constructor(tokens,lexErrors){this.tokens=tokens;this.pos=0;this.errors=lexErrors?lexErrors.slice():[];}
  peek(o=0){return this.tokens[this.pos+o]||this.tokens[this.tokens.length-1];}
  at(type,value){const t=this.peek();return t.type===type&&(value===undefined||t.value===value);}
  atKw(...kws){const t=this.peek();return t.type==='keyword'&&kws.includes(t.value);}
  atWord(word){const t=this.peek();return (t.type==='keyword'||t.type==='identifier')&&normalizeKw(String(t.value))===normalizeKw(word);}
  next(){return this.tokens[this.pos++];}
  error(msg,code,suggestion){const t=this.peek();this.errors.push({line:t.line,col:t.col,severity:'error',code:code||'E100',message:msg,suggestion});}
  expect(type,value,msg){if(this.at(type,value))return this.next();this.error(msg||`Attendu : « ${value||type} »`);return{type,value,line:this.peek().line,col:this.peek().col};}
  skipSemicolons(){while(this.at('op',';'))this.next();}
  parseProgram(){
    let name='Algorithme';
    if(this.atKw('algorithme')){this.next();if(this.at('identifier'))name=this.next().value;}
    const imports=[];
    while(this.atKw('importer')){
      this.next();
      const t=this.peek();
      if(t.type==='string'){this.next();imports.push(String(t.value));this.skipSemicolons();}
      else if(t.type==='identifier'){
        let name=String(this.next().value);
        if(this.at('op','.')){this.next();const part=this.expect('identifier',undefined,'Nom du module attendu après « . ».');name+='.'+String(part.value||'');}
        imports.push(name);this.skipSemicolons();
      }else this.error('Nom de module attendu après « Importer ».','E070');
    }
    const types=[],vars=[],constants=[],functions=[];
    while(this.atKw('type')){
      this.next();
      const tid=this.expect('identifier',undefined,'Nom de type attendu');
      const tn=tid.value||'T';
      this.expect('op','=','« = » attendu');
      if(this.atKw('enregistrement')){
        this.next();
        const fields=[];
        while(!this.atKw('finenregistrement')&&!this.at('eof')){
          const fNames=[];
          while(this.at('identifier')){const f=this.next();fNames.push(f.value);if(this.at('op',','))this.next();else break;}
          this.expect('op',':','« : » attendu');
          const ft=this.parseType();
          for(const n of fNames)fields.push({name:n,typeInfo:ft});
          this.skipSemicolons();
        }
        if(this.atKw('finenregistrement'))this.next();else this.error('« FinEnregistrement » attendu','E060');
        types.push({name:tn,kind:'record',fields,line:tid.line});
      } else {
        const t=this.parseType();
        types.push({name:tn,kind:'alias',target:t,line:tid.line});
      }
      this.skipSemicolons();
    }
    if(this.atKw('variables')||this.atKw('constante')){
      if(this.atKw('variables')){this.next();this.skipSemicolons();}
      while(!this.atKw('debut','fonction','procedure','constante')&&!this.at('eof')&&this.at('identifier')){
        const names=[];
        while(this.at('identifier')){const id=this.next();names.push({name:id.value,line:id.line,col:id.col});if(this.at('op',','))this.next();else break;}
        if(this.at('op',':'))this.next();else{this.error('« : » attendu');break;}
        const typeInfo=this.parseType();
        for(const n of names)vars.push({name:n.name,typeInfo,line:n.line,col:n.col});
        this.skipSemicolons();
      }
      while(this.atKw('constante')){
        this.next();
        const cid=this.expect('identifier',undefined,'Nom de constante attendu');
        this.expect('op','=','« = » attendu');
        const cval=this.parseExpr();
        this.skipSemicolons();
        constants.push({name:cid.value,line:cid.line,value:cval});
      }
    }
    while(this.atKw('fonction','procedure')){
      const isFonction=this.atKw('fonction');
      this.next();
      const idTok=this.expect('identifier',undefined,isFonction?'Nom de fonction attendu':'Nom de procédure attendu');
      const fnName=idTok.value||'fn';
      this.expect('op','(','« ( » attendu');
      const params=[];
      if(!this.at('op',')')){
        do{
          let byRef=false;
          if(this.atKw('var')){this.next();byRef=true;}
          const names=[];
          names.push(this.expect('identifier',undefined,'Nom de paramètre attendu'));
          while(this.at('op',',')){
            this.next();
            if(this.at('identifier'))names.push(this.next());
            else{this.error('Nom de paramètre attendu après « , »');break;}
          }
          this.expect('op',':','« : » attendu');
          const ptype=this.parseType();
          for(const pid of names)params.push({name:pid.value||'p',typeInfo:ptype,line:pid.line,byRef});
        }while(this.at('op',',')&&(this.next(),true));
      }
      this.expect('op',')','« ) » attendu');
      let returnType=null;
      if(isFonction&&this.at('op',':')){this.next();returnType=this.parseType();}
      const fvars=[];
      if(this.atKw('variables')||this.atKw('constante')){
        if(this.atKw('variables')){this.next();this.skipSemicolons();}
        while(!this.atKw('debut')&&!this.at('eof')&&this.at('identifier')){
          const names=[];
          while(this.at('identifier')){const id=this.next();names.push({name:id.value,line:id.line});if(this.at('op',','))this.next();else break;}
          if(this.at('op',':'))this.next();else{this.error('« : » attendu');break;}
          const typeInfo=this.parseType();
          for(const n of names)fvars.push({name:n.name,typeInfo,line:n.line});
          this.skipSemicolons();
        }
      }
      let body=[];
      if(this.atKw('debut')){this.next();body=this.parseBlock(['finfonction','finprocedure']);}
      else this.error('« Debut » attendu');
      if(isFonction){if(this.atKw('finfonction'))this.next();else this.error('« FinFonction » attendu','E017');}
      else{if(this.atKw('finprocedure'))this.next();else this.error('« FinProcedure » attendu','E017');}
      functions.push({type:isFonction?'Function':'Procedure',name:fnName,params,returnType,vars:fvars,body,line:idTok.line||1});
    }
    let body=[];
    if(this.atKw('debut')){
      this.next();body=this.parseBlock(['fin']);
      if(this.atKw('fin'))this.next();else this.error('« Fin » attendu','E010');
    } else body=this.parseBlock([]);
    while(this.at('op',';'))this.next();
    if(!this.at('eof')){const t=this.peek();this.error(`Token inattendu après la fin : « ${t.value??t.type} »`,'E099');}
    return{type:'Program',name,imports,types,vars,constants,functions,body,line:1};
  }
  parseType(){
    if(this.atKw('tableau','matrice')){
      const collectionKind=this.next().value;
      this.expect('op','[','« [ » attendu');
      const dims=[];
      const parseDim=()=>{
        const from=this.parseExpr();
        this.expect('op','..','« .. » attendu');
        const to=this.parseExpr();
        return{from,to};
      };
      dims.push(parseDim());
      while(this.at('op',',')){this.next();dims.push(parseDim());}
      this.expect('op',']','« ] » attendu');
      if(collectionKind==='matrice'&&dims.length!==2)this.error('Une matrice exige exactement deux dimensions.','E011M');
      this.expect('keyword','de','« de » attendu');
      const elemType=this.parseType();
      return{kind:'array',dims,elementType:elemType};
    }
    const t=this.peek();
    if(t.type==='keyword'&&TYPES.has(t.value)){this.next();return{kind:t.value};}
    if(t.type==='identifier'){this.next();return{kind:'named',name:t.value};}
    this.error('Type attendu','E011');return{kind:'entier'};
  }
  parseBlock(endKws){
    const stmts=[];
    while(!this.at('eof')&&!this.atKw(...endKws)){
      const before=this.pos;
      const s=this.parseStatement();
      if(s)stmts.push(s);
      if(this.pos===before){this.error(`Instruction invalide : « ${this.peek().value??this.peek().type} »`,'E102');this.next();}
    }
    return stmts;
  }
  parseStatement(){
    const t=this.peek();
    if(t.type==='identifier')return this.parseAssignmentOrExpr();
    if(this.atKw('si'))return this.parseIf();
    if(this.atKw('pour'))return this.parseFor();
    if(this.atKw('tantque'))return this.parseWhile();
    if(this.atKw('repeter'))return this.parseRepeat();
    if(this.atKw('selon'))return this.parseSwitch();
    if(this.atKw('ecrire'))return this.parseWrite();
    if(this.atKw('lire'))return this.parseRead();
    if(this.atKw('retourner'))return this.parseReturn();
    if(this.atKw('interrompre')){const kw=this.next();this.skipSemicolons();return{type:'Break',line:kw.line};}
    if(this.atKw('continuer')){const kw=this.next();this.skipSemicolons();return{type:'Continue',line:kw.line};}
    if(this.atKw('quitter')){const kw=this.next();this.skipSemicolons();return{type:'Quit',line:kw.line};}
    this.error(`Instruction inattendue : « ${t.value??t.type} »`,'E103');this.next();return null;
  }
  parseAssignmentOrExpr(){
    const startLine=this.peek().line,startCol=this.peek().col;
    const id=this.next();
    let target={type:'Identifier',name:id.value,line:id.line,col:id.col};
    while(true){
      if(this.at('op','[')){
        this.next();
        const indices=[this.parseExpr()];
        while(this.at('op',',')){this.next();indices.push(this.parseExpr());}
        this.expect('op',']','« ] » attendu');
        target={type:'Index',target,indices,line:startLine,col:startCol};
      } else if(this.at('op','.')){
        this.next();
        const fid=this.expect('identifier',undefined,'Nom de champ attendu après « . »');
        target={type:'Member',target,field:fid.value,line:startLine,col:startCol};
      } else break;
    }
    if(this.at('op','<-')){
      this.next();
      const value=this.parseExpr();
      this.skipSemicolons();
      return{type:'Assign',target,value,line:startLine};
    }
    if(this.at('op','(')&&target.type==='Identifier'){
      const args=this.parseArgs();
      this.skipSemicolons();
      return{type:'ExprStmt',expr:{type:'Call',name:target.name,args,line:startLine},line:startLine};
    }
    this.error("« <- » attendu pour l'affectation",'E104');
    this.skipSemicolons();
    return null;
  }
  parseIf(){
    const kw=this.next();const branches=[];
    const parseBranch=(cond,line)=>{if(this.atKw('alors'))this.next();else this.error('« Alors » attendu','E012');const body=this.parseBlock(['sinon','sinonsi','finsi']);branches.push({cond,body,line});};
    let cond=this.parseExpr();parseBranch(cond,kw.line);
    while(this.atKw('sinonsi') || (this.atKw('sinon') && this.peek(1).type==='keyword' && this.peek(1).value==='si' && this.peek(1).line===this.peek().line)){
      if(this.atKw('sinonsi'))this.next();else{this.next();this.next();}
      cond=this.parseExpr();parseBranch(cond,kw.line);
    }
    let elseBranch=[];if(this.atKw('sinon')){this.next();elseBranch=this.parseBlock(['finsi']);}
    if(this.atKw('finsi'))this.next();else this.error('« FinSi » attendu','E013');
    return{type:'If',branches,else:elseBranch,line:kw.line};
  }
  parseFor(){
    const kw=this.next();
    const idTok=this.expect('identifier',undefined,'Nom de variable attendu après « Pour »');
    const varName=idTok.value||'i';
    if(this.atKw('de'))this.next();else this.error('« De » attendu','E014');
    const from=this.parseExpr();
    if(this.atWord('a'))this.next();else this.error('« A » attendu','E015');
    const to=this.parseExpr();
    let step=null;
    if(this.atKw('pas')){this.next();step=this.parseExpr();}
    if(this.atKw('faire'))this.next();else this.error('« Faire » attendu','E016');
    const body=this.parseBlock(['finpour']);
    if(this.atKw('finpour'))this.next();else this.error('« FinPour » attendu','E017');
    return{type:'For',var:varName,from,to,step,body,line:kw.line};
  }
  parseWhile(){
    const kw=this.next();
    const cond=this.parseExpr();
    if(this.atKw('faire'))this.next();else this.error('« Faire » attendu','E018');
    const body=this.parseBlock(['fintantque']);
    if(this.atKw('fintantque'))this.next();else this.error('« FinTantQue » attendu','E019');
    return{type:'While',cond,body,line:kw.line};
  }
  parseRepeat(){
    const kw=this.next();
    const body=this.parseBlock(['jusqua']);
    if(this.atKw('jusqua'))this.next();else this.error("« Jusqu'a » attendu",'E020');
    const cond=this.parseExpr();
    this.skipSemicolons();
    return{type:'Repeat',body,cond,line:kw.line};
  }
  parseSwitch(){
    const kw=this.next();
    const expr=this.parseExpr();
    const cases=[];let def=null;
    while(this.atKw('cas')){
      this.next();
      const values=[this.parseExpr()];
      while(this.at('op',',')){this.next();values.push(this.parseExpr());}
      if(this.at('op',':'))this.next();else this.error('« : » attendu','E021');
      const body=this.parseBlock(['cas','defaut','finselon']);
      cases.push({values,body});
    }
    if(this.atKw('defaut')){this.next();if(this.at('op',':'))this.next();def=this.parseBlock(['finselon']);}
    if(this.atKw('finselon'))this.next();else this.error('« FinSelon » attendu','E022');
    return{type:'Switch',expr,cases,default:def,line:kw.line};
  }
  parseWrite(){
    const kw=this.next();
    let args=[];
    if(this.at('op','('))args=this.parseArgs();
    else if(!this.at('op',';')&&!this.atKw('fin','finfonction','finprocedure')&&!this.at('eof')){
      args.push(this.parseExpr());
      while(this.at('op',',')){this.next();args.push(this.parseExpr());}
    }
    this.skipSemicolons();
    return{type:'Write',args,line:kw.line};
  }
  parseRead(){
    const kw=this.next();
    let target=null;
    if(this.at('op','(')){
      this.next();
      if(this.at('identifier')){
        const id=this.next();
        target={type:'Identifier',name:id.value,line:id.line,col:id.col};
        while(true){
          if(this.at('op','[')){
            this.next();
            const indices=[this.parseExpr()];
            while(this.at('op',',')){this.next();indices.push(this.parseExpr());}
            this.expect('op',']','« ] » attendu');
            target={type:'Index',target,indices,line:kw.line};
          } else if(this.at('op','.')){
            this.next();
            const fid=this.expect('identifier',undefined,'Nom de champ attendu');
            target={type:'Member',target,field:fid.value,line:kw.line};
          } else break;
        }
      } else this.error('Nom de variable attendu dans « Lire(...) »','E023');
      this.expect('op',')','« ) » attendu');
    } else if(this.at('identifier')){
      const id=this.next();
      target={type:'Identifier',name:id.value,line:id.line,col:id.col};
    } else{this.error('Variable attendue après « Lire »','E024');target={type:'Identifier',name:'_',line:kw.line};}
    this.skipSemicolons();
    return{type:'Read',target,line:kw.line};
  }
  parseReturn(){
    const kw=this.next();
    let value=null;
    if(!this.at('op',';')&&!this.atKw('fin','finfonction','finprocedure')&&!this.at('eof'))value=this.parseExpr();
    this.skipSemicolons();
    return{type:'Return',value,line:kw.line};
  }
  parseArgs(){
    const args=[];
    this.expect('op','(');
    if(!this.at('op',')')){
      args.push(this.parseExpr());
      while(this.at('op',',')){this.next();args.push(this.parseExpr());}
    }
    this.expect('op',')','« ) » attendu');
    return args;
  }
  parseExpr(){return this.parseOr();}
  parseOr(){let l=this.parseAnd();while(this.atKw('ou')){const op=this.next();const r=this.parseAnd();l={type:'Binary',op:'ou',left:l,right:r,line:op.line};}return l;}
  parseAnd(){let l=this.parseNot();while(this.atKw('et')){const op=this.next();const r=this.parseNot();l={type:'Binary',op:'et',left:l,right:r,line:op.line};}return l;}
  parseNot(){if(this.atKw('non')){const op=this.next();const operand=this.parseNot();return{type:'Unary',op:'non',operand,line:op.line};}return this.parseComparison();}
  parseComparison(){let l=this.parseAdd();const t=this.peek();if(t.type==='op'&&['=','<>','<','>','<=','>='].includes(t.value)){this.next();const r=this.parseAdd();l={type:'Binary',op:t.value,left:l,right:r,line:t.line};}return l;}
  parseAdd(){let l=this.parseMul();while(this.at('op','+')||this.at('op','-')){const op=this.next();const r=this.parseMul();l={type:'Binary',op:op.value,left:l,right:r,line:op.line};}return l;}
  parseMul(){let l=this.parseUnary();while(this.at('op','*')||this.at('op','/')||this.atKw('div')||this.atKw('mod')){const op=this.next();const r=this.parseUnary();l={type:'Binary',op:op.value,left:l,right:r,line:op.line};}return l;}
  parseUnary(){if(this.at('op','-')){const op=this.next();const operand=this.parseUnary();return{type:'Unary',op:'-',operand,line:op.line};}return this.parsePostfix();}
  parsePostfix(){
    let expr=this.parsePrimary();
    while(true){
      if(this.at('op','(')&&expr.type==='Identifier'){const args=this.parseArgs();expr={type:'Call',name:expr.name,args,line:expr.line};}
      else if(this.at('op','[')){this.next();const indices=[this.parseExpr()];while(this.at('op',',')){this.next();indices.push(this.parseExpr());}this.expect('op',']','« ] » attendu');expr={type:'Index',target:expr,indices,line:expr.line};}
      else if(this.at('op','.')){this.next();const fid=this.expect('identifier',undefined,'Champ attendu');expr={type:'Member',target:expr,field:fid.value,line:expr.line};}
      else break;
    }
    return expr;
  }
  parsePrimary(){
    const t=this.peek();
    if(t.type==='number'){this.next();return{type:'Number',value:t.value.value,isReal:t.value.isReal,line:t.line};}
    if(t.type==='string'){this.next();return{type:'String',value:t.value,line:t.line};}
    if(t.type==='char'){this.next();return{type:'Char',value:t.value,line:t.line};}
    if(t.type==='identifier'){this.next();return{type:'Identifier',name:t.value,line:t.line,col:t.col};}
    if(t.type==='keyword'&&(t.value==='vrai'||t.value==='faux')){this.next();return{type:'Bool',value:t.value==='vrai',line:t.line};}
    if(this.at('op','(')){this.next();const e=this.parseExpr();this.expect('op',')','« ) » attendu');return e;}
    this.error(`Expression attendue, rencontré : « ${t.value??t.type} »`,'E105');
    this.next();
    return{type:'Number',value:0,line:t.line};
  }
}

/* ============ SCOPE ============ */
class Scope{
  constructor(parent=null,name='global'){this.parent=parent;this.name=name;this.vars=new Map();}
  declare(name,type,line,extra={}){
    const key=name.toLowerCase();
    if(this.vars.has(key))return{ok:false,existing:this.vars.get(key)};
    const info={name,type,line,...extra};this.vars.set(key,info);return{ok:true,info};
  }
  lookup(name){
    const key=name.toLowerCase();
    if(this.vars.has(key))return this.vars.get(key);
    return this.parent?this.parent.lookup(name):null;
  }
  local(name){return this.vars.get(name.toLowerCase())||null;}
}
function resolveType(t,typeMap){
  if(!t)return Ty.inconnu();
  if(t.kind==='named'){
    const def=typeMap.get(t.name.toLowerCase());
    if(!def)return Ty.inconnu();
    if(def.kind==='record')return {kind:'record',name:def.name,def};
    if(def.kind==='alias')return resolveType(def.target,typeMap);
  }
  if(t.kind==='array')return {kind:'array',dims:t.dims,elementType:resolveType(t.elementType,typeMap)};
  return t;
}

/* ============ TYPE CHECKER ============ */
function typeCheck(ast){
  const diagnostics=[];
  const globalScope=new Scope(null,'global');
  const functions=new Map();
  const typeMap=new Map();
  const constants=new Map();
  for(const t of ast.types||[])typeMap.set(t.name.toLowerCase(),t);
  for(const c of ast.constants||[]){
    const key=c.name.toLowerCase();
    if(constants.has(key))diagnostics.push({line:c.line,col:1,severity:'error',code:'E303',message:`Constante « ${c.name} » déjà déclarée.`});
    else constants.set(key,c);
  }
  for(const v of ast.vars){
    const resolved=resolveType(v.typeInfo,typeMap);
    if(resolved.kind==='inconnu'&&v.typeInfo.kind==='named')
      diagnostics.push({line:v.line,col:1,severity:'error',code:'E360',message:`Type « ${v.typeInfo.name} » inconnu.`});
    const r=globalScope.declare(v.name,resolved,v.line,{initialized:false,varKind:'global'});
    if(!r.ok)diagnostics.push({line:v.line,col:1,severity:'error',code:'E300',message:`Variable « ${v.name} » déjà déclarée (ligne ${r.existing.line}).`});
  }
  for(const fn of ast.functions){
    const key=fn.name.toLowerCase();
    if(functions.has(key)){diagnostics.push({line:fn.line,col:1,severity:'error',code:'E301',message:`« ${fn.name} » déjà défini.`});continue;}
    functions.set(key,fn);
  }
  for(const fn of ast.functions){
    const scope=new Scope(globalScope,fn.name);
    const paramNames=new Set();
    for(const p of fn.params){
      const k=p.name.toLowerCase();
      if(paramNames.has(k))diagnostics.push({line:p.line,col:1,severity:'error',code:'E302',message:`Paramètre « ${p.name} » dupliqué.`});
      paramNames.add(k);
      scope.declare(p.name,resolveType(p.typeInfo,typeMap),p.line,{initialized:true,byRef:p.byRef,varKind:'param'});
    }
    for(const v of fn.vars){
      const r=scope.declare(v.name,resolveType(v.typeInfo,typeMap),v.line,{initialized:false,varKind:'local'});
      if(!r.ok)diagnostics.push({line:v.line,col:1,severity:'error',code:'E300',message:`Variable « ${v.name} » déjà déclarée.`});
    }
    const retT=fn.returnType?resolveType(fn.returnType,typeMap):null;
    checkBlock(fn.body,scope,retT,diagnostics,functions,fn,typeMap,constants);
  }
  const mainScope=new Scope(globalScope,'main');
  for(const v of ast.vars)mainScope.declare(v.name,resolveType(v.typeInfo,typeMap),v.line,{initialized:false,varKind:'global'});
  checkBlock(ast.body,mainScope,null,diagnostics,functions,null,typeMap,constants);
  detectMistakes(ast,diagnostics);
  return diagnostics;

  function typeOfExpr(e,scope,diags,funcs,currentFn,tm,consts){
    if(!e)return Ty.inconnu();
    switch(e.type){
      case 'Number':return e.isReal?Ty.reel():Ty.entier();
      case 'String':return Ty.chaine();
      case 'Char':return Ty.caractere();
      case 'Bool':return Ty.booleen();
      case 'Identifier':{
        const c=consts.get(e.name.toLowerCase());
        if(c){
          if(c.value.type==='Number')return c.value.isReal?Ty.reel():Ty.entier();
          if(c.value.type==='String')return Ty.chaine();
          if(c.value.type==='Bool')return Ty.booleen();
        }
        const info=scope.lookup(e.name);
        if(!info){
          if(funcs.has(e.name.toLowerCase()))return Ty.inconnu();
          diags.push({line:e.line,col:e.col||1,severity:'error',code:'E200',message:`Variable « ${e.name} » non déclarée.`,scopeInfo:{kind:currentFn?'local':'global',owner:currentFn?.name||null,typeHint:null,name:e.name}});
          return Ty.inconnu();
        }
        return info.type;
      }
      case 'Index':{
        const containerT=typeOfExpr(e.target,scope,diags,funcs,currentFn,tm,consts);
        if(containerT.kind==='chaine'||containerT.kind==='caractere'){
          if(e.indices.length!==1)diags.push({line:e.line,col:1,severity:'error',code:'E370',message:`Une chaîne s'indexe avec 1 indice.`});
          e.indices.forEach(idx=>{
            const t=typeOfExpr(idx,scope,diags,funcs,currentFn,tm,consts);
            if(t.kind!=='entier'&&t.kind!=='inconnu')diags.push({line:idx.line,col:1,severity:'error',code:'E312',message:`Indice de chaîne : entier attendu.`});
          });
          return Ty.caractere();
        }
        if(containerT.kind!=='array'){
          diags.push({line:e.line,col:1,severity:'error',code:'E310',message:`« ${exprText(e.target)} » n'est pas un tableau ni une chaîne.`,suggestion:'Vérifiez que la variable est déclarée comme tableau/matrice et qu’elle n’a pas été remplacée par une valeur scalaire.'});
          e.indices.forEach(idx=>typeOfExpr(idx,scope,diags,funcs,currentFn,tm,consts));
          return Ty.inconnu();
        }
        if(e.indices.length!==containerT.dims.length)
          diags.push({line:e.line,col:1,severity:'error',code:'E311',message:`« ${e.target.name} » attend ${containerT.dims.length} indice(s), ${e.indices.length} fourni(s).`});
        e.indices.forEach((idx,i)=>{
          const t=typeOfExpr(idx,scope,diags,funcs,currentFn,tm,consts);
          if(t.kind!=='inconnu'&&t.kind!=='entier')diags.push({line:idx.line,col:1,severity:'error',code:'E312',message:`Indice ${i+1} : entier attendu.`});
        });
        return containerT.elementType;
      }
      case 'Member':{
        const targetT=typeOfExpr(e.target,scope,diags,funcs,currentFn,tm,consts);
        if(targetT.kind!=='record'){
          diags.push({line:e.line,col:1,severity:'error',code:'E371',message:`« .${e.field} » : la cible n'est pas un enregistrement.`});
          return Ty.inconnu();
        }
        const def=tm.get(targetT.name.toLowerCase())||targetT.def;
        if(!def||def.kind!=='record')return Ty.inconnu();
        const field=def.fields.find(f=>f.name.toLowerCase()===e.field.toLowerCase());
        if(!field){diags.push({line:e.line,col:1,severity:'error',code:'E372',message:`Champ « ${e.field} » inconnu dans « ${def.name} ».`});return Ty.inconnu();}
        return resolveType(field.typeInfo,tm);
      }
      case 'Call':{
        const key=e.name.toLowerCase();const fn=funcs.get(key);
        if(fn){
          if(e.args.length!==fn.params.length)diags.push({line:e.line,col:1,severity:'error',code:'E313',message:`« ${fn.name} » attend ${fn.params.length} argument(s), ${e.args.length} fourni(s).`});
          e.args.forEach((a,i)=>{const at=typeOfExpr(a,scope,diags,funcs,currentFn,tm,consts);if(i<fn.params.length){const param=fn.params[i],pt=resolveType(param.typeInfo,tm);if(param.byRef&&!isLValueExpr(a))diags.push({line:a.line,col:1,severity:'error',code:'E316',message:`Argument ${i+1} de « ${fn.name} » : paramètre « ${param.name} » (Var) requiert une variable.`});if(!isAssignable(at,pt)&&at.kind!=='inconnu')diags.push({line:a.line,col:1,severity:'error',code:'E314',message:`Argument ${i+1} de « ${fn.name} » : type ${typeToString(at)}, attendu ${typeToString(pt)}.`,suggestion:conversionHint(at,pt,a.name||('argument '+(i+1)))});}});
          return fn.returnType?resolveType(fn.returnType,tm):Ty.vide();
        }
        const sig=BUILTIN_SIGS[key];if(!sig){diags.push({line:e.line,col:1,severity:'error',code:'E315',message:`Fonction « ${e.name} » inconnue.`});e.args.forEach(a=>typeOfExpr(a,scope,diags,funcs,currentFn,tm,consts));return Ty.inconnu();}
        const argTypes=e.args.map(a=>typeOfExpr(a,scope,diags,funcs,currentFn,tm,consts));
        if(!sig.variadic&&argTypes.length!==sig.params.length)diags.push({line:e.line,col:1,severity:'error',code:'E304',message:`« ${e.name} » attend ${sig.params.length} argument(s), ${argTypes.length} fourni(s).`});
        sig.params.forEach((expected,i)=>{if(i>=argTypes.length)return;const at=argTypes[i];if(expected==='any')return;const ok=(expected==='numeric'&&isNumeric(at))||(expected==='stringy'&&isStringy(at))||(expected===at.kind);if(!ok&&at.kind!=='inconnu')diags.push({line:e.args[i].line,col:1,severity:'error',code:'E305',message:`Argument ${i+1} de « ${e.name} » : ${typeToString(at)} reçu, ${expected} attendu.`,suggestion:conversionHint(at,typeFromName(expected),'argument')});});
        return inferBuiltinReturnType(key,argTypes,sig);
      }
      case 'Binary':{
        const lt=typeOfExpr(e.left,scope,diags,funcs,currentFn,tm,consts);
        const rt=typeOfExpr(e.right,scope,diags,funcs,currentFn,tm,consts);
        if(lt.kind==='inconnu'||rt.kind==='inconnu')return Ty.inconnu();
        if(e.op==='et'||e.op==='ou'){
          if(lt.kind!=='booleen'||rt.kind!=='booleen')diags.push({line:e.line,col:1,severity:'error',code:'E320',message:`« ${e.op} » attend deux booléens.`});
          return Ty.booleen();
        }
        if(['=','<>','<','>','<=','>='].includes(e.op)){
          if(isNumeric(lt)&&isNumeric(rt))return Ty.booleen();
          if(isStringy(lt)&&isStringy(rt))return Ty.booleen();
          if(lt.kind===rt.kind)return Ty.booleen();
          let sug;
          if((isStringy(lt)&&isNumeric(rt))||(isNumeric(lt)&&isStringy(rt)))
            sug=`Convertissez explicitement : ConvChaine(x) ou ConvEntier(x) / ConvReel(x).`;
          else sug=conversionHint(lt,rt,'x');
          diags.push({line:e.line,col:1,severity:'error',code:'E321',message:`Comparaison impossible entre ${typeToString(lt)} et ${typeToString(rt)}.`,suggestion:sug});
          return Ty.booleen();
        }
        if(e.op==='+'){
          if(isStringy(lt)||isStringy(rt)){
            const okL=isStringy(lt)||isNumeric(lt)||lt.kind==='booleen';
            const okR=isStringy(rt)||isNumeric(rt)||rt.kind==='booleen';
            if(!okL||!okR)diags.push({line:e.line,col:1,severity:'error',code:'E322',message:`« + » entre types incompatibles.`,suggestion:conversionHint(rt,lt,'x')});
            return Ty.chaine();
          }
          if(!isNumeric(lt)||!isNumeric(rt)){diags.push({line:e.line,col:1,severity:'error',code:'E323',message:`« + » attend deux nombres ou chaînes.`});return Ty.inconnu();}
          return commonNumeric(lt,rt);
        }
        if(['-','*','/'].includes(e.op)){
          if(!isNumeric(lt)||!isNumeric(rt)){diags.push({line:e.line,col:1,severity:'error',code:'E324',message:`« ${e.op} » attend deux nombres.`,suggestion:conversionHint(lt,Ty.reel(),'x')});return Ty.inconnu();}
          if(e.op==='/')return Ty.reel();
          return commonNumeric(lt,rt);
        }
        if(['div','mod'].includes(e.op)){
          if(lt.kind!=='entier'||rt.kind!=='entier')diags.push({line:e.line,col:1,severity:'error',code:'E325',message:`« ${e.op} » attend deux entiers.`,suggestion:`Convertissez avec Trunc(x) ou ConvEntier(s).`});
          return Ty.entier();
        }
        return Ty.inconnu();
      }
      case 'Unary':{
        const t=typeOfExpr(e.operand,scope,diags,funcs,currentFn,tm,consts);
        if(e.op==='non')return Ty.booleen();
        if(e.op==='-')return t.kind==='entier'?Ty.entier():Ty.reel();
        return t;
      }
    }
    return Ty.inconnu();
  }
  function checkAssign(target,valueType,scope,diags,funcs,currentFn,tm){
    if(target.type==='Identifier'){
      const info=scope.lookup(target.name);
      if(!info){
        diags.push({line:target.line,col:target.col||1,severity:'error',code:'E200',message:`Variable « ${target.name} » non déclarée.`,scopeInfo:{kind:currentFn?'local':'global',owner:currentFn?.name||null,typeHint:null,name:target.name}});
        return;
      }
      if(info.varKind==='local'||info.varKind==='global')info.initialized=true;
      if(!isAssignable(valueType,info.type)&&valueType.kind!=='inconnu')
        diags.push({line:target.line,col:1,severity:'error',code:'E330',
          message:`Impossible d'affecter ${typeToString(valueType)} à « ${target.name} » (${typeToString(info.type)}).`,
          suggestion:conversionHint(valueType,info.type,target.name)});
      return;
    }
    if(target.type==='Index'){
      const containerT=typeOfExpr(target.target,scope,diags,funcs,currentFn,tm,new Map());
      const targetT=(containerT.kind==='chaine')?Ty.caractere():(containerT.kind==='array'?containerT.elementType:Ty.inconnu());
      if(!isAssignable(valueType,targetT)&&valueType.kind!=='inconnu'&&targetT.kind!=='inconnu')
        diags.push({line:target.line,col:1,severity:'error',code:'E330',
          message:`Impossible d'affecter ${typeToString(valueType)} dans un élément de ${typeToString(targetT)}.`,
          suggestion:conversionHint(valueType,targetT,'élément')});
      return;
    }
    if(target.type==='Member'){
      const t=typeOfExpr(target,scope,diags,funcs,currentFn,tm,new Map());
      if(!isAssignable(valueType,t)&&valueType.kind!=='inconnu'&&t.kind!=='inconnu')
        diags.push({line:target.line,col:1,severity:'error',code:'E330',
          message:`Impossible d'affecter ${typeToString(valueType)} au champ « ${target.field} ».`,
          suggestion:conversionHint(valueType,t,'champ')});
    }
  }
  function checkBlock(stmts,scope,returnType,diags,funcs,currentFn,tm,consts){
    for(const s of stmts||[]){
      if(!s)continue;
      switch(s.type){
        case 'Assign':{const vt=typeOfExpr(s.value,scope,diags,funcs,currentFn,tm,consts);checkAssign(s.target,vt,scope,diags,funcs,currentFn,tm);break;}
        case 'If':{
          for(const br of (s.branches||[])){const ct=typeOfExpr(br.cond,scope,diags,funcs,currentFn,tm,consts);if(ct.kind!=='booleen'&&ct.kind!=='inconnu')diags.push({line:br.line,col:1,severity:'error',code:'E331',message:`Condition « Si » doit être booléenne.`});checkBlock(br.body,scope,returnType,diags,funcs,currentFn,tm,consts);}checkBlock(s.else,scope,returnType,diags,funcs,currentFn,tm,consts);break;
        }
        case 'While':{
          const ct=typeOfExpr(s.cond,scope,diags,funcs,currentFn,tm,consts);
          if(ct.kind!=='booleen'&&ct.kind!=='inconnu')diags.push({line:s.line,col:1,severity:'error',code:'E332',message:`Condition « TantQue » doit être booléenne.`});
          if(s.cond.type==='Bool'&&s.cond.value===true)diags.push({line:s.line,col:1,severity:'warning',code:'W300',message:`Boucle « TantQue vrai » : risque de boucle infinie.`,suggestion:`Assurez-vous qu'une instruction modifie la condition.`});
          checkBlock(s.body,scope,returnType,diags,funcs,currentFn,tm,consts);
          break;
        }
        case 'Repeat':{
          checkBlock(s.body,scope,returnType,diags,funcs,currentFn,tm,consts);
          const ct=typeOfExpr(s.cond,scope,diags,funcs,currentFn,tm,consts);
          if(ct.kind!=='booleen'&&ct.kind!=='inconnu')diags.push({line:s.line,col:1,severity:'error',code:'E333',message:`Condition « Jusqu'a » doit être booléenne.`});
          break;
        }
        case 'For':{
          const ft=typeOfExpr(s.from,scope,diags,funcs,currentFn,tm,consts);
          const tt=typeOfExpr(s.to,scope,diags,funcs,currentFn,tm,consts);
          if(!isNumeric(ft)||!isNumeric(tt))diags.push({line:s.line,col:1,severity:'error',code:'E334',message:`Boucle « Pour » : bornes numériques attendues.`});
          if(s.step){const st=typeOfExpr(s.step,scope,diags,funcs,currentFn,tm,consts);if(!isNumeric(st))diags.push({line:s.line,col:1,severity:'error',code:'E334b',message:`Pas numérique attendu.`});}
          const varInfo=scope.lookup(s.var);
          let loopScope=scope;
          if(!varInfo){
            diags.push({line:s.line,col:1,severity:'error',code:'E200',message:`Variable de boucle « ${s.var} » non déclarée.`,suggestion:`Déclarez « ${s.var} : entier » dans la section Variables ${currentFn?`de « ${currentFn.name} »`:'globale'} avant son utilisation.`,scopeInfo:{kind:currentFn?'local':'global',owner:currentFn?.name||null,typeHint:'entier',name:s.var,loopVariable:true}});
            loopScope=new Scope(scope,`${scope.name}:pour:${s.var}`);
            loopScope.declare(s.var,Ty.entier(),s.line,{initialized:true,varKind:'loop'});
          } else {
            varInfo.initialized=true;
          }
          if(s.from.type==='Number'&&s.to.type==='Number'&&!s.step){
            if(s.from.value>s.to.value)diags.push({line:s.line,col:1,severity:'warning',code:'W301',message:`Boucle « Pour » de ${s.from.value} à ${s.to.value} : la borne initiale dépasse la borne finale.`,suggestion:`Inverser les bornes ou ajouter « Pas -1 ».`});
          }
          checkBlock(s.body,loopScope,returnType,diags,funcs,currentFn,tm,consts);
          break;
        }
        case 'Switch':{
          typeOfExpr(s.expr,scope,diags,funcs,currentFn,tm,consts);
          for(const c of s.cases){c.values.forEach(v=>typeOfExpr(v,scope,diags,funcs,currentFn,tm,consts));checkBlock(c.body,scope,returnType,diags,funcs,currentFn,tm,consts);}
          if(s.default)checkBlock(s.default,scope,returnType,diags,funcs,currentFn,tm,consts);
          break;
        }
        case 'Write':{s.args.forEach(a=>typeOfExpr(a,scope,diags,funcs,currentFn,tm,consts));break;}
        case 'Read':{
          if(s.target.type==='Identifier'){
            const info=scope.lookup(s.target.name);
            if(!info)diags.push({line:s.line,col:1,severity:'error',code:'E200',message:`Variable « ${s.target.name} » non déclarée.`,scopeInfo:{kind:currentFn?'local':'global',owner:currentFn?.name||null,typeHint:null,name:s.target.name,readTarget:true}});
            else if(info.varKind==='local'||info.varKind==='global')info.initialized=true;
          }
          else typeOfExpr(s.target,scope,diags,funcs,currentFn,tm,consts);
          break;
        }
        case 'Return':{
          if(!currentFn){diags.push({line:s.line,col:1,severity:'error',code:'E340',message:`« Retourner » en dehors d'une fonction.`});break;}
          if(currentFn.type==='Procedure'){diags.push({line:s.line,col:1,severity:'error',code:'E341',message:`Une procédure ne retourne pas de valeur.`});break;}
          if(!s.value){diags.push({line:s.line,col:1,severity:'error',code:'E342',message:`« Retourner » doit renvoyer une valeur.`});break;}
          const rt=typeOfExpr(s.value,scope,diags,funcs,currentFn,tm,consts);
          if(returnType&&!isAssignable(rt,returnType)&&rt.kind!=='inconnu')
            diags.push({line:s.line,col:1,severity:'error',code:'E343',
              message:`Type de retour incorrect : ${typeToString(rt)}, attendu ${typeToString(returnType)}.`,
              suggestion:conversionHint(rt,returnType,'valeur')});
          break;
        }
        case 'ExprStmt':typeOfExpr(s.expr,scope,diags,funcs,currentFn,tm,consts);break;
        case 'Break':case 'Continue':case 'Quit':break;
      }
    }
  }
}

/* ============ DÉTECTION D'ERREURS CLASSIQUES ============ */
function detectMistakes(ast,diagnostics){
  for(const fn of ast.functions){
    if(fn.type==='Function'&&fn.returnType){
      const info=analyzeReturnPaths(fn.body);
      if(!info.hasReturn){
        diagnostics.push({line:fn.line,col:1,severity:'warning',code:'W400',
          message:`Fonction « ${fn.name} » déclarée comme retournant un type, mais aucun « Retourner » trouvé.`,
          suggestion:`Ajoutez au moins un « Retourner valeur ».`});
      } else if(!info.allPathsReturn){
        diagnostics.push({line:fn.line,col:1,severity:'warning',code:'W401',
          message:`Fonction « ${fn.name} » : certains chemins ne retournent pas de valeur.`,
          suggestion:`Assurez-vous que chaque branche (Si/Sinon) contient un « Retourner ».`});
      }
    }
  }
  walkDeadCode(ast.body);
  for(const fn of ast.functions)walkDeadCode(fn.body);
  function walkDeadCode(stmts){
    if(!stmts)return;
    for(let i=0;i<stmts.length;i++){
      const s=stmts[i];
      if(!s)continue;
      if(i<stmts.length-1&&(s.type==='Return'||s.type==='Break'||s.type==='Continue'||s.type==='Quit')){
        const dead=stmts[i+1];
        diagnostics.push({line:dead.line,col:1,severity:'warning',code:'W402',
          message:`Code inatteignable après « ${s.type==='Return'?'Retourner':s.type==='Break'?'Interrompre':s.type==='Continue'?'Continuer':'Quitter'} ».`,
          suggestion:`Supprimez l'instruction suivante ou restructurez le contrôle de flux.`});
      }
      if(s.type==='If'){for(const br of (s.branches||[]))walkDeadCode(br.body);walkDeadCode(s.else);}
      if(s.type==='While'||s.type==='Repeat'||s.type==='For')walkDeadCode(s.body);
      if(s.type==='Switch'){for(const c of s.cases)walkDeadCode(c.body);if(s.default)walkDeadCode(s.default);}
    }
  }
  const used=new Set();
  function scanExpr(e){
    if(!e)return;
    if(e.type==='Identifier')used.add(e.name.toLowerCase());
    if(e.left)scanExpr(e.left);if(e.right)scanExpr(e.right);
    if(e.operand)scanExpr(e.operand);
    if(e.target)scanTarget(e.target);
    if(e.args)e.args.forEach(scanExpr);
    if(e.indices)e.indices.forEach(scanExpr);
  }
  function scanTarget(t){
    if(!t)return;
    if(t.type==='Identifier')used.add(t.name.toLowerCase());
    else if(t.type==='Index'){scanTarget(t.target);(t.indices||[]).forEach(scanExpr);}
    else if(t.type==='Member')scanTarget(t.target);
  }
  function scanUsage(stmts){
    if(!stmts)return;
    for(const s of stmts){
      if(!s)continue;
      scanExpr(s.cond);scanExpr(s.expr);scanExpr(s.value);
      if(s.target)scanTarget(s.target);
      if(s.args)s.args.forEach(scanExpr);
      if(s.type==='For'){used.add(s.var.toLowerCase());scanExpr(s.from);scanExpr(s.to);if(s.step)scanExpr(s.step);}
      if(s.type==='If'){for(const br of (s.branches||[])){scanExpr(br.cond);scanUsage(br.body);}scanUsage(s.else);}
      if(s.type==='While'||s.type==='Repeat'||s.type==='For')scanUsage(s.body);
      if(s.type==='Switch'){for(const c of s.cases){c.values.forEach(scanExpr);scanUsage(c.body);}if(s.default)scanUsage(s.default);}
      if(s.type==='Write')s.args.forEach(scanExpr);
    }
  }
  scanUsage(ast.body);
  for(const fn of ast.functions){scanUsage(fn.body);for(const p of fn.params)used.add(p.name.toLowerCase());}
  for(const v of ast.vars){
    if(!used.has(v.name.toLowerCase())){
      diagnostics.push({line:v.line,col:1,severity:'warning',code:'W500',
        message:`Variable « ${v.name} » déclarée mais jamais utilisée.`,
        suggestion:`Supprimez-la ou vérifiez que vous avez bien saisi son nom ailleurs.`});
    }
  }
  const constNames=new Set((ast.constants||[]).map(c=>c.name.toLowerCase()));
  function scanConstWrites(stmts){
    if(!stmts)return;

      case 'supprimer':{const s=String(args[0]??''),p=Number(args[1]??1)-1,l=Number(args[2]??0);return s.slice(0,p)+s.slice(p+l);}
      case 'inserer':{const s1=String(args[0]??''),s2=String(args[1]??''),p=Number(args[2]??1)-1;return s1.slice(0,p)+s2+s1.slice(p);}
      case 'remplacer':return String(args[0]??'').split(String(args[1]??'')).join(String(args[2]??''));
      case 'repeter':return String(args[0]??'').repeat(Math.max(0,Number(args[1])||0));
      case 'copier':{const s=String(args[0]??''),p=Number(args[1]??1)-1,l=Number(args[2]??0);return s.substr(p,l);}
      case 'compare':{const a=String(args[0]??''),b=String(args[1]??'');return a<b?-1:a>b?1:0;}
      case 'estlettre':return /^[a-zA-Z\u00C0-\u017F]$/.test(String(args[0]??''));
      case 'estchiffre':return /^[0-9]$/.test(String(args[0]??''));
      case 'estmajuscule':{const c=String(args[0]??'');return /^[A-Z\u00C0-\u017F]$/.test(c)&&c.toUpperCase()===c;}
      case 'estminuscule':{const c=String(args[0]??'');return /^[a-z]$/.test(c)&&c.toLowerCase()===c;}
      case 'taille':{const a=args[0];if(a instanceof AlgoArray)return a.size();if(typeof a==='string')return a.length;throw new Error('Taille attend un tableau ou une chaîne.');}
      case 'somme':return this._sumArray(args[0],'Somme');
      case 'moyenne':{const s=this._sumArray(args[0],'Moyenne');const nn=this._arrayCount(args[0]);return nn?s/nn:0;}
      case 'maxtab':return this._aggregateArray(args[0],Math.max,'MaxTab');
      case 'mintab':return this._aggregateArray(args[0],Math.min,'MinTab');
      case 'rechercher':return this._searchArray(args[0],args[1]);
      case 'ajouter':throw new Error('Ajouter : utilisez t[n+1] <- x.');
      case 'retirer':{const t=args[0],i=Number(args[1]);if(!(t instanceof AlgoArray))throw new Error('Retirer attend un tableau.');t.set([i],0);return;}
      case 'echanger':{const t=args[0],i=Number(args[1]),j=Number(args[2]);if(!(t instanceof AlgoArray))throw new Error('Echanger attend un tableau.');if(t.dims.length!==1)throw new Error('Echanger : tableau 1D uniquement.');const a=t.get([i]),b=t.get([j]);t.set([i],b);t.set([j],a);return;}
    }
    throw new Error(`Fonction inconnue : ${name}`);
  }
  // Patch 9 : Somme refuse silencieusement les types non numériques.
  _sumArray(arr,op){
    if(!(arr instanceof AlgoArray))throw new Error(`${op} attend un tableau.`);
    let s=0;
    for(const v of arr.iterValues()){
      if(typeof v==='string')throw new Error(`${op} : tableau de chaînes non supporté. Utilisez Concatener ou une boucle explicite.`);
      if(typeof v==='boolean')throw new Error(`${op} : tableau de booléens non supporté. Comptez les VRAI par boucle explicite.`);
      if(v instanceof AlgoArray||v instanceof AlgoRecord)throw new Error(`${op} : élément structuré non supporté.`);
      s+=Number(v)||0;
    }
    return s;
  }
  _arrayCount(arr){if(!(arr instanceof AlgoArray))return 0;return arr.size();}
  _aggregateArray(arr,fn,op){
    if(!(arr instanceof AlgoArray))throw new Error(`${op} attend un tableau.`);
    let first=true,r=0;
    for(const v of arr.iterValues()){if(typeof v==='string')throw new Error(`${op} : tableau de chaînes non supporté.`);const x=Number(v)||0;if(first){r=x;first=false;}else r=fn(r,x);}
    return r;
  }
  // Patch 9 : Rechercher refuse silencieusement un tableau multidimensionnel.
  _searchArray(arr,target){
    if(!(arr instanceof AlgoArray))return -1;
    if(arr.dims.length!==1)throw new Error('Rechercher : tableau 1D uniquement. Utilisez une double boucle Pour pour les matrices.');
    for(let i=arr.dims[0].from;i<=arr.dims[0].to;i++)if(arr.data[i]===target)return i;
    return -1;
  }
}

/* ============ FOLD ============ */
function computeFoldRanges(src){
  const lines=src.split('\n'),ranges=[],stack=[];
  const isCloser=n=>['finsi','finpour','fintantque','finselon','finfonction','finprocedure','finenregistrement','jusqua','fin'].includes(n);
  const closerToOpen={finsi:'si',finpour:'pour',fintantque:'tantque',finselon:'selon',finfonction:'fonction',finprocedure:'procedure',finenregistrement:'enregistrement',jusqua:'repeter',fin:'debut'};
  const lineInfo=(raw)=>{
    const t=raw.trim(),n=normalizeKw((t.match(/^[A-Za-zÀ-ÿ]+/)||[''])[0]);
    return {t,n};
  };
  for(let i=0;i<lines.length;i++){
    const {t,n}=lineInfo(lines[i]); if(!t||t.startsWith('//'))continue;
    if(isCloser(n)){
      const want=closerToOpen[n];
      for(let k=stack.length-1;k>=0;k--){
        if(stack[k].kw===want){const op=stack[k];stack.splice(k,1);if(i>op.line)ranges.push({openLine:op.line,closeLine:i,level:k});break;}
      }
      continue;
    }
    if(/^\s*(?:sinon|sinonsi|cas|defaut)\b/i.test(lines[i])) continue;
    let opener=null;
    if(/^\s*fonction\b/i.test(lines[i])) opener='fonction';
    else if(/^\s*procedure\b/i.test(lines[i])) opener='procedure';
    else if(/^\s*si\b[\s\S]*\balors\s*$/i.test(lines[i])) opener='si';
    else if(/^\s*pour\b[\s\S]*\bfaire\s*$/i.test(lines[i])) opener='pour';
    else if(/^\s*tantque\b[\s\S]*\bfaire\s*$/i.test(lines[i])) opener='tantque';
    else if(/^\s*repeter\s*$/i.test(lines[i])) opener='repeter';
    else if(/^\s*selon\b/i.test(lines[i])) opener='selon';
    else if(/^\s*type\b[\s\S]*\benregistrement\s*$/i.test(lines[i])) opener='enregistrement';
    else if(/^\s*debut\s*$/i.test(lines[i])) opener='debut';
    if(opener) stack.push({kw:opener,line:i});
  }
  return ranges.sort((a,b)=>a.openLine-b.openLine);
}

/* ============ HIGHLIGHT ============ */
function findMatchingBrackets(text,pos){
  const openers='([{';
  const closers=')]}';
  const pairs={'(':')','[':']','{':'}'};
  for(const p of [pos-1,pos]){
    if(p<0||p>=text.length)continue;
    const c=text[p];
    if(openers.includes(c)){
      let depth=1,i=p+1;
      while(i<text.length&&depth>0){
        if(text[i]===c)depth++;
        else if(text[i]===pairs[c])depth--;
        if(depth===0)return [[p,p+1],[i,i+1]];
        i++;
      }
    } else if(closers.includes(c)){
      const open=Object.keys(pairs).find(k=>pairs[k]===c);
      let depth=1,i=p-1;
      while(i>=0&&depth>0){
        if(text[i]===c)depth++;
        else if(text[i]===open)depth--;
        if(depth===0)return [[i,i+1],[p,p+1]];
        i--;
      }
    }
  }
  return [];
}
function highlight(src,diagnostics=[],matches=[],constants=new Set()){
  const {tokens}=lex(src);
  let out='',pos=0;
  const matchStart=new Set();
  for(const [a,b] of matches)matchStart.add(a);
  for(const t of tokens){
    if(t.type==='eof')break;
    if(t.start>pos)out+=escapeHtml(src.slice(pos,t.start));
    const text=escapeHtml(src.slice(t.start,t.end));
    let cls='';
    switch(t.type){
      case 'keyword':
        if(TYPES.has(t.value))cls='tk-type';
        else if(LOGIC_KW.has(t.value))cls='tk-op';
        else if(t.value==='tableau'||t.value==='matrice')cls='tk-type';
        else cls='tk-keyword';
        break;
      case 'identifier':
        if(constants.has(t.value.toLowerCase()))cls='tk-const';
        else cls='tk-ident';
        break;
      case 'number':cls='tk-number';break;
      case 'string':cls='tk-string';break;
      case 'char':cls='tk-string';break;
      case 'op':cls='tk-op';break;
      case 'comment':cls='tk-comment';break;
    }
    let diagCls='';
    for(const d of diagnostics){
      if(d.line===t.line&&(d.col||1)>=t.col&&(d.col||1)<=t.col+(t.end-t.start)){
        diagCls=d.severity==='warning'?' tk-warn':' tk-error';break;
      }
    }
    let matchCls=settings.showBracketMatch&&matchStart.has(t.start)?' tk-bracket-match':'';
    out+=cls?`<span class="${cls}${diagCls}${matchCls}">${text}</span>`:text;
    pos=t.end;
  }
  if(pos<src.length)out+=escapeHtml(src.slice(pos));
  return out+'\n';
}

const editHist={undo:[],redo:[],lastSaved:null,maxSize:200,timer:null,applying:false};
function snapshotEditor(){return{content:els.code.value,selStart:els.code.selectionStart,selEnd:els.code.selectionEnd};}
function initEditorHistory(){editHist.undo=[];editHist.redo=[];editHist.lastSaved=snapshotEditor();updateUndoRedoUI();}
function updateUndoRedoUI(){
  if(els.undoBtn)els.undoBtn.disabled=editHist.undo.length===0;
  if(els.redoBtn)els.redoBtn.disabled=editHist.redo.length===0;
}
function commitEditorSnapshot(){
  if(editHist.timer){clearTimeout(editHist.timer);editHist.timer=null;}
  if(editHist.applying)return;
  const cur=snapshotEditor();
  if(editHist.lastSaved&&editHist.lastSaved.content===cur.content){editHist.lastSaved=cur;return;}
  if(editHist.lastSaved){editHist.undo.push(editHist.lastSaved);if(editHist.undo.length>editHist.maxSize)editHist.undo.shift();}
  editHist.redo=[];editHist.lastSaved=cur;updateUndoRedoUI();
}
function scheduleEditorSnapshot(){
  if(editHist.applying)return;
  if(editHist.timer)clearTimeout(editHist.timer);
  editHist.timer=setTimeout(()=>{
    commitEditorSnapshot();
    if(isLargeEditor())while(editHist.undo.length>10)editHist.undo.shift();
    updateUndoRedoUI();
  },isLargeEditor()?2500:400);
}
function applyEditorSnapshot(s){
  editHist.applying=true;
  els.code.value=s.content;
  const len=s.content.length;
  els.code.selectionStart=Math.min(s.selStart,len);
  els.code.selectionEnd=Math.min(s.selEnd,len);
  editHist.lastSaved=snapshotEditor();
  refreshEditor();scheduleParse();markDirty();
  setTimeout(()=>{editHist.applying=false;},10);
}
function undoEditor(){
  commitEditorSnapshot();
  if(!editHist.undo.length){toast('Rien à annuler');return;}
  const prev=editHist.undo.pop();
  if(editHist.lastSaved)editHist.redo.push(editHist.lastSaved);
  applyEditorSnapshot(prev);updateUndoRedoUI();toast('↶ Annulé');
}
function redoEditor(){
  if(!editHist.redo.length){toast('Rien à rétablir');return;}
  const next=editHist.redo.pop();
  if(editHist.lastSaved)editHist.undo.push(editHist.lastSaved);
  applyEditorSnapshot(next);updateUndoRedoUI();toast('↷ Rétabli');
}

const IDB_NAME='AlgoStudioV9DB',IDB_STORE='workspace';
function idbOpen(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB indisponible'));const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function idbSave(k,v){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();}catch{}}
async function idbGet(k){return new Promise((resolve)=>{try{const dbReq=indexedDB.open(IDB_NAME,1);dbReq.onupgradeneeded=()=>{if(!dbReq.result.objectStoreNames.contains(IDB_STORE))dbReq.result.createObjectStore(IDB_STORE);};dbReq.onsuccess=()=>{const db=dbReq.result;try{const tx=db.transaction(IDB_STORE,'readonly');const req=tx.objectStore(IDB_STORE).get(k);req.onsuccess=()=>{const v=req.result;db.close();resolve(v===undefined?null:v)};req.onerror=()=>{db.close();resolve(null)}}catch{try{db.close()}catch{}resolve(null)}};dbReq.onerror=()=>resolve(null);}catch{resolve(null)}});}
async function idbDelete(k){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();}catch{}}
