function renderFileTabs(){if(!els.fileTabs)return;let html='';for(const f of projectState.files){html+=`<button class="file-tab${f.id===projectState.activeId?' active':''}${f.id===projectState.activeId&&state.saveState==='dirty'?' dirty':''}" data-file-id="${escapeHtml(f.id)}"><span class="tab-dot"></span>${escapeHtml(f.name)}${projectState.files.length>1?`<span class="close" data-close-file="${escapeHtml(f.id)}">×</span>`:''}</button>`;}html+='<button class="file-tab plus" data-action="project-add-file" title="Nouveau fichier">＋</button>';els.fileTabs.innerHTML=html;}
function loadProject(){try{const raw=localStorage.getItem(PROJECT_KEY);const p=raw?JSON.parse(raw):projectDefault();projectState.files=Array.isArray(p.files)&&p.files.length?p.files:projectDefault().files;projectState.activeId=p.activeId||projectState.files[0].id;}catch{const p=projectDefault();projectState.files=p.files;projectState.activeId=p.activeId;}const f=activeFile();if(f)setEditorContent(f.code,true);renderFileTabs();}
function switchFile(id){const old=activeFile();if(old)old.code=els.code.value;const f=projectState.files.find(x=>x.id===id);if(!f)return;projectState.activeId=id;setEditorContent(f.code,true);if(f.code.length>=LARGE_EDITOR_THRESHOLD)setStartupDeferredState('');else parseCode();initEditorHistory();renderFileTabs();saveProject();els.code.focus();}
function addProjectFile(){let n=1;while(projectState.files.some(f=>f.name===`module${n}.algo`))n++;const id='f_'+Date.now().toString(36);projectState.files.push({id,name:`module${n}.algo`,code:`Algorithme Module${n}\nVariables\n\nDebut\n  \nFin\n`});projectState.activeId=id;const f=activeFile();setEditorContent(f.code,true);parseCode();initEditorHistory();renderFileTabs();saveProject();markDirty();}
function renameProjectFile(id){const f=projectState.files.find(x=>x.id===id);if(!f)return;const n=prompt('Nouveau nom :',f.name);if(n&&n.trim()){f.name=n.trim().endsWith('.algo')?n.trim():n.trim()+'.algo';renderFileTabs();saveProject();}}
function closeProjectFile(id){if(projectState.files.length<=1){toast('Le projet doit conserver au moins un fichier.','err');return;}const idx=projectState.files.findIndex(f=>f.id===id);if(idx<0)return;projectState.files.splice(idx,1);if(projectState.activeId===id)projectState.activeId=projectState.files[Math.max(0,idx-1)].id;const f=activeFile();setEditorContent(f.code,true);if(f.code.length>=LARGE_EDITOR_THRESHOLD)setStartupDeferredState('');else parseCode();initEditorHistory();renderFileTabs();saveProject();}
function exportProject(){saveProject();const blob=new Blob([JSON.stringify(projectState,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='algostudio-project.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);toast('Projet exporté.','ok');}
function importProject(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(String(r.result));if(!Array.isArray(p.files)||!p.files.length)throw new Error('Structure invalide');projectState.files=p.files.map((x,i)=>({id:String(x.id||('f'+i)),name:String(x.name||('file'+i+'.algo')),code:String(x.code||'')}));projectState.activeId=String(p.activeId||projectState.files[0].id);saveProject();loadProject();if(els.code.value.length>=LARGE_EDITOR_THRESHOLD)setStartupDeferredState('');else analyzeCurrentProgram();toast('Projet importé.','ok');}catch(e){toast('Import projet : '+e.message,'err')}};r.readAsText(f)};input.click()}
function showProject(){saveProject();let html='';for(const f of projectState.files)html+=`<div class="version-item" data-project-file="${escapeHtml(f.id)}"><div><b>${escapeHtml(f.name)}</b><small>${f.code.length} caractères</small></div><small><button class="btn-sm" data-rename-file="${escapeHtml(f.id)}">Renommer</button> <button class="btn-sm" data-delete-file="${escapeHtml(f.id)}">Supprimer</button></small></div>`;openModal('🗂 Projet / espace de travail',`<p class="lib-hint">Projet local multi-fichiers.</p>${html}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn-sm" data-action="project-add-file">＋ Nouveau fichier</button><button class="btn-sm" data-action="project-export">Exporter JSON</button><button class="btn-sm" data-action="project-import">Importer JSON</button></div>`);$$('[data-project-file]').forEach(e=>e.addEventListener('click',()=>{switchFile(e.dataset.projectFile);closeModal();}));$$('[data-rename-file]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();renameProjectFile(e.dataset.renameFile);showProject();}));$$('[data-delete-file]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();closeProjectFile(e.dataset.deleteFile);showProject();}));}

/* ============ AUTOSAVE ============ */
function updateSavePill(kind,label){state.saveState=kind;els.savePill.className='save-pill '+kind;els.savePill.textContent=label;}
function markDirty(){if(state.saveState!=='dirty')updateSavePill('dirty','Modifié');scheduleAutosave();}
function scheduleAutosave(){if(state.saveTimer)clearTimeout(state.saveTimer);const delay=isLargeEditor()?Math.max(2200,settings.autosaveDelay):settings.autosaveDelay;state.saveTimer=setTimeout(()=>{performAutosave();},delay);}
function performAutosave(){
  try{
    const content=els.code.value;
    updateSavePill('saving','Sauvegarde…');
    if(content.length<LARGE_EDITOR_THRESHOLD && (content.match(/\n/g)||[]).length+1<LARGE_EDITOR_LINE_THRESHOLD){
      localStorage.setItem(STORAGE_KEYS.code,content);
    }else{
      const f=activeFile();if(f)f.code=content;
      saveProject();
      try{localStorage.removeItem(STORAGE_KEYS.code);}catch{}
    }
    localStorage.setItem(STORAGE_KEYS.lastSave,String(Date.now()));
    state.lastSavedContent=content;
    const now=new Date();
    const hh=String(now.getHours()).padStart(2,'0');
    const mm=String(now.getMinutes()).padStart(2,'0');
    const ss=String(now.getSeconds()).padStart(2,'0');
    updateSavePill('saved',`Sauvegardé ${hh}:${mm}:${ss}`);
    scheduleAutoSnapshot();
  }catch(e){updateSavePill('dirty','Erreur de sauvegarde');console.error('Autosave error:',e);}
}
function saveLocal(){markDirty();}
function saveLocalNow(){if(state.saveTimer){clearTimeout(state.saveTimer);state.saveTimer=null;}performAutosave();}
function loadLocal(){try{return localStorage.getItem(STORAGE_KEYS.code);}catch{return null;}}
function loadLastSaveTime(){
  try{
    const t=localStorage.getItem(STORAGE_KEYS.lastSave);
    if(!t)return null;
    const d=new Date(parseInt(t,10));
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    return `${hh}:${mm}`;
  }catch{return null;}
}

/* ============ BIBLIOTHÈQUE (helpers) ============ */
let librarySource='';
let libraryFunctionsCache=null;
function loadLibrary(){try{librarySource=localStorage.getItem(STORAGE_KEYS.library)||'';}catch{librarySource='';}libraryFunctionsCache=null;}
function saveLibrarySource(src){librarySource=src;try{localStorage.setItem(STORAGE_KEYS.library,src);}catch(e){toast('Erreur sauvegarde: '+e.message,'err');return false;}libraryFunctionsCache=null;return true;}
function getLibraryFunctions(){
  if(libraryFunctionsCache!==null)return libraryFunctionsCache;
  if(!librarySource.trim()){libraryFunctionsCache=[];return[];}
  const wrapped=`Algorithme Lib\nVariables\n${librarySource}\nDebut\nFin`;
  const {tokens,errors}=lex(wrapped);
  const parser=new Parser(tokens,errors);
  let ast;
  try{ast=parser.parseProgram();}catch{libraryFunctionsCache=[];return[];}
  if(parser.errors.filter(e=>e.severity==='error').length>0){libraryFunctionsCache=[];return[];}
  libraryFunctionsCache=ast.functions;
  return ast.functions;
}

/* ============ ÉDITEUR ============ */
function setEditorContent(text,skipHistory){
  els.code.value=String(text??'');
  invalidateEditorSizeCache();
  const large=isLargeEditor();
  if(large){
    editorBulkPending=true;
    refreshEditorLight();
    if(!startupLoading)scheduleLargeEditorUI();
  }else{
    refreshEditor();
  }
  if(!skipHistory){commitEditorSnapshot();}
}
// Patch 10 : respecter le mode gros fichier pour éviter le re-lex complet lors
// des retours undo/redo ou des quick-fixes sur des fichiers volumineux.
function refreshEditor(force){
  if(!force && isLargeEditor()){return refreshEditorLight();}
  // v12.42 : retire le flag .large-editing avant tout rendu normal,
  // sinon #code garde color:transparent après réduction d'un gros fichier.
  setLargeEditorMode(false);
  const constants=new Set();
  if(state.ast)for(const c of (state.ast.constants||[]))constants.add(c.name.toLowerCase());
  state.matches=settings.showBracketMatch?findMatchingBrackets(els.code.value,els.code.selectionStart):[];
  els.highlight.innerHTML=highlight(els.code.value,state.diagnostics,state.matches,constants);
  updateGutter();
  updateStatusPosition();
  updateIndentGuides();
  refreshQuickInsert();
  updateFoldOverlays();
}
function updateGutter(){
  els.gutterInner.classList.remove('gutter-lite');
  els.gutterInner.style.removeProperty('line-height');
  els.gutterInner.style.removeProperty('white-space');
  els.gutterInner.style.removeProperty('text-align');
  els.gutterInner.style.removeProperty('padding-right');
  const lines=els.code.value.split('\n');
  const n=lines.length;
  state.foldRanges=computeFoldRanges(els.code.value);
  const foldableStart=new Map();
  for(const r of state.foldRanges)foldableStart.set(r.openLine,r);
  let html='';
  for(let i=0;i<n;i++){
    const lineNum=i+1;
    const hasBP=state.breakpoints.has(lineNum);
    const bpCond=breakpointConditions.get(lineNum)||'';
    const isCurrent=lineNum===state.currentLine;
    const foldable=foldableStart.has(i);
    const folded=foldable&&state.foldedLines.has(i);
    html+=`<div class="gutter-line${isCurrent?' current-line':''}" data-line="${lineNum}">
      <span class="bp-slot${hasBP?' has-bp':''}" data-bp="${lineNum}" title="${hasBP?(bpCond?'Condition : '+escapeHtml(bpCond):'Breakpoint'):'Ajouter un breakpoint'}"></span>
      ${settings.showFoldMarkers&&foldable?`<span class="fold-slot foldable${folded?' folded':''}" data-fold="${i}"></span>`:'<span class="fold-slot"></span>'}
      <span class="line-num">${lineNum}</span>
    </div>`;
  }
  els.gutterInner.innerHTML=html;
}
els.gutterInner.addEventListener('click',e=>{
  const slot=e.target.closest('.bp-slot');
  if(slot){
    const line=parseInt(slot.dataset.bp,10);
    if(state.breakpoints.has(line))state.breakpoints.delete(line);
    else state.breakpoints.add(line);
    persistWorkspaceSoon();updateGutter();return;
  }
  const fold=e.target.closest('.fold-slot');
  if(fold&&fold.classList.contains('foldable')){
    const line=parseInt(fold.dataset.fold,10);
    if(state.foldedLines.has(line))state.foldedLines.delete(line);
    else state.foldedLines.add(line);
    persistWorkspaceSoon();updateGutter();updateFoldOverlays();
  }
  const gl=e.target.closest('.gutter-line');
  if(gl&&!e.target.closest('.bp-slot')&&!e.target.closest('.fold-slot')){goToLine(parseInt(gl.dataset.line,10),1);}
});
els.gutterInner.addEventListener('dblclick',e=>{const slot=e.target.closest('.bp-slot');if(!slot)return;const line=+slot.dataset.bp;const current=breakpointConditions.get(line)||'';const cond=prompt('Condition du breakpoint ligne '+line+' (vide = normal) :',current);if(cond===null)return;if(cond.trim())breakpointConditions.set(line,cond.trim());else breakpointConditions.delete(line);state.breakpoints.add(line);persistWorkspaceSoon();updateGutter();});
function updateStatusPosition(){
  const pos=els.code.selectionStart;

  const member=before.match(/([A-Za-z_À-ÿ][A-Za-z0-9_À-ÿ]*(?:\.[A-Za-z_À-ÿ][A-Za-z0-9_À-ÿ]*)*)\.([A-Za-z0-9_À-ÿ]*)$/);

function findCallContext(text,pos){
  let depth=0;
  const limit=Math.max(0,pos-1200);
  for(let i=pos-1;i>=limit;i--){
    const c=text[i];
    if(c===')'){depth++;}
    else if(c==='('){
      if(depth===0){
        let j=i-1;
        while(j>=0&&/\s/.test(text[j]))j--;
        const end=j+1;
        while(j>=0&&/[a-zA-Z0-9_\u00C0-\u017F]/.test(text[j]))j--;
        const name=text.slice(j+1,end);
        if(!name)return null;
        let d=0,argIdx=0;
        for(let k=i+1;k<pos;k++){
          const ch=text[k];
          if(ch==='('||ch==='[')d++;
          else if(ch===')'||ch===']')d--;
          else if(ch===','&&d===0)argIdx++;
        }
        return{name,argIdx,openParen:i};
      }
      depth--;
    }
    else if(c==='\n'&&depth===0){return null;}
  }
  return null;
}
function getCallDoc(name){
  const key=name.toLowerCase();
  if(PSEUDO_DOCS[key])return{...PSEUDO_DOCS[key],kind:PSEUDO_DOCS[key].kind||'instruction'};
  if(BUILTIN_DOCS[key]){
    const sig=BUILTIN_SIGS[key];
    const ret=sig&&sig.ret&&sig.ret!=='vide'?`Retourne ${sig.ret}.`:'';
    return{sig:BUILTIN_DOCS[key].sig,desc:(BUILTIN_DOCS[key].desc||'')+(ret?' '+ret:''),ex:BUILTIN_DOCS[key].ex,kind:'fonction prédéfinie'};
  }
  if(state.ast){
    const tm=buildTypeMap();
    const fn=(state.ast.functions||[]).find(f=>f.name.toLowerCase()===key);
    if(fn){
      const params=fn.params.map(p=>`${p.byRef?'Var ':''}${p.name} : ${typeToString(resolveType(p.typeInfo,tm))}`).join(', ');
      const ret=fn.returnType?` : ${typeToString(resolveType(fn.returnType,tm))}`:'';
      const sig=`${fn.type==='Function'?'Fonction':'Procedure'} ${fn.name}(${params})${ret}`;
      const desc=fn.type==='Function'
        ?`Fonction définie dans votre algorithme${fn.returnType?` — retourne ${typeToString(resolveType(fn.returnType,tm))}`:''}.`
        :'Procédure définie dans votre algorithme — ne retourne pas de valeur.';
      const refs=fn.params.filter(p=>p.byRef).map(p=>p.name);
      const ex=refs.length?`Paramètre(s) Var : ${refs.join(', ')} — la variable passée sera modifiée.`:'';
      return{sig,desc,ex,kind:fn.type==='Function'?'votre fonction':'votre procédure',fn};
    }
  }
  return null;
}
function renderSignature(sig,argIdx){
  const m=String(sig).match(/^([^(]*)\((.*)\)(.*)$/);
  if(!m)return escapeHtml(sig);
  const head=m[1],inner=m[2],tail=m[3];
  if(!inner.trim())return escapeHtml(sig);
  const parts=[];
  let d=0,cur='';
  for(const ch of inner){
    if(ch==='('||ch==='[')d++;
    else if(ch===')'||ch===']')d--;
    if(ch===','&&d===0){parts.push(cur);cur='';}
    else cur+=ch;
  }
  parts.push(cur);
  const rendered=parts.map((p,i)=>{const t=p.trim();return i===argIdx?`<span class="sig-current">${escapeHtml(t)}</span>`:escapeHtml(t);}).join(', ');
  return escapeHtml(head)+'('+rendered+')'+escapeHtml(tail);
}
function updateSignatureHint(){
  if(!els.sigHint)return;
  if(document.activeElement!==els.code){hideSignatureHint();return;}
  if(autocomplete.visible){hideSignatureHint();return;}
  const ctx=findCallContext(els.code.value,els.code.selectionStart);
  if(!ctx){hideSignatureHint();return;}
  const doc=getCallDoc(ctx.name);
  if(!doc){hideSignatureHint();return;}
  let html=`<div class="sig-title">${renderSignature(doc.sig,ctx.argIdx)}<span class="sig-kind">${escapeHtml(doc.kind||'')}</span></div>`;
  if(doc.desc)html+=`<div class="sig-desc">${escapeHtml(doc.desc)}</div>`;
  if(doc.ex)html+=`<div class="sig-ex">${escapeHtml(doc.ex)}</div>`;
  if(doc.fn&&doc.fn.params.length){
    const tm=buildTypeMap();
    html+=`<div class="sig-params">${doc.fn.params.map((p,i)=>
      `${i===ctx.argIdx?'<span class="cur">▶</span> ':''}<b>${escapeHtml(p.name)}</b> : ${escapeHtml(typeToString(resolveType(p.typeInfo,tm)))}${p.byRef?' <span style="color:var(--warning)">(Var)</span>':''}`
    ).join(' · ')}</div>`;
  }
  html+=`<div class="sig-foot">Paramètre ${Math.min(ctx.argIdx+1,99)} · Échap pour masquer</div>`;
  els.sigHint.innerHTML=html;
  els.sigHint.hidden=false;
  const pos=getCaretPosition();
  let left=pos.left,top=pos.top+6;
  els.sigHint.style.left=Math.round(left)+'px';
  els.sigHint.style.top=Math.round(top)+'px';
  requestAnimationFrame(()=>{
    const r=els.sigHint.getBoundingClientRect();
    let l=left,t=top;
    if(r.right>window.innerWidth-8)l=Math.max(8,window.innerWidth-r.width-8);
    if(r.bottom>window.innerHeight-8)t=Math.max(8,pos.top-r.height-24);
    if(r.left<8)l=8;
    els.sigHint.style.left=Math.round(l)+'px';
    els.sigHint.style.top=Math.round(t)+'px';
  });
}

function expandProjectImports(rootAst,rootId){
  const out={types:[],constants:[],vars:[],functions:[],diagnostics:[]};
  const seen=new Set([String(rootId||'')]),stack=[];
  const byName=new Map(projectState.files.map(f=>[String(f.name||'').toLowerCase(),f]));
  function visit(ast){
    for(const impRaw of (ast.imports||[])){
      const base=String(impRaw);
      const names=[base,base.endsWith('.algo')?base:base+'.algo'];
      const f=names.map(n=>byName.get(n.toLowerCase())).find(Boolean);
      if(!f){out.diagnostics.push({line:ast.line||1,col:1,severity:'error',code:'E071',message:`Module « ${base} » introuvable.`,suggestion:'Vérifiez le nom du fichier du module.'});continue;}
      if(seen.has(String(f.id))){if(stack.includes(String(f.id)))out.diagnostics.push({line:ast.line||1,col:1,severity:'error',code:'E072',message:`Dépendance circulaire détectée via « ${f.name} ».`});continue;}
      seen.add(String(f.id));stack.push(String(f.id));
      const {tokens,errors}=lex(f.code);const pp=new Parser(tokens,errors);let child=null;try{child=pp.parseProgram();}catch(e){pp.errors.push({line:1,col:1,severity:'error',code:'E073',message:`Module « ${f.name} » : ${e.message}`});}
      if(pp.errors.some(e=>e.severity==='error'))out.diagnostics.push(...pp.errors);
      if(child){visit(child);out.types.push(...(child.types||[]));out.constants.push(...(child.constants||[]));out.vars.push(...(child.vars||[]));out.functions.push(...(child.functions||[]));}
      stack.pop();
    }
  }
  visit(rootAst);
  for(const key of ['types','constants','vars','functions']){const ks=new Set();out[key]=out[key].filter(x=>{const k=String(x.name||'').toLowerCase();if(ks.has(k))return false;ks.add(k);return true;});}
  return out;
}
function showModuleGraph(){
  saveProject();let h='<p class="lib-hint">Dépendances des fichiers via « Importer module.algo ».</p>';
  projectState.files.forEach(f=>{const {tokens,errors}=lex(f.code),pp=new Parser(tokens,errors);let a=null;try{a=pp.parseProgram();}catch{}const deps=a?.imports?.join(', ')||'Aucune';h+=`<div class="version-item"><div><b>${escapeHtml(f.name)}</b></div><small>${escapeHtml(deps)}</small></div>`;});

function validateDeclaredArrayUsage(src,ast,diags){

function parseCode(){

      const sourceLines=src.split('\n');
      sourceLines.forEach((raw,index)=>{
        const line=raw.replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').trim();
        if(/^tantque\b/i.test(line)&&/\bou\b/i.test(line)&&/(>=?|<=?)/.test(line)){
          const body=sourceLines.slice(index+1,Math.min(sourceLines.length,index+18)).join('\n').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>');
          const decremented=[...body.matchAll(/\b([A-Za-z_À-ÿ][\wÀ-ÿ]*)\s*<-\s*\1\s*-\s*1/gi)].map(m=>m[1]);
          if(decremented.length)allDiags.push({line:index+1,col:1,severity:'warning',code:'W376',message:`Condition TantQue avec « ou » : ${decremented.join(', ')} peut continuer après sa borne et atteindre 0.`,suggestion:'Pour rester dans les bornes de la matrice, utilisez généralement « et » entre les conditions, par exemple : TantQue ligne > 1 et colonne > 1.'});

  allDiags=allDiags.filter(d=>{if(!/n'est pas un tableau ni une chaîne|n’est pas un tableau ni une chaîne/i.test(String(d.message||'')))return true;const m=String(d.message).match(/« ([^»]+) »/);if(!m)return false;const name=m[1].trim();const escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp(`(^|[^\\wÀ-ÿ])${escaped}([^\\wÀ-ÿ]|$)`,'i').test(src);});
  const seen=new Set();
  allDiags=allDiags.filter(d=>{if(d.code==='W998')return false;const k=`${d.line}:${d.col}:${d.message}`;if(seen.has(k))return false;seen.add(k);return true;});
  // Patch 2 : tri stable par sévérité puis par ligne/colonne.
  const sevOrder={error:0,warning:1,hint:2};

}

  let html=`<div class="vars-toolbar vars-toolbar-enhanced"><div class="vars-search-wrap"><span>⌕</span><input id="varsSearch" type="search" placeholder="Rechercher une variable…" autocomplete="off"></div><div class="vars-filter-row"><button class="active" data-vars-view="all">Toutes <b>${vars.length}</b></button>${groups.map(g=>`<button data-vars-view="${g.id}">${escapeHtml(g.label)} <b>${g.items.length}</b></button>`).join('')}</div></div>`;

  for(const v of group.items){

        </div>

      </div>

      <div class="var-card-facts">

  els.vars.innerHTML=html;

function findVarValue(interp,name){
  const key=name.toLowerCase();
  for(let i=interp.ctx.callStack.length-1;i>=0;i--){
    const f=interp.ctx.callStack[i];
    if(f.values.has(key))return f.values.get(key);
  }
  if(interp.values.has(key))return interp.values.get(key);
  return null;
}
function renderArrayPreview(arr){
  const dims=arr.dims;
  if(dims.length===1){
    const d=dims[0];
    const total=d.to-d.from+1;
    if(total>30)return `<span class="var-type">${total} éléments</span>`;
    let html='<table class="var-table"><thead><tr><th>i</th>';
    for(let i=d.from;i<=d.to;i++)html+=`<th>${i}</th>`;
    html+='</tr></thead><tbody><tr><td class="var-idx">v</td>';
    for(let i=d.from;i<=d.to;i++)html+=`<td>${escapeHtml(formatCell(arr.data[i]))}</td>`;
    html+='</tr></tbody></table>';
    return html;
  }
  if(dims.length===2){
    const [d1,d2]=dims;
    const total=(d1.to-d1.from+1)*(d2.to-d2.from+1);
    if(total>64)return `<span class="var-type">matrice ${d1.to-d1.from+1}×${d2.to-d2.from+1}</span>`;
    let html='<table class="var-table"><thead><tr><th>i\\j</th>';
    for(let j=d2.from;j<=d2.to;j++)html+=`<th>${j}</th>`;
    html+='</tr></thead><tbody>';
    for(let i=d1.from;i<=d1.to;i++){
      html+=`<tr><td class="var-idx">${i}</td>`;
      for(let j=d2.from;j<=d2.to;j++)html+=`<td>${escapeHtml(formatCell(arr.data[i][j]))}</td>`;
      html+='</tr>';
    }
    html+='</tbody></table>';
    return html;
  }
  return `<span class="var-type">tableau ${dims.length}D</span>`;
}
function renderRecordPreview(rec){
  const keys=Object.keys(rec).filter(k=>!k.startsWith('__'));
  let html='<div class="var-record">';
  for(const k of keys)html+=`<div class="var-record-field"><b>${escapeHtml(k)}</b> = ${escapeHtml(formatCell(rec[k]))}</div>`;
  html+='</div>';
  return html;
}
function formatCell(v){
  if(v===undefined||v===null)return '·';
  if(v instanceof AlgoArray)return '[…]';
  if(v instanceof AlgoRecord)return '['+v.__algoType+']';
  if(typeof v==='boolean')return v?'V':'F';
  if(typeof v==='string')return v.length>12?v.slice(0,12)+'…':v;
  return String(v);
}
function openMatrixViewer(name,arr){
  const dims=arr.dims;
  let html='';
  if(dims.length===1){
    const d=dims[0];
    const total=d.to-d.from+1;
    let sum=0,min=Infinity,max=-Infinity,minIdx=-1,maxIdx=-1;
    for(let i=d.from;i<=d.to;i++){
      const v=Number(arr.data[i])||0;
      sum+=v;
      if(v<min){min=v;minIdx=i;}
      if(v>max){max=v;maxIdx=i;}
    }
    html+=`<div class="matrix-stats">
      <div class="matrix-stat">Longueur : <b>${total}</b></div>
      <div class="matrix-stat">Somme : <b>${sum}</b></div>
      <div class="matrix-stat">Moyenne : <b>${(sum/total).toFixed(2)}</b></div>
      <div class="matrix-stat">Min : <b>${min}</b> (indice ${minIdx})</div>
      <div class="matrix-stat">Max : <b>${max}</b> (indice ${maxIdx})</div>
    </div>`;
    html+='<div class="matrix-viewer"><table class="matrix-table"><thead><tr><th>i</th>';
    for(let i=d.from;i<=d.to;i++)html+=`<th>${i}</th>`;
    html+='</tr></thead><tbody><tr><td class="idx">v</td>';
    for(let i=d.from;i<=d.to;i++)html+=`<td class="cell" data-i="${i}">${escapeHtml(formatCell(arr.data[i]))}</td>`;
    html+='</tr></tbody></table></div>';
  } else if(dims.length===2){
    const [d1,d2]=dims;
    const rowSum={},colSum={};
    let total=0,min=Infinity,max=-Infinity,minPos='',maxPos='';
    for(let i=d1.from;i<=d1.to;i++){
      rowSum[i]=0;
      for(let j=d2.from;j<=d2.to;j++){
        const v=Number(arr.data[i][j])||0;
        rowSum[i]+=v;colSum[j]=(colSum[j]||0)+v;total+=v;
        if(v<min){min=v;minPos=`[${i},${j}]`;}
        if(v>max){max=v;maxPos=`[${i},${j}]`;}
      }
    }
    const count=(d1.to-d1.from+1)*(d2.to-d2.from+1);
    html+=`<div class="matrix-stats">
      <div class="matrix-stat">Dimensions : <b>${d1.to-d1.from+1} × ${d2.to-d2.from+1}</b></div>
      <div class="matrix-stat">Cellules : <b>${count}</b></div>
      <div class="matrix-stat">Somme : <b>${total}</b></div>
      <div class="matrix-stat">Moyenne : <b>${(total/count).toFixed(2)}</b></div>
      <div class="matrix-stat">Min : <b>${min}</b> ${minPos}</div>
      <div class="matrix-stat">Max : <b>${max}</b> ${maxPos}</div>
    </div>`;
    html+='<div class="matrix-viewer"><table class="matrix-table"><thead><tr><th>i\\j</th>';
    for(let j=d2.from;j<=d2.to;j++)html+=`<th>${j}</th>`;
    html+='<th>Σ ligne</th></tr></thead><tbody>';
    for(let i=d1.from;i<=d1.to;i++){
      html+=`<tr><td class="idx">${i}</td>`;
      for(let j=d2.from;j<=d2.to;j++){
        html+=`<td class="cell" data-i="${i}" data-j="${j}">${escapeHtml(formatCell(arr.data[i][j]))}</td>`;
      }
      html+=`<td class="idx">${rowSum[i]}</td></tr>`;
    }
    html+='<tr><td class="idx">Σ col</td>';
    for(let j=d2.from;j<=d2.to;j++)html+=`<td class="idx">${colSum[j]||0}</td>`;
    html+=`<td class="idx">${total}</td></tr></tbody></table></div>`;
  }
  openModal(`Aperçu : ${name} — ${typeToString({kind:'array',dims:arr.dims,elementType:arr.elementType})}`,html);
  const cells=$$('#modalBody .cell');
  cells.forEach(c=>{
    c.addEventListener('mouseenter',()=>{
      const i=c.dataset.i,j=c.dataset.j;
      cells.forEach(c2=>{
        c2.classList.remove('row-highlight','col-highlight');
        if(i&&c2.dataset.i===i)c2.classList.add('row-highlight');
        if(j&&c2.dataset.j===j)c2.classList.add('col-highlight');
      });
    });
    c.addEventListener('mouseleave',()=>cells.forEach(c2=>c2.classList.remove('row-highlight','col-highlight')));
  });
}

function openVisualizer(){
  if(!state.interpreter){
    if(!state.ast){openModal('📊 Visualiseur','<div class="lib-hint">Aucune donnée. Exécutez d\'abord un algorithme.</div>');return;}
    const tm=buildTypeMap();
    let html='<p class="lib-hint">Aucune exécution en cours — voici les tableaux déclarés dans le programme (valeurs par défaut).</p>';
    let found=false;
    for(const v of state.ast.vars){
      const rt=resolveType(v.typeInfo,tm);
      if(rt.kind==='array'){
        found=true;
        html+=`<h3>${escapeHtml(v.name)} — ${escapeHtml(typeToString(rt))}</h3>`;
        html+=`<p style="color:var(--text-dim);font-size:12px">Exécutez l'algorithme pour voir les valeurs réelles.</p>`;
      }
    }

  }
  const interp=state.interpreter;

  }
  let html='<div class="viz-toolbar"><input type="text" id="vizSearch" placeholder="Filtrer les tableaux…" autocomplete="off"></div>';

  for(const v of vars){
    html+=`<div class="viz-item" data-viz-name="${escapeHtml(v.name.toLowerCase())}">`;
    html+=`<div class="viz-title">${escapeHtml(v.name)} <small>${escapeHtml(typeToString(v.type))}</small></div>`;

  openModal('📊 Visualiseur tableau / matrice',html);

    const q=search.value.toLowerCase();
    $$('.viz-item').forEach(el=>{el.style.display=el.dataset.vizName.includes(q)?'':'none';});
  });
}
function renderArrayFull(arr){

    let sum=0,min=Infinity,max=-Infinity,minIdx=d.from,maxIdx=d.from,nonZero=0;

    }
    const avg=(sum/total).toFixed(2);
    let html=`<div class="matrix-stats">
      <div class="matrix-stat">Longueur : <b>${total}</b></div>
      <div class="matrix-stat">Somme : <b>${sum}</b></div>

      <div class="matrix-stat">Min : <b>${min}</b> (i=${minIdx})</div>

    html+='</tr></thead><tbody><tr><td class="idx">v</td>';
    const maxAbs=Math.max(1,Math.abs(max),Math.abs(min));
    for(let i=d.from;i<=d.to;i++){

      const intensity=Math.min(1,Math.abs(v)/maxAbs);
      const bg=v>=0?`rgba(122,162,247,${0.08+intensity*0.35})`:`rgba(247,118,142,${0.08+intensity*0.35})`;
      html+=`<td class="cell" data-i="${i}" style="background:${bg}">${escapeHtml(formatCell(arr.data[i]))}</td>`;
    }
    html+='</tr></tbody></table></div>';
    return html;
  }
  if(dims.length===2){
    const [d1,d2]=dims;
    const rowSum={},colSum={};
    let total=0,min=Infinity,max=-Infinity,minPos='',maxPos='';
    for(let i=d1.from;i<=d1.to;i++){
      rowSum[i]=0;
      for(let j=d2.from;j<=d2.to;j++){
        const v=Number(arr.data[i][j])||0;
        rowSum[i]+=v;colSum[j]=(colSum[j]||0)+v;total+=v;
        if(v<min){min=v;minPos=`[${i},${j}]`;}
        if(v>max){max=v;maxPos=`[${i},${j}]`;}
      }
    }
    const count=(d1.to-d1.from+1)*(d2.to-d2.from+1);
    let html=`<div class="matrix-stats">
      <div class="matrix-stat">Dimensions : <b>${d1.to-d1.from+1} × ${d2.to-d2.from+1}</b></div>
      <div class="matrix-stat">Cellules : <b>${count}</b></div>
      <div class="matrix-stat">Somme : <b>${total}</b></div>
      <div class="matrix-stat">Moyenne : <b>${(total/count).toFixed(2)}</b></div>
      <div class="matrix-stat">Min : <b>${min}</b> ${minPos}</div>
      <div class="matrix-stat">Max : <b>${max}</b> ${maxPos}</div>
    </div>`;
    html+='<div class="matrix-viewer"><table class="matrix-table viz-matrix"><thead><tr><th>i\\j</th>';
    for(let j=d2.from;j<=d2.to;j++)html+=`<th>${j}</th>`;
    html+='<th>Σ ligne</th></tr></thead><tbody>';
    const maxAbs=Math.max(1,Math.abs(max),Math.abs(min));
    for(let i=d1.from;i<=d1.to;i++){
      html+=`<tr><td class="idx">${i}</td>`;
      for(let j=d2.from;j<=d2.to;j++){
        const v=Number(arr.data[i][j])||0;
        const intensity=Math.min(1,Math.abs(v)/maxAbs);
        const bg=v>=0?`rgba(122,162,247,${0.06+intensity*0.35})`:`rgba(247,118,142,${0.06+intensity*0.35})`;
        html+=`<td class="cell" data-i="${i}" data-j="${j}" style="background:${bg}">${escapeHtml(formatCell(arr.data[i][j]))}</td>`;
      }
      html+=`<td class="idx">${rowSum[i]}</td></tr>`;
    }
    html+='<tr><td class="idx">Σ col</td>';
    for(let j=d2.from;j<=d2.to;j++)html+=`<td class="idx">${colSum[j]||0}</td>`;
    html+=`<td class="idx">${total}</td></tr></tbody></table></div>`;
    return html;
  }

/* ============ WATCH ============ */
function toggleWatch(name){
  const key=name;
  const idx=watchState.exprs.indexOf(key);
  if(idx>=0){watchState.exprs.splice(idx,1);watchState.history.delete(key);}
  else{watchState.exprs.push(key);if(!watchState.history.has(key))watchState.history.set(key,[]);}
  saveWatch();renderWatch();
  if(state.interpreter)renderVars(state.interpreter);
}
function saveWatch(){try{localStorage.setItem(STORAGE_KEYS.watch,JSON.stringify(watchState.exprs));}catch{} persistWorkspaceSoon();}
function loadWatch(){
  try{
    const raw=localStorage.getItem(STORAGE_KEYS.watch);
    if(!raw)return;
    const arr=JSON.parse(raw);
    if(Array.isArray(arr)){for(const n of arr){watchState.exprs.push(String(n));watchState.history.set(String(n),[]);}}
  }catch{}
}
function renderWatch(){
  const exprs=watchState.exprs;
  let html=`<div class="watch-add"><input type="text" id="watchInput" placeholder="Variable ou expression (i, t[2], ch[1])…" autocomplete="off" spellcheck="false"><button data-action="add-watch">+</button></div>`;
  if(!exprs.length){html+=`<div class="watch-empty">Aucune expression épinglée.<br><br>Cliquez sur une variable dans « Vars »<br>ou tapez une expression ci-dessus.</div>`;els.watch.innerHTML=html;bindWatchEvents();return;}
  for(const expr of exprs){
    const hist=watchState.history.get(expr)||[];
    let currentHtml='<span class="var-type">—</span>';
    let scopeBadge='';
    if(state.interpreter){
      try{
        const stack=state.interpreter.ctx.callStack;
        const curFrame=stack.length?stack[stack.length-1]:null;
        const scope=curFrame?curFrame.scope:state.interpreter.globalScope;
        const info=scope.lookup(expr);
        if(info&&info.name===expr){
          const scopeName=curFrame?(curFrame.locals?curFrame.name:(info.varKind||'global')):(info.varKind||'global');
          scopeBadge=`<span class="watch-scope-badge">${scopeName}</span>`;
        }
        const v=evalWatchExpression(expr,state.interpreter);
        currentHtml=renderWatchValue(v);
      }catch(e){currentHtml=`<span class="watch-error">${escapeHtml(e.message||String(e))}</span>`;}
    }
    let logHtml='';
    if(!hist.length)logHtml='<div class="watch-log-empty">Aucun changement détecté.</div>';
    else for(let i=hist.length-1;i>=0;i--){
      const e=hist[i];
      logHtml+=`<div class="watch-log-entry" data-line="${e.line}">
        <span class="watch-log-line">L${e.line}</span>
        ${e.scope?`<span class="watch-log-scope">${escapeHtml(e.scope)}</span>`:''}
        <span class="watch-log-diff"><span class="old">${escapeHtml(e.oldRepr)}</span><span class="arrow">→</span><span class="new">${escapeHtml(e.newRepr)}</span></span>
      </div>`;
    }
    html+=`<div class="watch-item" data-expr="${escapeHtml(expr)}">
      <div class="watch-header">
        <span class="watch-name">⚲ ${escapeHtml(expr)}${scopeBadge}</span>
        <button class="watch-remove" data-remove="${escapeHtml(expr)}" title="Retirer">✕</button>
      </div>
      <div class="watch-current">${currentHtml}</div>
      <div class="watch-log">${logHtml}</div>
    </div>`;
  }
  els.watch.innerHTML=html;
  bindWatchEvents();
}
function bindWatchEvents(){
  const input=$('#watchInput');
  if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=input.value.trim();if(v){toggleWatch(v);input.value='';}}});
  $$('[data-remove]',els.watch).forEach(btn=>btn.addEventListener('click',()=>toggleWatch(btn.dataset.remove)));

function evalWatchExpression(expr,interp){
  const {tokens,errors}=lex(expr);if(errors.length)throw new Error('Syntaxe invalide.');
  const p=new Parser(tokens,[]),e=p.parseExpr();if(p.errors.length)throw new Error('Syntaxe invalide.');
  const stack=interp.ctx?.callStack||[];const frame=stack[stack.length-1]||{name:'global',locals:false,values:new Map(),scope:interp.globalScope};

  const original=interp.evalSync.bind(interp);
  function evalFrameAware(x){
    if(x?.type==='Identifier'){
      const k=x.name.toLowerCase();if(interp.constants.has(k))return interp.constants.get(k).value;
      for(let i=stack.length-1;i>=0;i--)if(stack[i].values?.has(k))return stack[i].values.get(k);
      if(interp.values.has(k))return interp.values.get(k);
      throw new Error(`Variable « ${x.name} » indisponible dans la portée courante.`);
    }
    return original(x,scope,frame);
  }
  if(e.type==='Identifier')return evalFrameAware(e);
  return original(e,scope,frame);
}
function renderWatchValue(v){
  if(v instanceof AlgoArray)return `<div style="padding:2px 0">${renderArrayPreview(v)}</div>`;
  if(v instanceof AlgoRecord)return renderRecordPreview(v);

function snapshotWatched(interp){

function reprValue(v){
  if(v===undefined||v===null)return '—';
  if(typeof v==='boolean')return v?'VRAI':'FAUX';
  if(typeof v==='string')return `"${v}"`;
  if(v instanceof AlgoArray)return '[tableau]';

function diffWatched(interp,prev,line){
  if(!prev||!interp)return false;
  let changed=false;
  const curFrame=interp.ctx.callStack.length?interp.ctx.callStack[interp.ctx.callStack.length-1]:null;
  const scopeName=curFrame?(curFrame.locals?curFrame.name:'main'):'global';
  for(const expr of watchState.exprs){
    let cur;
    try{cur=evalWatchExpression(expr,interp);}catch{continue;}
    const prevVal=prev[expr];
    if(prevVal==='__ERR__')continue;
    const curKey=(cur instanceof AlgoArray)?JSON.stringify(cur.data):(cur instanceof AlgoRecord)?JSON.stringify(cur):cur;
    const prevKey=(prevVal instanceof AlgoArray)?JSON.stringify(prevVal.data):(prevVal instanceof AlgoRecord)?JSON.stringify(prevVal):prevVal;
    if(curKey===prevKey)continue;
    changed=true;
    const hist=watchState.history.get(expr)||[];
    hist.push({line,oldRepr:reprValue(prevVal),newRepr:reprValue(cur),scope:scopeName});
    if(hist.length>watchState.MAX_HISTORY)hist.shift();
    watchState.history.set(expr,hist);
  }
  return changed;
}

function renderCallStack(interp){
  if(!interp||!interp.ctx.callStack.length){
    els.callstack.innerHTML='<div class="cs-empty">Aucun appel en cours.</div>';
    return;
  }
  let html='';
  html+='<div class="cs-section-title">Pile d\'appels en cours</div>';
  const stack=interp.ctx.callStack;
  for(let i=stack.length-1;i>=0;i--){
    const f=stack[i];
    const isCurrent=i===stack.length-1;
    let localsHtml='';
    if(f.locals){
      const entries=Array.from(f.values.entries());
      for(const [k,v] of entries){
        const info=f.scope.local(k);
        localsHtml+=`<div class="cs-local"><span class="cs-local-name">${escapeHtml(k)}</span> = ${escapeHtml(formatCell(v))}${info&&info.byRef?' <span style="color:var(--warning)">•Var</span>':''}</div>`;
      }
    }
    html+=`<div class="cs-frame${isCurrent?' current':''}" data-line="${f.line}" data-frame-idx="${i}">
      <div><span class="cs-name">${escapeHtml(f.name)}</span><span class="cs-loc">ligne ${f.line}</span></div>
      ${f.locals&&localsHtml?`<div class="cs-locals">${localsHtml}</div>`:''}
    </div>`;
  }
  const hist=interp.ctx.callHistory;
  if(hist&&hist.size){
    const total=Array.from(hist.values()).reduce((s,e)=>s+e.count,0);
    html+=`<div class="cs-section-title">Historique des appels · ${total} appel${total>1?'s':''}</div>`;
    const entries=Array.from(hist.values()).sort((a,b)=>{
      if(b.count!==a.count)return b.count-a.count;
      return interp.ctx.callOrder.indexOf(a.key)-interp.ctx.callOrder.indexOf(b.key);
    });
    for(const e of entries){
      const cls=e.count===1?'one':(e.count>=10?'many':'');
      html+=`<div class="cs-hist" title="1er appel ligne ${e.firstLine}">
        <span class="cs-hist-name">ƒ ${escapeHtml(e.name)}</span>
        <span class="cs-hist-count ${cls}">${e.count}×</span>
        <span class="cs-hist-meta">1er : ligne ${e.firstLine} · dernier : ligne ${e.lastLine}</span>
      </div>`;
    }
  } else {
    html+='<div class="cs-section-title">Historique des appels</div>';
    html+='<div class="cs-hist-empty">Aucune fonction appelée pour le moment.</div>';
  }
  els.callstack.innerHTML=html;
  els.callstack.querySelectorAll('.cs-frame').forEach(el=>{
    el.addEventListener('click',()=>{
      el.classList.toggle('expanded');
      const line=parseInt(el.dataset.line,10);
      if(line)goToLine(line);
    });
  });
}

function estimateComplexity(ast){let loops=0,nested=0,maxDepth=0,recursive=0;const walk=(ss,d=0,fnName='')=>{for(const s of ss||[]){if(['For','While','Repeat'].includes(s.type)){loops++;maxDepth=Math.max(maxDepth,d+1);if(d)nested++;walk(s.body,d+1,fnName);}else if(s.type==='If'){for(const b of(s.branches||[]))walk(b.body,d,fnName);walk(s.else,d,fnName);}else if(s.type==='Switch'){for(const c of s.cases)walk(c.body,d,fnName);walk(s.default,d,fnName);}else if(s.type==='ExprStmt'&&s.expr?.type==='Call'&&fnName&&s.expr.name.toLowerCase()===fnName)recursive++;else if(s.type==='Return'&&s.value?.type==='Call'&&fnName&&s.value.name.toLowerCase()===fnName)recursive++;if(s.type==='ExprStmt'||s.type==='Return'){const e=s.expr||s.value;if(e?.type==='Call'&&!fnName){/* calls to external functions do not by themselves add loop depth */}}}};walk(ast.body,0,'');for(const fn of ast.functions||[])walk(fn.body,0,fn.name.toLowerCase());let estimate='O(1)';if(recursive)estimate='Dépendante de la récursion';else if(nested>=2)estimate='Souvent O(n³) ou plus';else if(nested===1)estimate='Souvent O(n²)';else if(loops)estimate='Souvent O(n)';return{loops,nested,recursive,estimate,maxDepth};}

async function runCodeSandbox(code,inputs,expected){
  const {tokens,errors}=lex(code);
  if(errors.length)return{pass:false,actual:errors.map(e=>e.message).join('\n')};
  const p=new Parser(tokens,errors);
  let ast;
  try{ast=p.parseProgram();}catch(e){return{pass:false,actual:e.message}};
  if(p.errors.some(e=>e.severity==='error'))return{pass:false,actual:p.errors.map(e=>e.message).join('\n')};
  const ds=typeCheck(ast);
  if(ds.some(d=>d.severity==='error'))return{pass:false,actual:ds.map(d=>d.message).join('\n')};
  const out=[];
  try{
    const ctx=new ExecutionContext();
    ctx.maxMs=Math.min(settings.timeout,3000);
    ctx.maxSteps=Math.min(settings.maxSteps,500000);
    const it=new Interpreter(ast,ctx),g=it.run();
    let i=0,r=g.next();
    while(!r.done){
      const ev=r.value;
      if(ev?.kind==='output'){while(it.output.length)out.push(it.output.shift().text);}
      else if(ev?.kind==='input'){
        if(i>=inputs.length){while(it.output.length)out.push(it.output.shift().text);return{pass:false,actual:out.join('\n')+'\n[entrée manquante]'};}
        r=g.next(inputs[i++]);continue;
      }
      r=g.next();
    }
    while(it.output.length)out.push(it.output.shift().text);
  }catch(e){
    if(e&&e.__quitRoutine)return{pass:false,actual:out.join('\n')+'\n[Quitter rencontré hors d\'une procédure — sortie anticipée]'};
    return{pass:false,actual:e.message||String(e)};
  }
  const actual=out.join('\n');
  const norm=x=>String(x).replace(/\r/g,'').trim();
  return{pass:norm(actual)===norm(expected.join('\n')),actual:actual||'∅'};
}

/* ============ EXÉCUTION ============ */
async function executeRun(){
  if(state.running)return;
  parseCode();
  const errs=state.diagnostics.filter(d=>d.severity==='error');
  if(errs.length){toast(`${errs.length} erreur(s) à corriger.`,'err');setExecState('error');return;}
  if(!state.ast){toast('Rien à exécuter.','err');return;}
  clearConsole();clearWatchHistory();timelineState.entries=[];clearMathCallHistory();
  state.running=true;state.stepping=false;
  state.ctx=new ExecutionContext();
  state.ctx.breakpoints=new Set(state.breakpoints);
  try{state.interpreter=new Interpreter(state.ast,state.ctx);state.generator=state.interpreter.run();}
  catch(e){pushLog('err','✗ '+e.message);setExecState('error');state.running=false;return;}
  updateRunButtons(true);renderWatch();renderCallStack(state.interpreter);
  setExecState('running');
  const interp=state.interpreter,gen=state.generator;
  const t0=performance.now();
  let stepCount=0;
  let lastSnapshot=snapshotWatched(interp),lastLine=1;
  try{
    await interp.ctx.waitIfPaused();
    let result=gen.next();
    while(!result.done){
      const evt=result.value;
      if(evt.kind==='line'){
        if(state.ctx.cancelled)throw new CancelledError();
        await state.ctx.waitIfPaused();
        if(state.ctx.cancelled)throw new CancelledError();
        const changed=diffWatched(interp,lastSnapshot,lastLine);
        if(changed&&state.uiTick%10===0)renderWatch();
        if(evt.line!==lastLine)state.ctx.lastBPLine=-1;
        state.currentLine=evt.line;lastLine=evt.line;state.uiTick++;
        const uiDue=state.uiTick%25===0;
        if(uiDue)recordTimeline(interp,evt.line);
        if(uiDue){updateGutter();updateCurrentLineHighlightPosition();renderCallStack(interp);renderVars(interp);}
        let shouldBreak=state.ctx.breakpoints.has(evt.line)&&state.ctx.lastBPLine!==evt.line;
        const bpCond=breakpointConditions.get(evt.line);
        if(shouldBreak&&bpCond){try{shouldBreak=interp.toBool(evalWatchExpression(bpCond,interp));}catch(err){pushLog('err','Breakpoint condition invalide ligne '+evt.line+' : '+(err.message||err));shouldBreak=true;}}
        if(shouldBreak){state.ctx.lastBPLine=evt.line;renderCallStack(interp);renderVars(interp);setStatus('run',bpCond?'⏸ Breakpoint conditionnel — L'+evt.line:'⏸ En pause (point d\'arrêt)');setExecState('paused');if(els.pauseBtn)els.pauseBtn.disabled=false;await state.ctx.waitForResume();if(els.pauseBtn)els.pauseBtn.disabled=true;setExecState('running');if(state.ctx.cancelled)throw new CancelledError();}
        stepCount++;
        if(settings.executionSpeed>0)await new Promise(r=>setTimeout(r,settings.executionSpeed));else if(stepCount%25===0)await new Promise(r=>setTimeout(r,0));
        lastSnapshot=snapshotWatched(interp);
        result=gen.next();
      } else if(evt.kind==='output'){
        while(interp.output.length)pushLog('out',interp.output.shift().text);
        result=gen.next();
      } else if(evt.kind==='tick'){
        // Yield d'anti-freeze émis par les boucles serrées ; rien à afficher.
        await new Promise(r=>setTimeout(r,0));
        result=gen.next();
      } else if(evt.kind==='call'||evt.kind==='return'){
        renderCallStack(interp);result=gen.next();
      } else if(evt.kind==='input'){
        state.awaitingInput=true;
        renderCallStack(interp);renderVars(interp);
        setExecState('paused');
        const val=await waitForConsoleInput(state.ctx,evt.name,evt.typeHint);
        state.awaitingInput=false;
        setExecState('running');
        result=gen.next(val);
      } else result=gen.next();
    }
    diffWatched(interp,lastSnapshot,lastLine);
    while(interp.output.length)pushLog('out',interp.output.shift().text);
    const dt=(performance.now()-t0).toFixed(1);
    pushLog('ok',`✓ Exécution terminée (${dt} ms)`);
    setStatus('ok',`✓ Terminé — ${dt} ms`);
    setExecState('finished');
    els.statusTiming.textContent=`${dt} ms`;
  } catch(e){
    if(e&&e.__return){while(interp.output.length)pushLog('out',interp.output.shift().text);pushLog('ok','✓ Terminé');setExecState('finished');}
    else if(e&&e.__quitRoutine){while(interp.output.length)pushLog('out',interp.output.shift().text);pushLog('ok','✓ Terminé (Quitter)');setExecState('finished');}
    else if(e&&e.cancelled){pushLog('sys','⏹ Annulé.');setExecState('stopped');}
    else{const li=state.currentLine?` (ligne ${state.currentLine})`:'';if(e?.indexError){const d=addRuntimeDiagnostic(e);pushLog('err','✗ '+d.message+li);setExecState('error');goToLine(d.line,d.col);}else{pushLog('err','✗ '+(e.message||String(e))+li);setStatus('err','✗ '+(e.message||''));setExecState('error');}}
  } finally {
    state.running=false;state.awaitingInput=false;
    updateRunButtons(false);
    renderVars(interp);renderWatch();renderCallStack(interp);
    state.currentLine=-1;updateGutter();updateCurrentLineHighlightPosition();
    els.statusNext.textContent='';
  }
}
async function executeStep(mode='into'){
  let effectiveMode=state.currentLine<0?'into':mode;
  if(mode==='out'&&!state.interpreter?.ctx?.callStack?.length)effectiveMode='into';
  if(state.running)return;
  parseCode();
  const errs=state.diagnostics.filter(d=>d.severity==='error');
  if(errs.length){toast('Erreur(s) à corriger.','err');return;}
  if(!state.ast){toast('Rien à exécuter.','err');return;}
  if(!state.stepping){
    clearConsole();clearWatchHistory();timelineState.entries=[];
    state.ctx=new ExecutionContext();
    state.ctx.breakpoints=new Set(state.breakpoints);
    try{state.interpreter=new Interpreter(state.ast,state.ctx);state.generator=state.interpreter.run();}
    catch(e){pushLog('err','✗ '+e.message);return;}
    state.stepping=true;updateRunButtons(true);renderWatch();
    setExecState('paused');
  }
  const interp=state.interpreter,gen=state.generator;
  const stepStartDepth=Math.max(1,interp.ctx.callStack.length);const stepStartLine=state.currentLine;
  const before=snapshotWatched(interp),previousLine=state.currentLine;
  try{
    let result=gen.next();
    while(!result.done){
      const evt=result.value;
      if(evt.kind==='line'){
        if(state.ctx.cancelled)throw new CancelledError();
        const changed=diffWatched(interp,before,previousLine>0?previousLine:evt.line);
        state.currentLine=evt.line;recordTimeline(interp,evt.line);
        updateGutter();updateCurrentLineHighlightPosition();
        renderVars(interp);renderCallStack(interp);
        if(changed)renderWatch();
        updateNextLinePreview(state.currentLine+1);
        if(effectiveMode==='into' || (effectiveMode==='over' && interp.ctx.callStack.length<=stepStartDepth && evt.line!==stepStartLine) || (effectiveMode==='out' && interp.ctx.callStack.length<stepStartDepth)){
          setExecState('paused');return;
        }

      } else if(evt.kind==='output'){
        while(interp.output.length)pushLog('out',interp.output.shift().text);
        result=gen.next();
      } else if(evt.kind==='tick'){
        result=gen.next();
      } else if(evt.kind==='call'||evt.kind==='return'){
        renderCallStack(interp);result=gen.next();
      } else if(evt.kind==='input'){
        state.awaitingInput=true;renderVars(interp);
        const val=await waitForConsoleInput(state.ctx,evt.name,evt.typeHint);
        state.awaitingInput=false;
        result=gen.next(val);
      } else result=gen.next();
    }
    diffWatched(interp,before,previousLine>0?previousLine:state.currentLine);
    while(interp.output.length)pushLog('out',interp.output.shift().text);
    pushLog('ok','✓ Terminé');
    renderVars(interp);renderWatch();renderCallStack(interp);
    setExecState('finished');
    stopExecution(true);
  } catch(e){
    if(e&&e.__return){while(interp.output.length)pushLog('out',interp.output.shift().text);pushLog('ok','✓ Terminé');setExecState('finished');}
    else if(e&&e.__quitRoutine){while(interp.output.length)pushLog('out',interp.output.shift().text);pushLog('ok','✓ Terminé (Quitter)');setExecState('finished');}
    else if(e&&e.cancelled){pushLog('sys','⏹ Annulé.');setExecState('stopped');}
    else{const li=state.currentLine?` (ligne ${state.currentLine})`:'';if(e?.indexError){const d=addRuntimeDiagnostic(e);pushLog('err','✗ '+d.message+li);goToLine(d.line,d.col);}else pushLog('err','✗ '+(e.message||String(e))+li);setExecState('error');}
    stopExecution(true);
  }
}
function updateNextLinePreview(line){
  const lines=els.code.value.split('\n');
  if(line>0&&line<=lines.length){els.statusNext.textContent='→ '+lines[line-1].trim().slice(0,60);}
  else els.statusNext.textContent='';
}
function stopExecution(quiet){
  if(state.ctx)state.ctx.cancel();
  state.running=false;state.stepping=false;state.awaitingInput=false;
  state.interpreter=null;state.generator=null;state.ctx=null;
  updateRunButtons(false);state.currentLine=-1;
  updateGutter();updateCurrentLineHighlightPosition();
  renderCallStack(null);
  els.statusNext.textContent='';
  if(!quiet&&state.execState!=='finished'&&state.execState!=='error')setExecState('stopped');
}
function updateRunButtons(running){
  const active=!!running||!!state.stepping;
  els.stopBtn.disabled=!active;
  els.runBtn.disabled=active;
  if(els.stepBtn)els.stepBtn.disabled=!!running&&!state.stepping;
  if(els.pauseBtn)els.pauseBtn.disabled=!running;
  syncMobileRuntimeDock();
}
function updateCurrentLineHighlightPosition(){
  const old=els.editorContainer.querySelector('.current-line-bg');
  if(old)old.remove();
  if(state.currentLine<0)return;
  const ta=els.code;
  const lines=ta.value.split('\n');
  if(state.currentLine<1||state.currentLine>lines.length)return;
  const lh=parseFloat(getComputedStyle(ta).lineHeight)||21;
  const padTop=parseFloat(getComputedStyle(ta).paddingTop)||12;
  const top=padTop+(state.currentLine-1)*lh-ta.scrollTop;
  const el=document.createElement('div');
  el.className='current-line-bg';
  el.style.top=top+'px';el.style.height=lh+'px';
  els.editorContainer.appendChild(el);
}

function loadHistory(){

}
function saveHistory(history){try{localStorage.setItem(STORAGE_KEYS.history,JSON.stringify(history));}catch{}}
function snapshotVersion(label='Auto'){
  const history=loadHistory();
  const code=els.code.value;
  if(history.length&&history[0].code===code)return;
  history.unshift({timestamp:Date.now(),code,name:state.ast?.name||'Algorithme',label});
  while(history.length>settings.historySize)history.pop();

function showHistory(){

function normalizeImportedAlgorithmText(value){
  let text=String(value??'');
  // Files copied from HTML often contain <br> and escaped operators.
  text=text.replace(/<br\s*\/?\s*>/gi,'\n');
  if(/&(?:lt|gt|amp|quot|#39);/i.test(text)){
    const area=document.createElement('textarea');
    area.innerHTML=text;
    text=area.value;
  }
  return text.replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ');
}
function sourceNeedsSafeAnalysis(src,ast){
  // Recursive routines can make the context-sensitive bounds analyser explode.
  const ownFunctions=(ast?.functions||[]).filter(fn=>Number.isFinite(fn.line));
  return ownFunctions.some(fn=>{
    const name=String(fn.name||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(!name)return false;
    const hits=src.match(new RegExp(`\\b${name}\\s*\\(`,'gi'));
    return (hits?.length||0)>1;
  });
}
function importFile(){
  const input=document.createElement('input');
  input.type='file';input.accept='.algo,.txt,.pseudo,.alg,text/*';
  input.onchange=()=>{
    const f=input.files?.[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const source=normalizeImportedAlgorithmText(reader.result||'');
      setStatus('warn',`⏳ Chargement de ${f.name}…`);
      requestAnimationFrame(()=>{
        setEditorContent(source,true);
        const af=activeFile();
        if(af){af.code=source;af.name=f.name.endsWith('.algo')?f.name:f.name+'.algo';}
        state.runtimeDiagnostics=[];
        invalidateEditorSizeCache();
        if(isLargeEditor()){
          state.analysisDeferred=true;state.ast=null;state.diagnostics=[];
          setLargeEditorMode(true);refreshEditorLight();renderProblems([]);
          if(els.analyzeNowBtn)els.analyzeNowBtn.hidden=false;
          scheduleProjectSaveSoon(3500);
          setStatus('warn',`⚡ Gros fichier chargé : ${source.length.toLocaleString('fr-FR')} caractères. Analyse automatique suspendue.`);
          toast('Fichier chargé. Cliquez sur « Analyser maintenant » lorsque vous êtes prêt.','ok');
        }else{
          requestAnimationFrame(()=>{parseCode();scheduleProjectSaveSoon(700);toast('Fichier importé.','ok');});
        }
        initEditorHistory();renderFileTabs();els.code.focus();
      });
    };
    reader.onerror=()=>toast('Impossible de lire le fichier.','err');
    reader.readAsText(f);
  };
  input.click();
}

const KEYWORD_DESCRIPTIONS={algorithme:'Programme principal',variables:'Section des variables',constante:'Valeur non modifiable',debut:'Début d’un bloc',fin:'Fin du programme',si:'Condition',alors:'Bloc vrai',sinon:'Alternative',sinonsi:'Condition alternative',finsi:'Fin de condition',pour:'Boucle comptée',tantque:'Boucle conditionnelle',repeter:'Boucle exécutée au moins une fois',jusqua:'Condition d’arrêt',fonction:'Sous-programme avec résultat',procedure:'Sous-programme sans résultat',retourner:'Renvoie une valeur',ecrire:'Affiche une valeur',lire:'Saisit une valeur',tableau:'Collection indexée, déclarable plusieurs fois',matrice:'Collection à exactement deux dimensions',et:'ET logique',ou:'OU logique',non:'Négation',div:'Division entière',mod:'Reste entier'};
function renderKeywordDescription(){const h=$('#keywordDescription');if(!h)return;h.innerHTML='<p class="lib-hint">Mots-clés acceptés par le code et alignés avec la documentation.</p>'+[...KEYWORDS].map(k=>`<div class="keyword-card"><code>${escapeHtml(k)}</code><div>${escapeHtml(KEYWORD_DESCRIPTIONS[k]||'Mot-clé réservé du langage.')}</div></div>`).join('');}
function showDocumentation(){
  const groups={
    'Chaînes de caractères':['longueur','sous_chaine','pos','nbocc','inverse','majuscule','minuscule','concatener','remplacer','repeter','inserer','supprimer','copier','compare','estvide','estlettre','estchiffre','estmajuscule','estminuscule','rang','car'],
    'Tableaux':['taille','somme','moyenne','maxtab','mintab','rechercher','echanger','retirer'],
    'Mathématiques':['abs','racine','puissance','arrondi','plafond','trunc','partieentiere','min','max','sin','cos','tan','aleatoire'],
    'Conversions':['conventier','convreel','convchaine','estnumerique']
  };
  let html='<p style="color:var(--text-dim);font-size:12.5px;margin:0 0 16px">Toutes ces fonctions sont disponibles dans vos algorithmes. Utilisez <kbd>Ctrl</kbd>+<kbd>Espace</kbd> pour les voir en autocomplétion.</p>';
  html+='<h3>Affichage &amp; saisie</h3>';
  for(const key of ['ecrire','lire']){
    const d=PSEUDO_DOCS[key];
    html+=`<div class="doc-fn">
      <div class="doc-fn-sign">${escapeHtml(d.sig)}</div>
      <div class="doc-fn-desc">${escapeHtml(d.desc)}</div>
      ${d.ex?`<div class="doc-fn-example">Exemple : ${escapeHtml(d.ex)}</div>`:''}
    </div>`;
  }
  for(const [group,fns] of Object.entries(groups)){
    html+=`<h3>${group}</h3>`;
    for(const fn of fns){
      const d=BUILTIN_DOCS[fn];
      if(!d)continue;
      html+=`<div class="doc-fn">
        <div class="doc-fn-sign">${escapeHtml(d.sig)}</div>
        <div class="doc-fn-desc">${escapeHtml(d.desc)}</div>
        ${d.ex?`<div class="doc-fn-example">Exemple : ${escapeHtml(d.ex)}</div>`:''}
      </div>`;
    }
  }
  openModal('📖 Documentation des fonctions prédéfinies',html);
}

function saveSettingsFromModal(){
  const s=settings;
  s.executionSpeed=Math.max(0,parseInt($('#cfgSpeed').value,10)||0);
  s.timeout=parseInt($('#cfgTimeout').value,10)||10000;
  s.maxSteps=parseInt($('#cfgMaxSteps').value,10)||2000000;
  s.autosaveDelay=parseInt($('#cfgAutosaveDelay').value,10)||600;
  s.fontSize=parseFloat($('#cfgFontSize').value)||13.5;
  s.indentSize=parseInt($('#cfgIndent').value,10)||2;
  s.tabSize=parseInt($('#cfgTab').value,10)||2;
  s.showFoldMarkers=$('#cfgFold').checked;
  s.showIndentGuides=$('#cfgGuides').checked;
  s.showBracketMatch=$('#cfgBracket').checked;
  s.autoScroll=$('#cfgAutoScroll').checked;
  s.wordWrap=$('#cfgWrap').checked;
  s.virtualKeyboardOpen=$('#cfgVirtualKeyboard').checked;
  s.historySize=parseInt($('#cfgHistory').value,10)||20;
  s.autoSnapshot=$('#cfgAutoSnapshot').checked;
  s.graphPoints=Math.max(2,Math.min(5000,parseInt($('#cfgGraphPoints')?.value,10)||101));
  s.graphXMin=parseFloat($('#cfgGraphXMin')?.value);s.graphXMax=parseFloat($('#cfgGraphXMax')?.value);
  s.graphYMin=parseFloat($('#cfgGraphYMin')?.value);s.graphYMax=parseFloat($('#cfgGraphYMax')?.value);
  s.graphTableRows=Math.max(10,Math.min(5000,parseInt($('#cfgGraphRows')?.value,10)||250));
  s.graphDecimals=Math.max(0,Math.min(12,parseInt($('#cfgGraphDecimals')?.value,10)||4));
  s.graphLineWidth=parseFloat($('#cfgGraphWidth')?.value)||2;s.graphColor=$('#cfgGraphColor')?.value||'#4f8cff';
  s.graphAutoY=!!$('#cfgGraphAutoY')?.checked;s.graphGrid=!!$('#cfgGraphGrid')?.checked;s.graphShowPoints=!!$('#cfgGraphDots')?.checked;
  s.fileMaxKB=Math.max(32,parseInt($('#cfgFileMaxKB')?.value,10)||1024);s.fileBackupCount=Math.max(1,parseInt($('#cfgFileBackups')?.value,10)||20);
  s.fileLineEnding=$('#cfgFileEol')?.value||'LF';s.fileWarnLarge=!!$('#cfgFileWarn')?.checked;
  s.fileTrimTrailing=!!$('#cfgFileTrim')?.checked;s.fileFinalNewline=!!$('#cfgFileFinalNL')?.checked;s.fileNormalizeOnSave=!!$('#cfgFileNormalize')?.checked;
  if(!(s.graphXMax>s.graphXMin)){s.graphXMin=-10;s.graphXMax=10;}
  if(!(s.graphYMax>s.graphYMin)){s.graphYMin=-10;s.graphYMax=10;}
  saveSettings();applySettings();refreshEditor(true);closeModal();
  toast('Paramètres enregistrés.','ok');
}

    <h3>Exemples d'algorithmes classiques <span id="libExampleCount" style="color:var(--text-dim);font-weight:400;font-size:12px"></span></h3>
    ${examplesHtml}
    <h3>Fonctions actuelles</h3>
    <div id="libList">${list}</div>
    <h3>Source</h3>
    <textarea id="libSource" style="width:100%;height:220px;font-family:var(--font-mono);font-size:12px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;outline:none;resize:vertical">${escapeHtml(librarySource)}</textarea>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
      <button class="btn-sm" data-action="lib-save" style="background:var(--accent);color:#fff">Enregistrer</button>
      <button class="btn-sm" data-action="lib-add-selection">Ajouter la sélection</button>
      <button class="btn-sm" data-action="lib-import">Importer</button>
      <button class="btn-sm" data-action="lib-export">Exporter</button>
      <button class="btn-sm" data-action="lib-clear" style="color:var(--error)">Vider</button>
    </div>

        if(match)visible++;
      });

function libraryRoutineSource(name){
  const escaped=String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`(?:Fonction|Procedure)\\s+${escaped}\\b[\\s\\S]*?Fin(?:Fonction|Procedure)`,`i`);
  return (librarySource.match(re)||[])[0]||'';
}
function insertRoutineIntoEditor(source,name){
  source=String(source||'').trim();if(!source)return toast(`Source de « ${name} » introuvable.`,'err');
  const existing=new RegExp(`\\b(?:Fonction|Procedure)\\s+${String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i');
  if(existing.test(els.code.value))return toast(`« ${name} » existe déjà dans l’éditeur.`,'warn');
  const lines=els.code.value.split('\n');let at=lines.findIndex(line=>/^\\s*Debut\\b/i.test(line));if(at<0)at=lines.length;
  lines.splice(at,0,source,'');setEditorContent(lines.join('\n'));parseCode();markDirty();saveProject();closeModal();
  const insertedLine=at+1;goToLine(insertedLine);toast(`« ${name} » insérée dans l’éditeur. Elle est maintenant vérifiée et exécutable.`,'ok');
}
function bindLibraryEvents(){
  $$('[data-insert-lib-fn]').forEach(btn=>btn.addEventListener('click',()=>insertRoutineIntoEditor(libraryRoutineSource(btn.dataset.insertLibFn),btn.dataset.insertLibFn)));
  $$('[data-del-fn]').forEach(el=>{
    el.addEventListener('click',()=>{
      const name=el.dataset.delFn;const ta=$('#libSource');if(!ta)return;
      const re=new RegExp(`(Fonction|Procedure)\\s+${name}\\b[\\s\\S]*?Fin(Fonction|Procedure)\\s*`,'i');
      ta.value=ta.value.replace(re,'').trim()+'\n';
      el.closest('.lib-fn').remove();
    });
  });
}
function validateLibrary(src){
  if(!src.trim())return{ok:true,functions:[]};
  const wrapped=`Algorithme Lib\nVariables\n${src}\nDebut\nFin`;
  const {tokens,errors}=lex(wrapped);
  const parser=new Parser(tokens,errors);
  let ast;
  try{ast=parser.parseProgram();}catch(e){return{ok:false,errors:[{line:1,col:1,message:'Erreur de parsing: '+e.message}]};}
  const errs=parser.errors.filter(e=>e.severity==='error');
  if(errs.length)return{ok:false,errors:errs};
  return{ok:true,functions:ast.functions};
}
function saveLibraryFromModal(){
  const ta=$('#libSource');if(!ta)return;
  const v=validateLibrary(ta.value);const status=$('#libStatus');
  if(!v.ok){status.innerHTML=`<span style="color:var(--error)">✗ ${v.errors.length} erreur(s) : ${escapeHtml(v.errors[0].message)}</span>`;return;}
  if(!saveLibrarySource(ta.value)){status.innerHTML=`<span style="color:var(--error)">Erreur de sauvegarde.</span>`;return;}
  status.innerHTML=`<span style="color:var(--success)">✓ ${v.functions.length} fonction(s) enregistrée(s)</span>`;
  parseCode();toast(v.functions.length+' fonction(s) enregistrée(s)','ok');
}
function addSelectionToLibrary(){
  const ta=$('#libSource');if(!ta)return;
  const selStart=els.code.selectionStart,selEnd=els.code.selectionEnd;
  let sel=els.code.value.slice(selStart,selEnd).trim();
  if(!sel){
    const pos=els.code.selectionStart;
    const before=els.code.value.slice(0,pos),after=els.code.value.slice(pos);
    const fnStart=Math.max(before.lastIndexOf('Fonction'),before.lastIndexOf('Procedure'));
    if(fnStart<0){toast('Sélectionnez une fonction.','err');return;}
    const fnEnd1=after.search(/\bFinFonction\b/),fnEnd2=after.search(/\bFinProcedure\b/);
    const ends=[fnEnd1,fnEnd2].filter(x=>x>=0);
    if(!ends.length){toast('Sélectionnez une fonction complète.','err');return;}
    const end=Math.min(...ends);
    const endWord=after.slice(end).match(/^(FinFonction|FinProcedure)/)[0];
    sel=els.code.value.slice(fnStart,pos+end+endWord.length);
  }
  const v=validateLibrary(sel);
  if(!v.ok){toast('Fonction invalide : '+v.errors[0].message,'err');return;}
  ta.value=(ta.value.trim()+'\n\n'+sel.trim()).trim();
  toast('Ajouté. Cliquez Enregistrer.','ok');
}
function exportLibrary(){
  if(!librarySource.trim()){toast('Bibliothèque vide.','err');return;}
  const blob=new Blob([librarySource],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='bibliotheque.algo';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Bibliothèque exportée.','ok');
}
function importLibrary(){
  const input=document.createElement('input');
  input.type='file';input.accept='.algo,.txt,text/*';
  input.onchange=()=>{
    const f=input.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const src=String(reader.result);
      const v=validateLibrary(src);
      if(!v.ok){toast('Fichier invalide : '+v.errors[0].message,'err');return;}
      const ta=$('#libSource');
      if(ta)ta.value=(ta.value.trim()+'\n\n'+src.trim()).trim();
      else saveLibrarySource(src);
      toast('Fichier importé.','ok');
    };
    reader.readAsText(f);
  };
  input.click();
}

els.code.addEventListener('paste',e=>{
  const pasted=normalizeImportedAlgorithmText(e.clipboardData?.getData('text/plain')||'');
  if(!pasted){editorBulkPending=true;return;}
  const start=els.code.selectionStart,end=els.code.selectionEnd;
  const projectedLength=els.code.value.length-(end-start)+pasted.length;
  if(pasted.length<20000&&projectedLength<LARGE_EDITOR_THRESHOLD){editorBulkPending=true;return;}
  e.preventDefault();
  const before=els.code.value.slice(0,start),after=els.code.value.slice(end);
  editorBulkPending=true;els.code.value=before+pasted+after;
  const next=start+pasted.length;els.code.setSelectionRange(next,next);
  invalidateEditorSizeCache();
  const af=activeFile();if(af)af.code=els.code.value;
  state.analysisDeferred=true;state.ast=null;state.diagnostics=[];state.runtimeDiagnostics=[];
  setLargeEditorMode(true);refreshEditorLight();renderProblems([]);

/* ============ v10.0 PRODUCTIVITY / LEARNING EXTENSIONS ============ */
function findFunctionContainingLine(line){
  const ast=state.ast;if(!ast||!Array.isArray(ast.functions))return null;
  const lines=els.code.value.split('\n');
  for(const fn of ast.functions){
    const start=Math.max(1,fn.line||1);
    let end=lines.length;
    for(let i=start-1;i<lines.length;i++){
      if(/^\s*Fin(?:Fonction|Procedure)\b/i.test(lines[i]||'')){end=i+1;break;}
    }
    if(line>=start&&line<=end)return fn;
  }
  return null;
}
function findDeclarationInfo(name,line){
  const fn=findFunctionContainingLine(line);
  return fn?{kind:'local',scope:'local',fn,name}:{kind:'global',scope:'global',fn:null,name};
}
function normalizeDeclarationScope(info,name,line){
  const x=info||{};
  const local=x.scope==='local'||x.kind==='local';
  const fn=x.fn||findFunctionContainingLine(line);
  return {kind:local?'local':'global',scope:local?'local':'global',fn:local?fn:null,name:x.name||name};
}
function declarationTypeLabel(typeInfo){
  if(!typeInfo)return 'entier';
  if(typeInfo.kind==='named')return typeInfo.name||'entier';
  if(typeInfo.kind==='array'){
    const dims=(typeInfo.dims||[]).map(d=>`${exprText(d.from)}..${exprText(d.to)}`).join(', ');
    return `tableau[${dims}] de ${declarationTypeLabel(typeInfo.elementType)}`;
  }
  return typeInfo.kind||'entier';
}
function lookupDeclaredType(name,fn){
  const k=String(name||'').toLowerCase(),ast=state.ast;if(!ast)return null;
  const tm=new Map((ast.types||[]).map(t=>[String(t.name).toLowerCase(),t]));
  const f=fn&&(ast.functions||[]).find(x=>x===fn||String(x.name).toLowerCase()===String(fn.name).toLowerCase());
  if(f){const p=(f.params||[]).find(x=>String(x.name).toLowerCase()===k);if(p)return resolveType(p.typeInfo,tm);const v=(f.vars||[]).find(x=>String(x.name).toLowerCase()===k);if(v)return resolveType(v.typeInfo,tm);}
  const v=(ast.vars||[]).find(x=>String(x.name).toLowerCase()===k);if(v)return resolveType(v.typeInfo,tm);
  return null;
}
function inferExprTypeForQuickFix(e,fn,depth=0){
  if(!e||depth>15)return null;
  if(e.type==='Number')return e.isReal?'reel':'entier';
  if(e.type==='String')return 'chaine';
  if(e.type==='Char')return 'caractere';
  if(e.type==='Bool')return 'booleen';
  if(e.type==='Identifier')return lookupDeclaredType(e.name,fn)?.kind||null;
  if(e.type==='Index'){
    const bt=lookupDeclaredType(e.target?.name,fn);
    if(bt?.kind==='array')return bt.elementType?.kind||null;
    if(bt?.kind==='chaine')return 'caractere';
  }
  if(e.type==='Unary')return e.op==='non'?'booleen':inferExprTypeForQuickFix(e.operand,fn,depth+1);
  if(e.type==='Binary'){
    if(['=','<>','<','>','<=','>=','et','ou'].includes(e.op))return 'booleen';
    const l=inferExprTypeForQuickFix(e.left,fn,depth+1),r=inferExprTypeForQuickFix(e.right,fn,depth+1);
    if(e.op==='+'&&(l==='chaine'||r==='chaine'))return 'chaine';
    if(l==='reel'||r==='reel'||e.op==='/')return 'reel';
    if(l==='entier'||r==='entier')return 'entier';
  }
  if(e.type==='Call'){
    const ast=state.ast;
    const tm=new Map(((ast?.types)||[]).map(t=>[String(t.name).toLowerCase(),t]));
    const fnDef=(ast?.functions||[]).find(x=>String(x.name).toLowerCase()===String(e.name).toLowerCase());
    if(fnDef?.returnType)return resolveType(fnDef.returnType,tm)?.kind||null;
    const sig=BUILTIN_SIGS[e.name.toLowerCase()];if(sig)return typeFromName(sig.ret)?.kind||null;
  }

}
function inferIndexedVariableShape(name,line){
  const src=els.code.value,escaped=String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`\\b${escaped}\\s*\\[([^\\]]+)\\]`,'gi');let match,maxDims=0,maxima=[],minima=[];
  while((match=re.exec(src))){const parts=match[1].split(',').map(x=>x.trim());maxDims=Math.max(maxDims,parts.length);parts.forEach((part,i)=>{const n=Number(part);if(Number.isInteger(n)){maxima[i]=Math.max(maxima[i]??n,n);minima[i]=Math.min(minima[i]??n,n);}});}
  if(!maxDims)return null;
  const usageLine=(src.split('\n')[Math.max(0,(line||1)-1)]||'');
  let element='entier';
  if(/\b(vrai|faux)\b/i.test(usageLine))element='booleen';
  else if(/["'][^"']*["']/.test(usageLine))element='chaine';
  else if(/\d+\.\d+/.test(usageLine))element='reel';
  const dims=Array.from({length:maxDims},(_,i)=>{const lo=Math.min(0,minima[i]??0),hi=Math.max(lo+9,maxima[i]??9);return `${lo}..${hi}`;});
  return {kind:maxDims===2?'matrice':'tableau',dimensions:maxDims,dims,element,typeLabel:`${maxDims===2?'matrice':'tableau'}[${dims.join(', ')}] de ${element}`,defaultValue:null};
}
function inferVariableDeclaration(name,line){
  const indexed=inferIndexedVariableShape(name,line);if(indexed)return indexed;
  const type=inferMissingVariableType(name,line);return {kind:type,typeLabel:type,defaultValue:type==='chaine'?'""':type==='caractere'?"' '":type==='booleen'?'faux':type==='reel'?'0.0':'0'};
}
function inferMissingVariableType(name,line){
  const ast=state.ast;if(!ast)return 'entier';
  const fn=findFunctionContainingLine(line),k=String(name||'').toLowerCase();
  let found=null,inferred=null;
  const match=(e)=>{
    if(!e||found)return;
    if(e.type==='Identifier'&&String(e.name).toLowerCase()===k&&e.line===line)found=e;
    if(e.left)match(e.left);if(e.right)match(e.right);if(e.operand)match(e.operand);
    if(e.target&&e.type!=='Identifier')match(e.target);if(e.args)for(const a of e.args)match(a);if(e.indices)for(const a of e.indices)match(a);
  };
  const walk=(stmts)=>{for(const s of stmts||[]){if(found&&!inferred)break;if(!s)continue;
    if(s.type==='For'&&s.line===line&&String(s.var).toLowerCase()===k){inferred='entier';break;}
    if(s.type==='Assign'){
      if(s.target?.type==='Identifier'&&String(s.target.name).toLowerCase()===k&&s.line===line){inferred=inferExprTypeForQuickFix(s.value,fn)||null;if(inferred)return;}
      match(s.target);match(s.value);
    }
    if(s.type==='Read'&&s.target?.type==='Identifier'&&String(s.target.name).toLowerCase()===k&&s.line===line){found=s.target;continue;}
    if(s.type==='Write')for(const a of s.args||[])match(a);
    if(s.type==='ExprStmt')match(s.expr);
    if(s.type==='Return')match(s.value);
    if(s.type==='If'){for(const b of s.branches||[])walk(b.body);walk(s.else);}
    if(['While','Repeat','For'].includes(s.type)){if(s.cond)match(s.cond);if(s.from)match(s.from);if(s.to)match(s.to);if(s.step)match(s.step);walk(s.body);}
    if(s.type==='Switch'){match(s.expr);for(const c of s.cases||[]){for(const v of c.values||[])match(v);walk(c.body);}walk(s.default);}
  }};
  const scanLoop=(stmts)=>{for(const s of stmts||[]){if(s.type==='For'&&s.line===line&&String(s.var).toLowerCase()===k)return true;if(s.body&&scanLoop(s.body))return true;if(s.type==='If'&&((s.branches||[]).some(b=>scanLoop(b.body))||scanLoop(s.else)))return true;if(s.type==='Switch'&&((s.cases||[]).some(c=>scanLoop(c.body))||scanLoop(s.default)))return true;}return false;};
  if(scanLoop(ast.body)||(ast.functions||[]).some(f=>scanLoop(f.body)))return 'entier';
  walk(ast.body);if(!inferred)for(const f of ast.functions||[]){walk(f.body);if(inferred)break;}
  if(inferred)return inferred;
  if(found){
    const lineText=els.code.value.split('\n')[Math.max(0,line-1)]||'';
    const before=String(lineText).slice(0,Math.max(0,(found.col||1)-1));
    if(/\[[^\]]*$/.test(before))return 'entier';
  }
  return 'entier';
}
function declarationInsertionPoint(scopeInfo,name,typeLabel){
  const src=els.code.value,lines=src.split('\n');
  const charAtLine=idx=>Math.max(0,lines.slice(0,idx).reduce((n,l)=>n+l.length+1,0));

    for(let i=start;i<=end;i++){if(/^\s*Variables\s*$/i.test(lines[i]||'')){vars=i;break;}if(/^\s*Debut\b/i.test(lines[i]||'')){debut=i;break;}}

      const text=`${indent}${name} : ${typeLabel}`;
      return{lines,index:vars+1,text,charPos:charAtLine(vars+1),insertLines:1};
    }
    if(debut<0)debut=start+1;
    const baseIndent=(lines[start].match(/^\s*/)||[''])[0];
    return{lines,index:debut,textLines:['Variables',`${baseIndent}  ${name} : ${typeLabel}`],charPos:charAtLine(debut),insertLines:2};
  }
  const vars=lines.findIndex(x=>/^\s*Variables\s*$/i.test(x.trim()));
  if(vars>=0){
    const indent=(lines[vars].match(/^\s*/)||[''])[0]+'  ';
    const text=`${indent}${name} : ${typeLabel}`;
    return{lines,index:vars+1,text,charPos:charAtLine(vars+1),insertLines:1};
  }

  let debut=lines.findIndex(x=>/^\s*Debut\b/i.test(x));if(debut<0)debut=fLines[0]??lines.length;
  return{lines,index:debut,textLines:['Variables',`  ${name} : ${typeLabel}`],charPos:charAtLine(debut),insertLines:2};
}

function diagnosticScopeAt(line,name=''){
  const ast=state.ast||{},fn=(ast.functions||[]).find(f=>{const start=f.line||1,end=Math.max(start,...(f.body||[]).map(x=>x.line||0));return line>=start&&line<=end;});

function applyQuickFix(kind,name,line,diagIndex){

    const messageName=d?.scopeInfo?.name||((d?.message||'').match(/Variable(?: de boucle)? « ([^»]+) » non déclarée/)||[])[1];
    const effectiveName=String(name||messageName||'').trim();
    if(!effectiveName){toast('Nom de variable introuvable pour cette correction.','err');return;}
    const scopeInfo=normalizeDeclarationScope(d?.scopeInfo||null,effectiveName,line);
    const inferred=inferVariableDeclaration(effectiveName,line);
    const rawType=d?.scopeInfo?.typeHint||inferred.typeLabel;

    const nextLines=info.lines.slice();
    if(info.text)nextLines.splice(info.index,0,info.text);else if(info.textLines)nextLines.splice(info.index,0,...info.textLines);

    const delta=added.length;

    setEditorContent(next);
    const a=shift(oldStart),b=shift(oldEnd);
    els.code.setSelectionRange(Math.min(a,next.length),Math.min(b,next.length));

    setEditorContent(lines.join('\n'));parseCode();goToLine(at+1);markDirty();toast(`Initialisation ${q.scope.label} : ${name} <- ${q.defaultValue}`,'ok');
  }else if(kind==='index-fix'){
    const d=(Number.isInteger(diagIndex)?state.diagnostics?.[diagIndex]:null)||state.diagnostics?.find(x=>x.line===line&&x.code&&x.indexInfo);
    const info=d?.indexInfo;if(!info){goToLine(line);return;}

    const src=els.code.value,lines=src.split('\n'),li=Math.max(0,Math.min(lines.length-1,(line||1)-1)),txt=lines[li]||'';

    }
    goToLine(line,d.col||1);
    toast(`Correction manuelle : « ${info.indexExpr} » doit rester entre ${info.from} et ${info.to}.`,'warn');
  }else if(kind==='convchaine'){

  }
}

function diffText(a,b){const A=a.split('\n'),B=b.split('\n'),dp=Array(A.length+1).fill(null).map(()=>Array(B.length+1).fill(0));for(let i=A.length-1;i>=0;i--)for(let j=B.length-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,out=[];while(i<A.length||j<B.length){if(i<A.length&&j<B.length&&A[i]===B[j]){out.push(['=',A[i]]);i++;j++;}else if(j<B.length&&(i===A.length||dp[i][j+1]>=dp[i+1][j])){out.push(['+',B[j++]])}else out.push(['-',A[i++]])}return out;}

// Palette keyboard navigation
els.paletteInput?.addEventListener('keydown',e=>{
  if(!els.palette.classList.contains('open'))return;
  const items=$$('.palette-item',els.paletteList),cur=items.findIndex(x=>x.classList.contains('selected'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const d=e.key==='ArrowDown'?1:-1,n=items.length;if(!n)return;
    const idx=(cur+d+n)%n;
    items.forEach((x,i)=>x.classList.toggle('selected',i===idx));
    items[idx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    const item=items.find(x=>x.classList.contains('selected'));
    if(item){
      const all=[...COMMANDS,...V10_COMMANDS];
      const c=all.find(x=>x[1]===item.dataset.cmd);
      closePalette();
      if(c)c[3]();
    }
  }
  if(e.key==='Escape'){closePalette();}
});

<script id="v1315SimulatorVariableValueOnlyJS">
(function(){

function keepOnlyNameAndValue(root=document){

    let valueEl=row.querySelector(':scope > .sim-variable-value');
    if(!nameEl){nameEl=document.createElement('div');nameEl.className='sim-variable-name';row.prepend(nameEl);}

if(typeof renderVisualSimulation==='function'){

  renderVisualSimulation=function(){const result=base.apply(this,arguments);keepOnlyNameAndValue();return result;};
}

console.info('AlgoStudio v13.15 simulator variable/value only patch active');
})();
</script>
