const OPTION_VALUE={
  head:new Set(['-n']),tail:new Set(['-n']),split:new Set(['-l']),truncate:new Set(['-s']),cut:new Set(['-d','-f']),find:new Set(['-name','-type']),ping:new Set(['-c']),nice:new Set(['-n']),renice:new Set(['-p']),journalctl:new Set(['-n'])
};
function commandHelpLine(cmd){const d=D[cmd];return d?`Usage: ${d[1]}\nExample: ${d[2]}`:`No help available for ${cmd}.`}
function commandFailure(cmd,message){return`${cmd}: ${message}\nTry '${cmd} --help' for more information.`}
function analyzedOperands(cmd,args){
  const operands=[],needs=OPTION_VALUE[cmd]||new Set();
  for(let i=0;i<args.length;i++){
    const x=args[i];
    if(x==='--') {operands.push(...args.slice(i+1));break}
    if(needs.has(x)){
      if(i+1>=args.length)throw Error(commandFailure(cmd,`option '${x}' requires an argument`));
      i++;continue;
    }
    if(x.startsWith('-')&&x!=='-'&&!/^-[0-9]+$/.test(x))continue;
    operands.push(x);
  }
  return operands;
}
function validateCommandArgs(cmd,args){
  if(args.includes('--help'))return{help:true};
  const spec=ARG_SPECS[cmd];if(!spec)return{operands:args};
  const operands=analyzedOperands(cmd,args);
  if(spec.min!==undefined&&operands.length<spec.min){
    let detail=spec.label||'missing operand';
    if(cmd==='cp'&&operands.length===1)detail=`missing destination file operand after '${operands[0]}'`;
    else if(cmd==='mv'&&operands.length===1)detail=`missing destination file operand after '${operands[0]}'`;
    else if(cmd==='ln'&&operands.length===1)detail=`missing destination file operand after '${operands[0]}'`;
    else if(cmd==='chmod'&&operands.length===1)detail=`missing operand after '${operands[0]}'`;
    else if(cmd==='chown'&&operands.length===1)detail=`missing operand after '${operands[0]}'`;
    else if(cmd==='timeout'&&operands.length===1)detail=`missing command after '${operands[0]}'`;
    throw Error(commandFailure(cmd,detail));
  }
  if(spec.max!==undefined&&operands.length>spec.max)throw Error(commandFailure(cmd,`extra operand '${operands[spec.max]}'`));
  return{operands};
}
const VALIDATION_EXEMPT=new Set(['help','man','clear','history','pwd','df','whoami','id','groups','uname','arch','hostname','date','uptime','env','ps','free','lsblk','mount','tutorial','exportfs','importfs','reset','jobs','who','users','logname','tty','nproc','lscpu','vmstat','top','dmesg','findmnt','blkid','meminfo','cpuinfo','proctest','selftest','argtest','set']);
for(const [cmd,handler] of Object.entries(H)){
  if(VALIDATION_EXEMPT.has(cmd))continue;
  H[cmd]=async function(args=[],stdin=''){
    const result=validateCommandArgs(cmd,args);
    if(result.help)return commandHelpLine(cmd);
    return await handler(args,stdin);
  };
}
// Commands with optional operands still support --help through the same interface.
for(const cmd of VALIDATION_EXEMPT){if(!H[cmd])continue;const handler=H[cmd];H[cmd]=async function(args=[],stdin=''){if(args.includes('--help'))return commandHelpLine(cmd);return await handler(args,stdin)}}
function argumentValidationTests(){
  const cases=[
    ['mkdir',[],"mkdir: missing operand"],['touch',[],"touch: missing file operand"],['cp',[],"cp: missing file operand"],['cp',['source'],"missing destination file operand after 'source'"],['mv',['old'],"missing destination file operand after 'old'"],['ln',['target'],"missing destination file operand after 'target'"],['chmod',['755'],"missing operand after '755'"],['grep',[],"grep: missing search pattern"],['tr',['a-z'],"tr: missing operand"],['source',[],"source: missing filename"],['timeout',['2'],"missing command after '2'"],['ping',[],"ping: missing host operand"],['curl',[],"curl: no URL specified"],['sleep',[],"sleep: missing operand"],['procstat',[],"procstat: missing process or job ID"],['head',['-n'],"option '-n' requires an argument"],['find',['-name'],"option '-name' requires an argument"],['cd',['a','b'],"extra operand 'b'"]
  ];
  return cases.map(([cmd,args,expected])=>{try{validateCommandArgs(cmd,args);return{ok:false,name:`${cmd} ${args.join(' ')}`.trim(),message:'no error returned'}}catch(e){return{ok:e.message.includes(expected)&&e.message.includes(`Try '${cmd} --help'`),name:`${cmd} ${args.join(' ')}`.trim(),message:e.message}}});
}
H.argtest=()=>{const r=argumentValidationTests(),passed=r.filter(x=>x.ok).length;return`Argument validation test suite: ${passed}/${r.length} passed\n`+r.map(x=>`${x.ok?'PASS':'FAIL'}  ${x.name}${x.ok?'':' — '+x.message}`).join('\n')};
const selftestWithProcess=H.selftest;H.selftest=async a=>(await selftestWithProcess(a))+'\n'+H.argtest([]);
